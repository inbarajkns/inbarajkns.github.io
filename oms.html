<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0C10" />
<title>Indira OMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ──────────────────────────────────────────────────────────────────────────
   INDIRA OMS — Web App (port of Flutter app v23.1)
   Single-file HTML/CSS/JS + Supabase
   ────────────────────────────────────────────────────────────────────────── */

:root {
  --accent:     #E8900A;
  --accent2:    #D4720A;
  --blue:       #2D7DD2;
  --green:      #27AE60;
  --red:        #E03C31;
  --yellow:     #E67E22;
  --purple:     #8E44AD;
  --cyan:       #0EA5E9;
  --emerald:    #059669;
  --amber:      #D97706;
  --gray:       #6B7280;
  --black:      #111827;
}

:root[data-theme="dark"] {
  --bg:         #0A0C10;
  --bg2:        #111318;
  --bg3:        #1A1D24;
  --border:     #2A2D35;
  --card:       #14171F;
  --text:       #E8EAF0;
  --muted:      #8B8FA8;
  --input:      #1A1D24;
  --shadow:     0 0 0 1px rgba(0,0,0,0);
  --overlay:    rgba(0,0,0,0.55);
}

:root[data-theme="light"] {
  --bg:         #F7F8FC;
  --bg2:        #EFF0F6;
  --bg3:        #E8E9F2;
  --border:     #CCCEDD;
  --card:       #FFFFFF;
  --text:       #111827;
  --muted:      #5C607A;
  --input:      #EFF0F6;
  --shadow:     0 1px 3px rgba(0,0,0,0.06);
  --overlay:    rgba(0,0,0,0.45);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  overscroll-behavior-y: contain;
}

button { font-family: inherit; }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ─── Layout shells ─── */
.app-shell { display: flex; flex-direction: column; min-height: 100vh; }

.appbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
}
.appbar .brand {
  display: flex; flex-direction: column;
  flex: 1; min-width: 0;
}
.appbar .brand-title {
  font-size: 16px; font-weight: 700; color: var(--accent);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.appbar .brand-sub {
  font-size: 11px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.appbar .user-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 8px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px;
}
.appbar .user-pill .who {
  display: flex; flex-direction: column; align-items: flex-end;
}
.appbar .user-pill .who .name { font-size: 12px; font-weight: 700; }
.appbar .user-pill .who .role { font-size: 10px; color: var(--muted); }
.appbar .icon-btn {
  background: transparent; border: 0;
  width: 36px; height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--muted); cursor: pointer;
  border-radius: 8px;
}
.appbar .icon-btn:hover { background: var(--bg3); color: var(--text); }

.main {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding-bottom: 76px; /* room for bottom nav */
}

.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
}
.bottom-nav .nav-item {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 6px 2px;
  background: transparent; border: 0;
  color: var(--muted);
  cursor: pointer;
  position: relative;
}
.bottom-nav .nav-item .icon { font-size: 18px; line-height: 1; }
.bottom-nav .nav-item .label {
  font-size: 10px; font-weight: 500; margin-top: 3px;
  white-space: nowrap;
}
.bottom-nav .nav-item.active { color: var(--accent); }
.bottom-nav .nav-item.active .label { font-weight: 700; }
.bottom-nav .nav-item .badge {
  position: absolute; top: 2px; right: 50%;
  transform: translateX(14px);
  background: var(--red); color: #fff;
  font-size: 9px; font-weight: 800;
  border-radius: 10px;
  padding: 1px 5px; min-width: 14px; text-align: center;
  line-height: 1.2;
}

/* ─── Generic UI ─── */
.container { padding: 16px; max-width: 720px; margin: 0 auto; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  box-shadow: var(--shadow);
}
.card + .card { margin-top: 12px; }

.row { display: flex; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 8px; }
.flex1 { flex: 1; }
.muted { color: var(--muted); }
.spacer { flex: 1; }

h1,h2,h3,h4 { margin: 0; font-weight: 700; }

.section-title {
  text-transform: uppercase;
  font-size: 11px; letter-spacing: 1px;
  color: var(--accent);
  font-weight: 800;
  margin: 18px 0 8px;
}

label.field { display: block; margin-bottom: 12px; }
label.field .lbl {
  font-size: 12px; color: var(--muted);
  font-weight: 600; margin-bottom: 4px; display: block;
}

input[type=text], input[type=number], input[type=tel], input[type=email],
input[type=password], input[type=date], textarea, select {
  width: 100%;
  padding: 11px 14px;
  background: var(--input);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  font: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
  border-width: 1.5px;
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.7; }
textarea { resize: vertical; min-height: 80px; font-family: inherit; }

select {
  appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(-45deg, transparent 50%, var(--muted) 50%);
  background-position:
    calc(100% - 17px) center,
    calc(100% - 11px) center;
  background-size: 6px 6px;
  background-repeat: no-repeat;
  padding-right: 32px;
}

.btn {
  background: var(--accent);
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 12px 18px;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: filter 0.15s, transform 0.1s;
  text-decoration: none;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.full { width: 100%; }
.btn.outline {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn.outline:hover { background: var(--bg3); }
.btn.text {
  background: transparent;
  color: var(--accent);
  padding: 8px 12px;
}
.btn.text:hover { background: var(--bg3); }
.btn.green  { background: var(--green); }
.btn.red    { background: var(--red); }
.btn.blue   { background: var(--blue); }
.btn.yellow { background: var(--yellow); }
.btn.small  { padding: 7px 12px; font-size: 12px; }
.btn.outline.green  { color: var(--green); border-color: var(--green); }
.btn.outline.red    { color: var(--red); border-color: var(--red); }
.btn.outline.blue   { color: var(--blue); border-color: var(--blue); }
.btn.outline.yellow { color: var(--yellow); border-color: var(--yellow); }

/* Pills / badges */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px;
  font-size: 11px; font-weight: 700;
  border-radius: 999px;
  white-space: nowrap;
}
.tag {
  display: inline-block;
  padding: 2px 8px;
  font-size: 10px; font-weight: 800;
  border-radius: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Avatars */
.avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 800; color: #fff;
  background: var(--accent);
  font-size: 14px;
  flex-shrink: 0;
}
.avatar.lg { width: 48px; height: 48px; font-size: 17px; }
.avatar.sm { width: 28px; height: 28px; font-size: 11px; }

/* Status colors helpers */
.c-blue   { color: var(--blue); }
.c-green  { color: var(--green); }
.c-red    { color: var(--red); }
.c-yellow { color: var(--yellow); }
.c-purple { color: var(--purple); }
.c-accent { color: var(--accent); }
.c-muted  { color: var(--muted); }
.c-cyan   { color: var(--cyan); }

/* Empty state */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}
.empty .emoji { font-size: 44px; display: block; margin-bottom: 12px; }

/* Loading spinner */
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--bg3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.spinner.sm { width: 18px; height: 18px; border-width: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }

.loading-screen {
  flex: 1; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 20px;
  text-align: center;
}
.loading-screen .logo { font-size: 52px; }
.loading-screen .name {
  color: var(--accent); font-weight: 800; font-size: 22px;
}

/* Toast / snackbar */
.toast-wrap {
  position: fixed; left: 50%; bottom: 90px;
  transform: translateX(-50%);
  z-index: 200;
  pointer-events: none;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  pointer-events: auto;
  background: var(--bg3);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 13px; font-weight: 600;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  animation: toast-in 0.25s ease;
  min-width: 220px; text-align: center;
  border: 1px solid var(--border);
}
.toast.green { background: var(--green); color: #fff; border-color: transparent; }
.toast.red { background: var(--red); color: #fff; border-color: transparent; }
.toast.yellow { background: var(--yellow); color: #fff; border-color: transparent; }
@keyframes toast-in { from { transform: translateY(20px); opacity: 0; } }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: var(--overlay);
  backdrop-filter: blur(2px);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  animation: fade-in 0.2s;
}
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  max-width: 460px; width: 100%;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  animation: slide-up 0.25s ease;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.modal h3 { margin-bottom: 12px; font-size: 17px; }
.modal-actions {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 18px;
  flex-wrap: wrap;
}
@keyframes fade-in { from { opacity: 0; } }
@keyframes slide-up {
  from { transform: translateY(20px); opacity: 0; }
}

/* Bottom sheet */
.sheet-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: var(--overlay);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fade-in 0.2s;
}
.sheet {
  background: var(--card);
  width: 100%;
  max-width: 720px;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 18px 18px 0 0;
  padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
  animation: sheet-up 0.3s ease;
  border: 1px solid var(--border);
  border-bottom: 0;
}
.sheet .grabber {
  width: 44px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 4px auto 14px;
}
@keyframes sheet-up { from { transform: translateY(100%); } }

/* Dividers */
.hr { height: 1px; background: var(--border); margin: 12px 0; }

/* Tabs */
.tabs {
  display: flex;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 5;
}
.tabs .tab {
  flex: 1;
  background: transparent; border: 0;
  padding: 12px 8px;
  color: var(--muted);
  font-weight: 600; font-size: 13px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.tabs .tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 700;
}
.tabs .tab .count-badge {
  background: var(--accent); color: #fff;
  font-size: 10px; font-weight: 800;
  border-radius: 10px;
  padding: 1px 6px;
}

/* Chips */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px;
  background: var(--bg3);
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 12px; font-weight: 600;
  cursor: pointer; user-select: none;
  white-space: nowrap;
}
.chip:hover { color: var(--text); }
.chip.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-weight: 700;
}
.chip .ct {
  background: var(--bg);
  color: var(--text);
  padding: 1px 7px; border-radius: 10px;
  font-size: 10px; font-weight: 800;
  border: 1px solid var(--border);
}
.chip.active .ct {
  background: rgba(255,255,255,0.25);
  color: #fff;
  border-color: transparent;
}

/* Image thumbs */
.img-thumb {
  width: 80px; height: 80px;
  background: var(--bg3);
  border-radius: 8px;
  overflow: hidden;
  display: inline-block;
  cursor: pointer;
  border: 1px solid var(--border);
  position: relative;
  flex-shrink: 0;
}
.img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-thumb.full-w { width: 100%; height: auto; min-height: 160px; }
.img-thumb.full-w img { object-fit: contain; max-height: 280px; }
.img-thumb .rm {
  position: absolute; top: 3px; right: 3px;
  background: var(--red); color: #fff;
  width: 20px; height: 20px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  cursor: pointer;
  border: 0;
}

.upload-tile {
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 18px 12px;
  text-align: center;
  background: var(--bg3);
  cursor: pointer;
  color: var(--muted);
  font-size: 12px; font-weight: 600;
}
.upload-tile:hover { border-color: var(--accent); color: var(--accent); }
.upload-tile .emoji { font-size: 26px; display: block; margin-bottom: 4px; }

/* Order card */
.order-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: transform 0.1s, border-color 0.15s;
}
.order-card:hover { border-color: var(--accent); }
.order-card:active { transform: scale(0.99); }

/* Stat box */
.stat-box {
  flex: 1; min-width: 0;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid;
  cursor: pointer;
  transition: all 0.15s;
}
.stat-box:hover { transform: translateY(-1px); }

/* Dashboard responsive grid */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
@media (max-width: 360px) {
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}

/* Status row */
.status-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 6px;
  cursor: pointer;
}
.status-row:hover { background: var(--bg3); border-radius: 6px; }
.status-bar {
  height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden;
  margin-top: 3px;
}
.status-bar .fill { height: 100%; transition: width 0.3s; }

/* Progress */
.progress {
  height: 6px;
  background: var(--bg3);
  border-radius: 3px; overflow: hidden;
}
.progress .fill { height: 100%; background: var(--accent); transition: width 0.3s; }

/* Calendar */
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.cal-day {
  aspect-ratio: 1;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 4px 4px;
  display: flex; flex-direction: column;
  font-size: 12px;
  cursor: pointer;
  position: relative;
  background: var(--card);
}
.cal-day.muted { opacity: 0.4; }
.cal-day.today { border-color: var(--accent); border-width: 2px; }
.cal-day .num { font-weight: 700; line-height: 1; }
.cal-day .dots {
  display: flex; gap: 2px; margin-top: auto; flex-wrap: wrap;
}
.cal-day .dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent);
}
.cal-head {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 4px; margin-bottom: 6px;
  font-size: 10px; font-weight: 700; color: var(--muted);
  text-align: center; text-transform: uppercase;
}

/* Collapsible */
details summary {
  cursor: pointer; padding: 8px 0;
  list-style: none; outline: none;
  font-weight: 700;
}
details summary::-webkit-details-marker { display: none; }
details[open] summary { color: var(--accent); }

/* WhatsApp green for share */
.wa-green { background: #25D366 !important; color: #fff !important; }

/* PIN dot input */
.pin-row {
  display: flex; gap: 6px; justify-content: center;
}
.pin-row .pin-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--bg3);
  border: 1.5px solid var(--border);
}
.pin-row .pin-dot.filled { background: var(--accent); border-color: var(--accent); }

/* Image viewer (full screen) */
.viewer-backdrop {
  position: fixed; inset: 0; z-index: 200;
  background: #000;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
}
.viewer-backdrop img {
  max-width: 100%; max-height: 100%;
  object-fit: contain;
  cursor: zoom-out;
}
.viewer-backdrop .close-btn {
  position: absolute; top: 12px; right: 12px;
  background: rgba(255,255,255,0.15);
  border: 0; color: #fff;
  width: 40px; height: 40px;
  border-radius: 50%;
  font-size: 22px;
  cursor: pointer;
}
.viewer-backdrop .nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,0.12); color: #fff;
  border: 0; width: 44px; height: 44px;
  border-radius: 50%; font-size: 20px;
  cursor: pointer;
}
.viewer-backdrop .nav-btn:disabled { opacity: 0.3; }
.viewer-backdrop .prev { left: 12px; }
.viewer-backdrop .next { right: 12px; }
.viewer-backdrop .counter {
  position: absolute; bottom: 16px; left: 0; right: 0;
  text-align: center; color: #fff;
  font-weight: 700;
}

/* Setup screen */
.setup-screen {
  flex: 1; display: flex; flex-direction: column;
  padding: 32px 16px; gap: 16px;
  align-items: center; justify-content: center;
}
.setup-screen .card { max-width: 460px; width: 100%; }

/* Carpenter / per-product action box */
.action-box {
  padding: 12px;
  border-radius: 10px;
  border: 1.2px solid;
  margin: 12px 0;
}

/* Helpers for product detail */
.product-card {
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
}

.kv-row {
  display: flex; justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 13px;
}
.kv-row:last-child { border-bottom: 0; }
.kv-row .k { color: var(--muted); }
.kv-row .v { font-weight: 600; max-width: 60%; text-align: right; word-break: break-word; }

.banner {
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 12px; font-weight: 600;
  display: flex; align-items: flex-start; gap: 6px;
  border: 1px solid;
}
.banner.blue   { background: rgba(45,125,210,0.10); color: var(--blue);   border-color: rgba(45,125,210,0.25); }

/* ─── HTML helpers ───────────────────────────────────────────────────── */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  })[c]);
}
function $(sel, root=document) { return root.querySelector(sel); }
function $$(sel, root=document) { return Array.from(root.querySelectorAll(sel)); }
function el(tag, attrs={}, children=[]) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'className') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}
function avatar(name, size='') {
  const initial = (name || '?').trim().charAt(0).toUpperCase();
  const cls = 'avatar' + (size ? ' ' + size : '');
  // Same name → same color
  const colors = ['var(--accent)','var(--blue)','var(--green)','var(--purple)','var(--red)','var(--yellow)','var(--cyan)','var(--amber)'];
  let h = 0;
  for (let i = 0; i < (name||'').length; i++) h = (h*31 + (name||'').charCodeAt(i)) >>> 0;
  const bg = colors[h % colors.length];
  return `<span class="${cls}" style="background:${bg}">${esc(initial)}</span>`;
}

function fmtDate(s) {
  if (!s) return '';
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return s;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(m[3])} ${months[parseInt(m[2])-1]} ${m[1]}`;
}

/* ─── MODAL & SHEET ────────────────────────────────────────────────── */
function showModal(opts) {
  // opts: { title, body (HTML or Node), actions: [{label, onClick, kind}], onClose }
  const host = $('#modal-host');
  host.innerHTML = '';
  const back = el('div', { className: 'modal-backdrop' });
  back.addEventListener('click', (e) => { if (e.target === back) closeModal(); });
  const m = el('div', { className: 'modal' });
  if (opts.title) m.appendChild(el('h3', {}, opts.title));
  const bodyDiv = el('div', { className: 'modal-body' });
  if (typeof opts.body === 'string') bodyDiv.innerHTML = opts.body;
  else if (opts.body instanceof Node) bodyDiv.appendChild(opts.body);
  m.appendChild(bodyDiv);
  if (opts.actions && opts.actions.length) {
    const actions = el('div', { className: 'modal-actions' });
    for (const a of opts.actions) {
      const btn = el('button', {
        className: 'btn ' + (a.kind || 'text'),
        onClick: async () => {
          if (a.onClick) {
            const r = await a.onClick(m);
            if (r !== false) closeModal();
          } else {
            closeModal();
          }
        }
      }, a.label);
      actions.appendChild(btn);
    }
    m.appendChild(actions);
  }
  back.appendChild(m);
  host.appendChild(back);
  if (opts.onClose) host._onClose = opts.onClose;
  // Focus first input
  setTimeout(() => { const f = m.querySelector('input,textarea,select'); if (f) f.focus(); }, 100);
  return m;
}
function closeModal() {
  const host = $('#modal-host');
  if (host._onClose) try { host._onClose(); } catch(_) {}
  host._onClose = null;
  host.innerHTML = '';
}
function confirmDialog(title, msg, { okLabel='OK', okKind='red', cancelLabel='Cancel' } = {}) {

    showModal({
      title,
      body: `<p class="muted">${esc(msg)}</p>`,
      actions: [
        { label: cancelLabel, onClick: () => resolve(false) },
        { label: okLabel, kind: okKind, onClick: () => resolve(true) },
      ],
      onClose: () => resolve(false),
    });
  });
}
function showSheet(content) {

  return sheet;
}

function openImageViewer(urls, idx = 0) {

  function render() {
    host.innerHTML = `
      <div class="viewer-backdrop" id="viewer-bd">
        <button class="close-btn" id="vw-close">×</button>
        <img src="${esc(urls[current])}" alt="" />
        ${urls.length > 1 ? `
          <button class="nav-btn prev" id="vw-prev" ${current===0?'disabled':''}>‹</button>
          <button class="nav-btn next" id="vw-next" ${current===urls.length-1?'disabled':''}>›</button>
          <div class="counter">${current+1} / ${urls.length}</div>
        `:''}
      </div>
    `;
    $('#vw-close').onclick = () => host.innerHTML = '';
    if (urls.length > 1) {
      $('#vw-prev').onclick = () => { if (current>0) { current--; render(); } };
      $('#vw-next').onclick = () => { if (current<urls.length-1) { current++; render(); } };
    }
    $('#viewer-bd').onclick = (e) => { if (e.target.id === 'viewer-bd') host.innerHTML = ''; };
  }
  render();
}

/* ─── ORDER HELPERS (mirror models.dart) ───────────────────────────── */
function orderProducts(o) {
  // Supabase returns products as an array (jsonb)
  return Array.isArray(o.products) ? o.products : [];
}
function computedStatus(o) {
  const ps = orderProducts(o);
  if (!ps.length) return o.status || 'Order Created';
  const set = new Set(ps.map(p => p.product_status || 'Pending Approval'));
  if ([...set].every(s => s === 'Delivered')) return 'Delivered';
  if ([...set].every(s => s === 'Out for Delivery' || s === 'Delivered')) return 'Out for Delivery';
  if ([...set].some(s => s === 'Pending Approval' || s === 'Query Raised')) return 'Waiting for Branch Approval';
  const allOk = [...set].every(s => ['Approved','Sent to Factory','Order Placed','Assigned to Carpenter','In Production','Quality Check','Product Ready','Ready for Dispatch','Product Received','Out for Delivery','Delivered'].includes(s));
  if (allOk) {
    if (set.has('In Production') || set.has('Assigned to Carpenter')) return 'In Production';
    if (set.has('Quality Check')) return 'Quality Check';
    if (set.has('Order Placed')) return 'In Progress';
    if (set.has('Sent to Factory')) return 'Sent to Factory';
    return 'Approved by Branch';
  }
  return o.status || 'Order Created';
}
function autoPriority(o) {
  try {
    const created = new Date((o.created_at || '').slice(0,10));
    const delivery = new Date(o.delivery_date);
    const now = new Date();
    const totalDays = (delivery - created) / 86400000;
    if (totalDays <= 0) return 'High';
    const remaining = (delivery - now) / 86400000;
    if (remaining <= 0) return 'High';
    const elapsed = (now - created) / 86400000;
    const greenDays  = Math.ceil(totalDays * 0.5);
    const yellowDays = Math.ceil(totalDays * 0.3);
    if (elapsed < greenDays) return 'Normal';
    if (elapsed < greenDays + yellowDays) return 'Medium';
    return 'High';
  } catch(_) { return 'Normal'; }
}
function deliveryDateFor(o, role) {
  if (['factory_head','carpenter','quality_check'].includes(role)) {
    if (o.factory_delivery_date) return o.factory_delivery_date;
    try {
      const d = new Date(o.delivery_date);
      d.setDate(d.getDate() - 1);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    } catch(_) { return o.delivery_date; }
  }
  return o.delivery_date;
}
function productImages(p, key) {
  if (!p[key]) return [];
  return String(p[key]).split(',').filter(Boolean);
}
function productStatusLabel(p) {
  const s = p.product_status || 'Pending Approval';
  const M = {
    manufacture: {
      'Pending Approval': '⏳ Pending', 'Query Raised': '💬 Query',
      'Approved': '✅ Approved', 'Sent to Factory': '🏭 In Factory',
      'Assigned to Carpenter': '🔨 Assigned', 'In Production': '⚙️ In Production',

      'Ready for Dispatch': '📦 Product Ready',

    vendor: {

      'Approved': '✅ Approved', 'Order Placed': '📋 Order Placed',
      'Product Received': '📦 Product Ready', 'Product Ready': '📦 Product Ready',
      'Ready for Dispatch': '📦 Product Ready',
      'Out for Delivery': '🚚 Out for Delivery', 'Delivered': '✅ Delivered',

    stock: {

      'Approved': '✅ Approved', 'Order Placed': '📋 Order Placed',
      'Product Ready': '📦 Product Ready', 'Ready for Dispatch': '📦 Product Ready',

  return (M[p.product_type || 'manufacture'] || {})[s] || s;
}

/* ─── CHANGE PASSWORD ──────────────────────────────────────────────── */
function renderChangePassword(force = false) {
  return new Promise(resolve => {
    const back = el('div', { className: 'modal-backdrop' });
    if (!force) back.addEventListener('click', e => { if (e.target === back) { $('#modal-host').innerHTML = ''; resolve(false); } });
    const node = el('div', { className: 'modal' });
    node.innerHTML = `
      <h3>${force ? '🔐 First Login — Change Your PIN' : '🔐 Change PIN'}</h3>
      ${force ? '<div class="banner yellow mb12">⚠️ For security, please change your default PIN to a new one before continuing.</div>' : ''}
      ${!force ? '<label class="field"><span class="lbl">Current PIN</span><input id="cp-cur" type="password" inputmode="numeric" /></label>' : ''}
      <label class="field"><span class="lbl">New PIN (4+ digits)</span><input id="cp-new" type="password" inputmode="numeric" /></label>
      <label class="field"><span class="lbl">Confirm New PIN</span><input id="cp-new2" type="password" inputmode="numeric" /></label>
      <div id="cp-err" class="banner red" style="display:none"></div>
      <div class="modal-actions">
        ${!force ? '<button class="btn text" id="cp-cancel">Cancel</button>' : ''}
        <button class="btn" id="cp-save">Save</button>
      </div>
    `;
    back.appendChild(node);
    $('#modal-host').innerHTML = '';
    $('#modal-host').appendChild(back);
    if (node.querySelector('#cp-cancel')) node.querySelector('#cp-cancel').onclick = () => { $('#modal-host').innerHTML = ''; resolve(false); };
    node.querySelector('#cp-save').onclick = async () => {
      const cur = node.querySelector('#cp-cur') ? node.querySelector('#cp-cur').value : STATE.user.password;
      const n = node.querySelector('#cp-new').value;
      const n2 = node.querySelector('#cp-new2').value;
      const eb = node.querySelector('#cp-err');
      eb.style.display = 'none';
      function err(msg) { eb.style.display = ''; eb.textContent = '⚠️ ' + msg; }
      if (!force && cur !== STATE.user.password) return err('Current PIN is incorrect');
      if (n.length < 4) return err('New PIN must be at least 4 digits');
      if (!/^\d+$/.test(n)) return err('PIN must contain only numbers');
      if (n !== n2) return err('PINs do not match');
      try {
        await DB.updateUser(STATE.user.id, { password: n, pin_changed: true });
        STATE.user.password = n;
        STATE.user.pin_changed = true;
        toast('✅ PIN updated', 'green');
        $('#modal-host').innerHTML = '';
        resolve(true);
      } catch (e) { err(e.message || 'Error'); }
    };
  });
}

/* ─── ON LOGIN / LOGOUT ────────────────────────────────────────────── */
async function onLogin(user) {
  STATE.user = user;
  localStorage.setItem('iom_session_id', user.id);
  localStorage.setItem('iom_session_role', user.role);
  showSplash();
  await loadAllData();
  if (!user.pin_changed && user.role !== 'owner') {
    await renderChangePassword(true);
  }
  maybeRequestNotificationPermission();
  renderApp();
  subscribeRealtime();
}

async function onLogout() {
  for (const sub of STATE.subscriptions) {
    try { await STATE.sb.removeChannel(sub); } catch(_) {}
  }
  STATE.subscriptions = [];
  localStorage.removeItem('iom_session_id');
  localStorage.removeItem('iom_session_role');
  STATE.user = null;
  STATE.orders = []; STATE.users = []; STATE.tasks = []; STATE.enquiries = [];
  renderLogin();
}

async function loadAllData() {
  STATE.loading = true;
  try {
    const [orders, users, tasks, enquiries, customFields] = await Promise.all([
      DB.getOrders(),
      DB.getUsers(),
      DB.getTasks().catch(() => []),
      DB.getEnquiries().catch(() => []),
      DB.getCustomFields().catch(() => []),
    ]);
    STATE.orders = orders;
    STATE.users = users;
    STATE.tasks = tasks;
    STATE.enquiries = enquiries;
    STATE.customFields = customFields;
    if (STATE.user.role !== 'owner') {
      STATE.knownTaskIds = new Set(tasks.filter(t => t.assigned_to_id === STATE.user.id).map(t => t.id));
    }
  } catch (e) {
    console.error(e);
    toast('Error loading data: ' + (e.message || ''), 'red');
  }
  STATE.loading = false;
}

function subscribeRealtime() {
  if (!STATE.sb || !STATE.user) return;
  const subs = [];
  subs.push(STATE.sb.channel('orders-rt')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, async () => {
      STATE.orders = await DB.getOrders().catch(() => STATE.orders);
      rerenderTab();
    })
    .subscribe());
  subs.push(STATE.sb.channel('users-rt')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, async () => {
      STATE.users = await DB.getUsers().catch(() => STATE.users);
      rerenderTab();
    })
    .subscribe());
  subs.push(STATE.sb.channel('tasks-rt')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, async () => {
      STATE.tasks = await DB.getTasks().catch(() => STATE.tasks);
      if (STATE.user.role !== 'owner') {
        const myTasks = STATE.tasks.filter(t => t.assigned_to_id === STATE.user.id);
        for (const t of myTasks) {
          if (!STATE.knownTaskIds.has(t.id)) {
            STATE.knownTaskIds.add(t.id);
            toast(`📋 New task from ${esc(t.assigned_by_name || 'Owner')}`, 'green');
            tryNotify(`📋 New Task from ${t.assigned_by_name || 'Owner'}`, t.task_description);
          }
        }
      }
      rerenderTab();
    })
    .subscribe());
  subs.push(STATE.sb.channel('enq-rt')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'customer_enquiries' }, async () => {
      STATE.enquiries = await DB.getEnquiries().catch(() => STATE.enquiries);
      rerenderTab();
    })
    .subscribe());
  STATE.subscriptions = subs;
}

function tryNotify(title, body) {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') {
    try { new Notification(title, { body, icon: '🏗️' }); } catch(_) {}
  }
}
function maybeRequestNotificationPermission() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    setTimeout(() => Notification.requestPermission().catch(() => {}), 1500);
  }
}

function getTabsForRole(role) {
  const tabs = [

  if (role === 'owner') tabs.push({ label: 'Users', icon: '👥' });
  tabs.push({ label: 'Tasks', icon: '✅' });
  tabs.push({ label: 'Enquiries', icon: '📞' });
  if (role === 'carpenter') tabs.push({ label: 'Calculator', icon: '📐' });
  else if (['branch_head','factory_head','driver','owner'].includes(role)) tabs.push({ label: 'Calendar', icon: '📅' });
  else tabs.push({ label: 'Track', icon: '🔍' });
  tabs.push({ label: 'Profile', icon: '👤' });
  return tabs;
}

function renderApp() {
  const u = STATE.user;
  const tabs = getTabsForRole(u.role);
  if (!tabs.find(t => (t.tag || t.label) === STATE.tab)) STATE.tab = tabs[0].label;
  setRoot(`
    <div class="appbar">
      <div class="brand">
        <div class="brand-title">🏗️ Indira OMS</div>
        <div class="brand-sub">${esc(u.branch || '')}</div>
      </div>
      <div class="user-pill">
        <div class="who">
          <span class="name">${esc(u.name)}</span>
          <span class="role">${esc(ROLE_LABELS[u.role] || u.role)}</span>
        </div>
        ${avatar(u.name, 'sm')}
      </div>
      <button class="icon-btn" id="theme-toggle" title="Toggle theme">🌓</button>
      <button class="icon-btn" id="logout-btn" title="Logout">⏻</button>
    </div>

    <div class="main" id="tab-content"></div>

    <nav class="bottom-nav" id="bottom-nav">
      ${tabs.map(t => {
        const tag = t.tag || t.label;
        const active = (STATE.tab === tag || STATE.tab === t.label) ? 'active' : '';
        let badge = '';
        if (tag === 'Users' && u.role === 'owner') {
          const c = STATE.users.filter(uu => !uu.approved || uu.status === 'pending').length;
          if (c > 0) badge = `<span class="badge">${c}</span>`;
        }
        if (tag === 'Tasks') {
          const c = u.role === 'owner'
            ? STATE.tasks.filter(t => t.status === 'doubt').length
            : STATE.tasks.filter(t => t.assigned_to_id === u.id && (t.status === 'pending' || t.status === 'doubt')).length;
          if (c > 0) badge = `<span class="badge">${c}</span>`;
        }
        return `
          <button class="nav-item ${active}" data-tab="${tag}">
            <span class="icon">${t.icon}</span>
            <span class="label">${esc(t.label)}</span>
            ${badge}
          </button>
        `;
      }).join('')}
    </nav>
  `);
  $('#theme-toggle').onclick = () => { toggleTheme(); rerenderTab(); };
  $('#logout-btn').onclick = async () => {
    if (await confirmDialog('Logout?', 'Are you sure you want to logout?', { okLabel: 'Logout', okKind: 'red' })) {
      onLogout();
    }
  };
  $$('.nav-item').forEach(b => b.onclick = () => {
    STATE.tab = b.dataset.tab;
    renderApp();
  });
  rerenderTab();
}

function rerenderTab() {
  const host = $('#tab-content');
  if (!host) return;
  switch (STATE.tab) {
    case 'Dashboard':   return renderDashboardTab(host);
    case 'Orders':      return renderOrdersTab(host);
    case 'Users':       return renderUsersTab(host);
    case 'Tasks':       return renderTasksTab(host);
    case 'Enquiries':   return renderEnquiriesTab(host);
    case 'Calendar':    return renderCalendarTab(host);
    case 'Calculator':  return renderCalculatorTab(host);
    case 'Track':       return renderTrackTab(host);
    case 'Profile':     return renderProfileTab(host);
    default:            host.innerHTML = '';
  }
}

/* ────────────────────────────────────────────────────────────────────
   DASHBOARD TAB
   ──────────────────────────────────────────────────────────────────── */
const DASH_STATE = { stat: null, status: null };

function renderDashboardTab(host) {
  const u = STATE.user;
  // Visible orders by role
  let vis = STATE.orders.slice();
  if (u.role === 'sales')        vis = vis.filter(o => o.sales_person === u.name);
  if (u.role === 'branch_head')  vis = vis.filter(o => o.branch_name === u.branch);
  if (u.role === 'factory_head') vis = vis.filter(o => orderProducts(o).some(p => p.product_type === 'manufacture'));

  const active    = vis.filter(o => !['Delivered','Closed'].includes(computedStatus(o)));
  const delivered = vis.filter(o => computedStatus(o) === 'Delivered');
  const high      = active.filter(o => o.priority === 'High');

  // Overdue and due today (for owner / branch head)
  const now = new Date();
  const todayStr = todayISO();
  let overdue = 0, dueToday = 0;
  if (['owner','branch_head','sales'].includes(u.role)) {
    for (const o of active) {
      if (!o.delivery_date) continue;
      try {
        const d = new Date(o.delivery_date);
        const days = Math.floor((d - now) / 86400000);
        if (days < 0) overdue++;
        else if (days === 0) dueToday++;
      } catch(_) {}
    }
  }

  // Status distribution
  const statusCounts = {};
  for (const o of vis) {
    const s = computedStatus(o);
    statusCounts[s] = (statusCounts[s] || 0) + 1;
  }
  const statusEntries = Object.entries(statusCounts).sort((a,b) => b[1] - a[1]);

  // Branch distribution (owner only)
  const branchData = {};
  if (u.role === 'owner') {
    for (const b of BRANCHES) branchData[b] = { total: 0, pending: 0 };
    for (const o of vis) {
      if (!branchData[o.branch_name]) branchData[o.branch_name] = { total: 0, pending: 0 };
      branchData[o.branch_name].total++;
      if (['Waiting for Branch Approval','Query Raised'].includes(computedStatus(o))) {
        branchData[o.branch_name].pending++;
      }
    }
  }

  // Owner: pending users, doubt tasks
  const pendingUsers = STATE.users.filter(uu => !uu.approved || uu.status === 'pending').length;
  const doubtTasks = STATE.tasks.filter(t => t.status === 'doubt').length;
  const myTasks = STATE.tasks.filter(t => t.assigned_to_id === u.id && t.status === 'pending').length;

  host.innerHTML = `
    <div class="container">
      <h2 style="font-size:18px;font-weight:800;margin-bottom:8px">${ROLE_EMOJI[u.role] || ''} Welcome, ${esc(u.name)}</h2>
      <p class="muted text-sm mb16">${esc(ROLE_LABELS[u.role] || u.role)}${u.branch ? ' · ' + esc(u.branch) : ''}</p>

      ${(overdue || dueToday) ? `
        <div class="banner ${overdue ? 'red' : 'yellow'} mb12">
          ⚠️ ${overdue ? `<b>${overdue}</b> overdue` : ''}${overdue && dueToday ? ' · ' : ''}${dueToday ? `<b>${dueToday}</b> due today` : ''}
        </div>
      ` : ''}

      ${u.role === 'owner' && pendingUsers > 0 ? `
        <div class="banner yellow mb12">⏳ <b>${pendingUsers}</b> user(s) waiting for approval — check Users tab</div>
      ` : ''}

      ${u.role === 'owner' && doubtTasks > 0 ? `
        <div class="banner yellow mb12">💬 <b>${doubtTasks}</b> task(s) have doubts pending — check Tasks tab</div>
      ` : ''}

      ${u.role !== 'owner' && myTasks > 0 ? `
        <div class="banner blue mb12">📋 You have <b>${myTasks}</b> pending task(s) — check Tasks tab</div>
      ` : ''}

      <div class="stat-grid mb16">
        ${statBox('active', '🔄', 'Active', active.length, 'var(--blue)')}
        ${statBox('delivered', '✅', 'Delivered', delivered.length, 'var(--green)')}
        ${statBox('high', '🔥', 'High Pri', high.length, 'var(--red)')}
      </div>
      <div id="stat-detail" class="mb16"></div>

      ${u.role === 'owner' ? `
        <button class="btn full mb12" id="dash-assign-task">📋 Assign Task to Worker</button>
      ` : ''}

      <h3 class="section-title">Status Breakdown</h3>
      <div class="card">
        ${statusEntries.length === 0 ? '<p class="muted text-sm">No orders yet.</p>' : statusEntries.map(([s, ct]) => {
          const c = statusColor(s);
          const pct = vis.length ? (ct / vis.length * 100) : 0;
          const open = DASH_STATE.status === s;
          return `
            <div class="status-row" data-status="${esc(s)}">
              <span style="width:20px">${statusIcon(s)}</span>
              <div class="flex1">
                <div class="row between">
                  <span class="text-xs">${esc(s)}</span>
                  <div class="row gap4">
                    <span style="color:${c};font-weight:800">${ct}</span>
                    <span class="muted text-xs">${open ? '▴' : '▾'}</span>
                  </div>
                </div>
                <div class="status-bar"><div class="fill" style="width:${pct}%;background:${c}"></div></div>
              </div>
            </div>
            ${open ? `
              <div style="background:${c}0d;border:1px solid ${c}33;border-radius:8px;padding:6px 10px;margin:0 0 6px 26px">
                ${vis.filter(o => computedStatus(o) === s).slice(0, 30).map(o => `
                  <div class="row between" style="padding:6px 0;border-bottom:1px dashed var(--border)">
                    <div>
                      <div class="text-sm fw7">${esc(o.customer_name)}</div>
                      <div class="text-xs muted">#${esc(o.tracking_code)} · ${esc(o.branch_name)}</div>
                    </div>
                    ${priorityBadge(o.priority || 'Normal')}
                  </div>
                `).join('') || '<p class="text-xs muted">No orders.</p>'}
              </div>
            ` : ''}
          `;
        }).join('')}
      </div>

      ${u.role === 'owner' ? `
        <h3 class="section-title">Branches</h3>
        ${Object.entries(branchData).map(([b, v]) => `
          <div class="card row between" style="margin-bottom:8px;padding:10px 12px">
            <span>🏬 <b>${esc(b)}</b></span>
            <span class="row gap8">
              <span class="text-xs c-yellow">${v.pending} pending</span>
              <span class="text-xs muted">${v.total} total</span>
            </span>
          </div>
        `).join('')}
      ` : ''}

    </div>
  `;
  // Stat boxes
  $$('.metric-tile').forEach(b => b.onclick = () => {
    const k = b.dataset.stat;
    DASH_STATE.stat = (DASH_STATE.stat === k) ? null : k;
    DASH_STATE.status = null;
    renderDashboardTab(host);
  });
  // Status rows
  $$('.status-row').forEach(r => r.onclick = () => {
    const s = r.dataset.status;
    DASH_STATE.status = (DASH_STATE.status === s) ? null : s;
    DASH_STATE.stat = null;
    renderDashboardTab(host);
  });

  // Stat detail expansion
  if (DASH_STATE.stat) {
    const list = DASH_STATE.stat === 'active' ? active
              : DASH_STATE.stat === 'delivered' ? delivered
              : high;
    const title = DASH_STATE.stat === 'active' ? '🔄 Active Orders'
              : DASH_STATE.stat === 'delivered' ? '✅ Delivered Orders'
              : '🔥 High Priority Orders';
    $('#stat-detail').innerHTML = `
      <div class="card" style="padding:0">
        <div style="padding:10px 12px;font-weight:700;border-bottom:1px solid var(--border)">${title}</div>
        ${list.length === 0 ? '<div class="empty"><div class="emoji">∅</div>No orders</div>' : list.slice(0, 30).map(o => `
          <div class="row between" style="padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer" data-orderid="${esc(o.order_id)}">
            <div class="flex1">
              <div class="text-sm fw7 elip">${esc(o.customer_name)}</div>
              <div class="text-xs muted elip">#${esc(o.tracking_code)} · ${esc(o.branch_name)}</div>
            </div>
            <div class="col" style="align-items:flex-end;gap:2px">
              ${statusBadge(computedStatus(o))}
              ${priorityBadge(o.priority || 'Normal')}
            </div>
          </div>
        `).join('')}
      </div>
    `;
    $$('#stat-detail [data-orderid]').forEach(b => b.onclick = () => {
      const o = STATE.orders.find(x => x.order_id === b.dataset.orderid);
      if (o) renderOrderDetail(o);
    });
  }

  if (u.role === 'owner') {
    const ab = $('#dash-assign-task');
    if (ab) ab.onclick = () => assignTaskDialog();
  }
}

function statBox(key, icon, label, value, color) {
  const expanded = DASH_STATE.stat === key;
  return `
    <div class="metric-tile" data-stat="${key}" style="background:${color}${expanded?'26':'14'};border-color:${color}${expanded?'80':'33'};color:${color}">
      <span style="font-size:20px">${icon}</span>
      <div>
        <div class="v" style="color:${color}">${value}</div>
        <div class="l" style="color:${color}">${esc(label)}</div>
      </div>
    </div>
  `;
}

async function assignTaskDialog() {
  const node = el('div');
  node.innerHTML = `
    <label class="field"><span class="lbl">Phone Number</span>
      <input id="at-phone" type="tel" placeholder="Phone number (optional)" />
    </label>
    <label class="field"><span class="lbl">Task Description</span>
      <textarea id="at-desc" rows="3" placeholder="What needs to be done?"></textarea>
    </label>
    <label class="field"><span class="lbl">Assign To</span>
      <select id="at-user">
        <option value="">Select worker</option>
        ${STATE.users.filter(u => u.approved && u.status === 'active' && u.role !== 'owner').map(u => `
          <option value="${esc(u.id)}">${esc(ROLE_LABELS[u.role] || u.role)} · ${esc(u.name)}</option>
        `).join('')}
      </select>
    </label>
  `;
  showModal({
    title: '📋 Assign Task',
    body: node,
    actions: [
      { label: 'Cancel' },
      { label: 'Assign', kind: '', onClick: async () => {
        const phone = node.querySelector('#at-phone').value.trim();
        const desc  = node.querySelector('#at-desc').value.trim();
        const uid   = node.querySelector('#at-user').value;
        if (!desc) { toast('Task description required', 'red'); return false; }
        if (!uid) { toast('Select a worker', 'red'); return false; }
        const usr = STATE.users.find(u => u.id === uid);
        try {
          await DB.createTask({
            id: 't' + Date.now(),
            phone_number: phone,
            task_description: desc,
            assigned_to_id: uid,
            assigned_to_name: usr.name,
            assigned_to_role: usr.role,
            assigned_by_name: STATE.user.name,
            created_at: nowISO(),
            status: 'pending',
            status_note: '', doubt_reply: '', completed_at: '',
          });
          toast('✅ Task assigned', 'green');
        } catch (e) { toast(e.message || 'Error', 'red'); return false; }
      }},
    ],
  });
}

/* ────────────────────────────────────────────────────────────────────
   ORDERS TAB
   ──────────────────────────────────────────────────────────────────── */
function renderOrdersTab(host) {
  const u = STATE.user;
  const f = STATE.filterState.orders;

  // Role-based scoping
  let scope = STATE.orders.slice();
  if (u.role === 'sales') scope = scope.filter(o => o.sales_person === u.name);
  if (u.role === 'branch_head') scope = scope.filter(o => o.branch_name === u.branch);
  if (u.role === 'factory_head') {
    scope = scope.filter(o => orderProducts(o).some(p =>
      p.product_type === 'manufacture' &&
      ['Sent to Factory','Assigned to Carpenter','In Production','Quality Check','Product Ready'].includes(p.product_status)
    ));
  }
  if (u.role === 'carpenter') {
    scope = scope.filter(o => orderProducts(o).some(p =>
      p.product_type === 'manufacture' &&
      p.assigned_to === u.name &&
      !p.completed_at &&
      !productImages(p,'completed_image_url').length &&
      !['Quality Check','Product Ready','Out for Delivery','Delivered'].includes(p.product_status)
    ));
    const pri = { High: 0, Medium: 1, Normal: 2 };
    scope.sort((a,b) => (pri[a.priority]||2) - (pri[b.priority]||2));
  }
  if (u.role === 'quality_check') {
    scope = scope.filter(o => orderProducts(o).some(p => p.product_status === 'Quality Check'));
  }
  if (u.role === 'driver') {
    scope = scope.filter(o => orderProducts(o).some(p => p.product_status === 'Out for Delivery'));
  }

  // Apply search
  const applyFilters = (list) => {
    let r = list;
    if (f.search) {
      const s = f.search.toLowerCase();
      r = r.filter(o => (o.customer_name||'').toLowerCase().includes(s)
                  || (o.tracking_code||'').toLowerCase().includes(s)
                  || (o.customer_number1||'').includes(f.search)
                  || (o.customer_number2||'').includes(f.search)
                  || (o.address||'').toLowerCase().includes(s));
    }
    if (f.productType) r = r.filter(o => orderProducts(o).some(p => p.product_type === f.productType));
    if (u.role === 'owner' && f.branch) r = r.filter(o => o.branch_name === f.branch);
    return r;
  };

  // BH gets 3 tabs (Pending / List / Ready)
  const isBH = u.role === 'branch_head';

  const fab = (u.role === 'sales' || u.role === 'branch_head') ? `
    <button class="btn" id="new-order-fab" style="position:fixed;right:16px;bottom:80px;z-index:30;border-radius:24px;padding:12px 18px;box-shadow:0 4px 14px rgba(232,144,10,0.4)">
      ➕ New Order
    </button>
  ` : '';

  if (isBH) {
    // Build the three lists
    let bhScope = applyFilters(scope);
    if (f.status) bhScope = bhScope.filter(o => computedStatus(o) === f.status);

    const pendingList = bhScope.filter(o => ['Waiting for Branch Approval','Query Raised'].includes(computedStatus(o)));
    let listList = bhScope.filter(o => !['Delivered','Closed','Waiting for Branch Approval','Query Raised'].includes(computedStatus(o))
      && !orderProducts(o).some(p => p.product_status === 'Product Ready'));
    listList.sort((a,b) => (a.delivery_date||'') < (b.delivery_date||'') ? -1 : 1);
    let readyList = bhScope.filter(o => orderProducts(o).some(p => p.product_status === 'Product Ready'));
    readyList.sort((a,b) => (a.delivery_date||'') < (b.delivery_date||'') ? -1 : 1);

    const tabs = [
      { key: 0, label: 'Pending', list: pendingList, color: 'var(--yellow)' },
      { key: 1, label: 'List',    list: listList,    color: 'var(--blue)' },
      { key: 2, label: 'Ready',   list: readyList,   color: 'var(--green)' },
    ];
    const cur = tabs[f.bhTab] || tabs[0];

    host.innerHTML = `
      ${ordersFilterBar(u, f)}
      <div class="tabs">
        ${tabs.map(t => `
          <button class="tab ${f.bhTab === t.key ? 'active' : ''}" data-bhtab="${t.key}">
            ${esc(t.label)} ${t.list.length ? `<span class="count-badge" style="background:${t.color}">${t.list.length}</span>` : ''}
          </button>
        `).join('')}
      </div>
      <div class="container" id="orders-body">
        ${cur.list.length === 0 ? emptyOrders() : cur.list.map(o => orderCardHTML(o, u)).join('')}
      </div>
      ${fab}
    `;

    $$('[data-bhtab]').forEach(b => b.onclick = () => {
      f.bhTab = parseInt(b.dataset.bhtab);
      renderOrdersTab(host);
    });
  } else {
    let list = applyFilters(scope);
    if (f.status) list = list.filter(o => computedStatus(o) === f.status);
    else list = list.filter(o => !['Closed','Delivered'].includes(computedStatus(o)));

    if (u.role !== 'carpenter') applySortMode(list, f.sort);

    host.innerHTML = `
      ${ordersFilterBar(u, f)}
      <div class="container">
        ${list.length === 0 ? emptyOrders() : list.map(o => orderCardHTML(o, u)).join('')}
      </div>
      ${fab}
    `;
  }

  // Wire up filter bar
  const sb = $('#of-search');
  if (sb) {
    sb.oninput = () => {
      f.search = sb.value;
      // Light debounce: rerender immediately for instant feel
      renderOrdersTab(host);
      // restore focus and caret
      const ns = $('#of-search');
      if (ns) { ns.focus(); ns.setSelectionRange(ns.value.length, ns.value.length); }
    };
  }
  const ss = $('#of-status');
  if (ss) ss.onchange = () => { f.status = ss.value; renderOrdersTab(host); };
  const pt = $('#of-ptype');
  if (pt) pt.onchange = () => { f.productType = pt.value; renderOrdersTab(host); };
  const br = $('#of-branch');
  if (br) br.onchange = () => { f.branch = br.value; renderOrdersTab(host); };
  const sortSel = $('#of-sort');
  if (sortSel) sortSel.onchange = () => { f.sort = sortSel.value; renderOrdersTab(host); };
  const clearBtn = $('#of-clear');
  if (clearBtn) clearBtn.onclick = () => {
    f.search = ''; f.status = ''; f.productType = ''; f.branch = ''; f.sort = 'newest';
    renderOrdersTab(host);
  };

  // Order card clicks
  $$('[data-order-card]').forEach(c => c.onclick = () => {
    const o = STATE.orders.find(x => x.order_id === c.dataset.orderCard);
    if (o) renderOrderDetail(o);
  });

  // FAB
  const fabBtn = $('#new-order-fab');
  if (fabBtn) fabBtn.onclick = () => renderNewOrderScreen();
}

function applySortMode(list, mode) {
  if (mode === 'nearest') {
    list.sort((a,b) => (a.delivery_date||'') < (b.delivery_date||'') ? -1 : 1);
  } else if (mode === 'value') {
    list.sort((a,b) => (b.total_order_value||0) - (a.total_order_value||0));
  } else {
    list.sort((a,b) => (b.created_at||'') < (a.created_at||'') ? -1 : 1);
  }
}

function emptyOrders() {
  return `<div class="empty"><span class="emoji">📋</span>No orders to show</div>`;
}

function ordersFilterBar(u, f) {
  return `
    <div class="container" style="padding-top:10px;padding-bottom:6px">
      <input id="of-search" placeholder="🔍 Search name / code / phone / address" value="${esc(f.search)}" />
      <div class="row gap8 mt8" style="flex-wrap:wrap">
        <select id="of-status" style="flex:1;min-width:120px">
          <option value="">All Statuses</option>
          ${STATUS_STAGES.map(s => `<option value="${esc(s)}" ${f.status===s?'selected':''}>${statusIcon(s)} ${esc(s)}</option>`).join('')}
        </select>
        <select id="of-ptype" style="flex:1;min-width:120px">
          <option value="">All Types</option>
          <option value="manufacture" ${f.productType==='manufacture'?'selected':''}>🏭 Manufacture</option>
          <option value="vendor" ${f.productType==='vendor'?'selected':''}>🛒 Vendor</option>
          <option value="stock" ${f.productType==='stock'?'selected':''}>🏬 Stock</option>
        </select>
        ${u.role === 'owner' ? `
          <select id="of-branch" style="flex:1;min-width:120px">
            <option value="">All Branches</option>
            ${BRANCHES.map(b => `<option value="${esc(b)}" ${f.branch===b?'selected':''}>${esc(b)}</option>`).join('')}
          </select>
        ` : ''}
        ${u.role !== 'carpenter' ? `
          <select id="of-sort" style="flex:1;min-width:120px">
            <option value="newest" ${f.sort==='newest'?'selected':''}>Sort: Newest</option>
            <option value="nearest" ${f.sort==='nearest'?'selected':''}>Nearest delivery</option>
            <option value="value" ${f.sort==='value'?'selected':''}>Highest value</option>
          </select>
        ` : ''}
        ${(f.search || f.status || f.productType || f.branch) ? `
          <button class="btn outline small" id="of-clear">Clear</button>
        ` : ''}
      </div>
    </div>
  `;
}

function orderCardHTML(o, u) {
  const ps = orderProducts(o);
  const cs = computedStatus(o);
  const c = statusColor(cs);
  const pc = priorityColor(o.priority || 'Normal');
  const productNames = ps.slice(0, 2).map(p => esc(p.product_name)).join(', ') + (ps.length > 2 ? ` +${ps.length - 2} more` : '');

let DETAIL_STATE = null;

async function renderOrderDetail(order) {
  // Load fresh from DB
  let fresh = order;
  try { const f = await DB.getOrderById(order.order_id); if (f) fresh = f; } catch(_) {}
  DETAIL_STATE = {
    order: fresh,
    saving: false,
    productAssignments: {}, // idx -> name
    completedFilesByIdx: {},
    deliveredFile: null,
    challanFile: null,
    queryText: fresh.branch_query || '',
  };
  for (let i = 0; i < orderProducts(fresh).length; i++) {
    const p = orderProducts(fresh)[i];
    if (p.product_type === 'manufacture' && p.assigned_to) {
      DETAIL_STATE.productAssignments[i] = p.assigned_to;
    }
  }
  setRoot(orderDetailHTML());
  bindDetailHandlers();
}

function productDetailCard(p, i, o, u, { isBH, isFH, isQC, isDriver }) {
  const sc = statusColor(p.product_status);
  const tIcon = p.product_type === 'manufacture' ? '🏭' : p.product_type === 'vendor' ? '🛒' : '🏬';
  const tLabel = p.product_type === 'manufacture' ? 'Manufacture' : p.product_type === 'vendor' ? 'Vendor' : 'Stock';
  const showImg = (p.showroom_image_url) ? p.showroom_image_url : '';
  const drawings = productImages(p, 'drawing_image_urls');
  const refs = productImages(p, 'reference_image_urls');
  const completed = productImages(p, 'completed_image_url');
  const modelImg = p.model_image_url || '';

  // BH actions for this product
  let bhActions = '';
  const showBH = isBH && (p.product_status === 'Pending Approval' || p.product_status === 'Query Raised'
                       || (p.product_type === 'vendor' && p.product_status === 'Order Placed')
                       || (p.product_type === 'stock' && p.product_status === 'Order Placed'));
  if (showBH) {
    const approveLabel = (p.product_type === 'vendor' && p.product_status === 'Order Placed') ? '📦 Mark Vendor Received'
                      : (p.product_type === 'stock' && p.product_status === 'Order Placed') ? '📦 Mark Stock Received'
                      : '✅ Approve';
    const approveAction = (p.product_type === 'vendor' && p.product_status === 'Order Placed') ? 'vendor_received'
                       : (p.product_type === 'stock' && p.product_status === 'Order Placed') ? 'stock_received'
                       : 'approve';
    bhActions = `
      <div class="row gap8 mt12" style="flex-wrap:wrap">
        <button class="btn green flex1" data-bh-act="${approveAction}" data-bh-idx="${i}">${approveLabel}</button>
        ${(p.product_status === 'Pending Approval' || p.product_status === 'Query Raised') ? `
          <button class="btn outline yellow" data-bh-act="query" data-bh-idx="${i}">💬 Query</button>
        ` : ''}
      </div>
    `;
  }

  // QC actions
  let qcActions = '';
  if (isQC && p.product_status === 'Quality Check' && p.product_type === 'manufacture') {
    qcActions = `
      <div class="row gap8 mt12" style="flex-wrap:wrap">
        <button class="btn green flex1" data-qc-act="pass" data-qc-idx="${i}">✅ Pass — Mark Product Ready</button>
        <button class="btn outline red" data-qc-act="fail" data-qc-idx="${i}">❌ Fail / Send Back</button>
      </div>
    `;
  }

  // BH dispatch (Product Ready -> Out for Delivery)
  let dispatchActions = '';
  if (isBH && p.product_status === 'Product Ready') {
    dispatchActions = `
      <div class="row gap8 mt12" style="flex-wrap:wrap">
        <button class="btn blue flex1" data-disp-idx="${i}">🚚 Send Out for Delivery</button>
      </div>
    `;
  }

  return `
    <div class="product-card" style="border-color:${sc}40">
      <div class="row between mb8">
        <div>
          <div class="text-xs muted">${tIcon} ${tLabel} · Product ${i+1}</div>
          <div class="fw8" style="font-size:15px">${esc(p.product_name)}</div>
        </div>
        <span class="text-xs muted">×${p.quantity || 1}</span>
      </div>

      <div class="pill" style="background:${sc}1f;color:${sc};font-weight:800">
        ${esc(productStatusLabel(p))}
      </div>

      ${p.product_query ? `<div class="banner red mt8 text-xs">💬 ${esc(p.product_query)}</div>` : ''}
      ${p.assigned_to ? `<div class="text-xs mt8 muted">🔨 Assigned to <b>${esc(p.assigned_to)}</b></div>` : ''}

      <div class="hr"></div>
      ${kvRow('Material', p.material_type)}
      ${kvRow('Size', p.size)}
      ${kvRow('Color', p.color)}
      ${p.unit_value ? kvRow('Unit Value', '₹ ' + Number(p.unit_value).toLocaleString('en-IN')) : ''}
      ${p.product_type === 'vendor' && p.vendor_brand ? kvRow('Vendor', `${esc(p.vendor_brand)}${p.vendor_product_name ? ' / ' + esc(p.vendor_product_name) : ''}`) : ''}

      ${(showImg || drawings.length || refs.length || modelImg || completed.length) ? `
        <div class="hr"></div>
        <div class="text-xs muted mb8">Images</div>
        <div class="row gap8" style="flex-wrap:wrap">
          ${showImg ? `<div class="img-thumb" data-img="${esc(showImg)}" title="Showroom"><img src="${esc(showImg)}" /></div>` : ''}
          ${drawings.map(url => `<div class="img-thumb" data-img="${esc(url)}" title="Drawing"><img src="${esc(url)}" /></div>`).join('')}
          ${refs.map(url => `<div class="img-thumb" data-img="${esc(url)}" title="Reference"><img src="${esc(url)}" /></div>`).join('')}
          ${modelImg ? `<div class="img-thumb" data-img="${esc(modelImg)}" title="Model"><img src="${esc(modelImg)}" /></div>` : ''}
          ${completed.map(url => `<div class="img-thumb" data-img="${esc(url)}" title="Completed" style="border-color:var(--green)"><img src="${esc(url)}" /></div>`).join('')}
        </div>
      ` : ''}

      ${bhActions}
      ${qcActions}
      ${dispatchActions}
    </div>
  `;
}

function bindDetailHandlers() {
  const o = DETAIL_STATE.order;
  const u = STATE.user;

  $('#back-btn').onclick = () => { DETAIL_STATE = null; renderApp(); };
  $('#theme-toggle').onclick = () => { toggleTheme(); setRoot(orderDetailHTML()); bindDetailHandlers(); };
  const eb = $('#edit-order-btn');
  if (eb) eb.onclick = () => renderNewOrderScreen(o);
  const ab = $('#activity-btn');
  if (ab) ab.onclick = () => openActivityLog(o);

  // Image clicks
  $$('[data-img]').forEach(t => t.onclick = (e) => {
    e.stopPropagation();
    const allUrls = $$('[data-img]').map(x => x.dataset.img);
    openImageViewer(allUrls, allUrls.indexOf(t.dataset.img));
  });

  // BH product actions
  $$('[data-bh-act]').forEach(b => b.onclick = async () => {
    const idx = parseInt(b.dataset.bhIdx);
    const action = b.dataset.bhAct;
    if (action === 'query') {
      const node = el('div');
      node.innerHTML = `
        <p class="muted text-sm mb8">Add a query for the sales person about <b>${esc(orderProducts(o)[idx].product_name)}</b>:</p>
        <textarea id="q-text" rows="4" placeholder="What needs clarification?"></textarea>
      `;
      showModal({
        title: '💬 Raise Query',
        body: node,
        actions: [
          { label: 'Cancel' },
          { label: 'Send Query', kind: 'yellow', onClick: async () => {
            const text = node.querySelector('#q-text').value.trim();
            if (!text) { toast('Type a query', 'red'); return false; }
            await handleProductAction(idx, 'query', text);
          }},
        ],
      });
    } else {
      await handleProductAction(idx, action, '');
    }
  });

  // QC actions
  $$('[data-qc-act]').forEach(b => b.onclick = async () => {
    const idx = parseInt(b.dataset.qcIdx);
    const act = b.dataset.qcAct;
    if (act === 'pass') {
      await handleQcAction(idx, 'pass', '');
    } else {
      const node = el('div');
      node.innerHTML = `<textarea id="qc-reason" rows="3" placeholder="Reason for failing..."></textarea>`;
      showModal({
        title: '❌ Fail QC',
        body: node,
        actions: [
          { label: 'Cancel' },
          { label: 'Send Back', kind: 'red', onClick: async () => {
            const r = node.querySelector('#qc-reason').value.trim();
            if (!r) { toast('Provide a reason', 'red'); return false; }
            await handleQcAction(idx, 'fail', r);
          }},
        ],
      });
    }
  });

  // BH dispatch
  $$('[data-disp-idx]').forEach(b => b.onclick = async () => {
    const idx = parseInt(b.dataset.dispIdx);
    await handleDispatchAction(idx);
  });

  // Factory Head save
  const fcSave = $('#fc-save');
  if (fcSave) {
    $$('[data-fc-assign]').forEach(s => s.onchange = (e) => {
      DETAIL_STATE.productAssignments[parseInt(s.dataset.fcAssign)] = s.value;
    });
    fcSave.onclick = saveFactoryControls;
  }

  // Carpenter completion uploads
  $$('[data-cp-cam]').forEach(b => b.onclick = () => {
    const idx = b.dataset.cpCam;
    $(`[data-cp-file="${idx}"]`).click();
  });
  $$('[data-cp-file]').forEach(inp => inp.onchange = (e) => {
    const idx = parseInt(inp.dataset.cpFile);
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    DETAIL_STATE.completedFilesByIdx[idx] = (DETAIL_STATE.completedFilesByIdx[idx] || []).concat(files);
    refreshCpPreview(idx);
  });
  $$('[data-cp-mark]').forEach(b => b.onclick = () => carpenterMarkCompleted(parseInt(b.dataset.cpMark)));

  // Driver
  const delTile = $('#drv-del-tile');
  if (delTile) {
    delTile.onclick = () => $('#drv-del-file').click();
    $('#drv-del-file').onchange = (e) => {
      const f = e.target.files[0];
      if (!f) return;
      DETAIL_STATE.deliveredFile = f;
      $('#drv-del-text').textContent = f.name;
      const url = URL.createObjectURL(f);
      $('#drv-del-preview').innerHTML = `<div class="img-thumb full-w mt8"><img src="${url}" /></div>`;
    };
  }
  const chlTile = $('#drv-chl-tile');
  if (chlTile) {
    chlTile.onclick = () => $('#drv-chl-file').click();
    $('#drv-chl-file').onchange = (e) => {
      const f = e.target.files[0];
      if (!f) return;
      DETAIL_STATE.challanFile = f;
      $('#drv-chl-text').textContent = f.name;
      const url = URL.createObjectURL(f);

  $$(`[data-cp-rm]`).forEach(b => b.onclick = (e) => {

async function handleProductAction(idx, action, query) {
  const o = DETAIL_STATE.order;
  const u = STATE.user;
  try {
    const products = orderProducts(o).slice();
    const p = { ...products[idx] };
    let newStatus = p.product_status;
    let newQuery = p.product_query || '';
    if (action === 'approve') {
      if (p.product_type === 'manufacture') newStatus = 'Sent to Factory';
      else if (p.product_type === 'vendor') newStatus = 'Order Placed';
      else if (p.product_type === 'stock') newStatus = 'Order Placed';
      newQuery = '';
    } else if (action === 'query') {
      newStatus = 'Query Raised';
      newQuery = query;
    } else if (action === 'vendor_received' || action === 'stock_received') {
      newStatus = 'Product Ready';
    }
    p.product_status = newStatus;
    p.product_query = newQuery;
    products[idx] = p;

    // Recompute overall status
    const set = new Set(products.map(x => x.product_status));
    let overallStatus = o.status;
    if ([...set].every(s => s === 'Delivered')) overallStatus = 'Delivered';
    else if ([...set].every(s => ['Out for Delivery','Delivered'].includes(s))) overallStatus = 'Out for Delivery';
    else if ([...set].some(s => s === 'Pending Approval' || s === 'Query Raised')) overallStatus = 'Waiting for Branch Approval';
    else if ([...set].every(s => ['Sent to Factory','Order Placed','Approved','Assigned to Carpenter','In Production','Quality Check','Product Ready','Product Received','Out for Delivery','Delivered'].includes(s))) {
      overallStatus = 'Approved by Branch';
    }

    const patch = { products, status: overallStatus, is_second_approval: false };
    if (action === 'approve') {
      patch.branch_approved = 'yes';
      patch.branch_approved_by = u.name;
    }
    await DB.updateOrder(o.order_id, patch);

    // System comment
    const msgs = {
      approve: `✅ "${p.product_name}" approved by ${u.name}.`,
      query: `💬 Query raised on "${p.product_name}" by ${u.name}: ${query}`,
      vendor_received: `📦 "${p.product_name}" received from vendor by ${u.name}.`,
      stock_received: `📦 "${p.product_name}" stock confirmed received by ${u.name}.`,
    };
    await DB.addComment({
      orderId: o.order_id, userId: u.id, userName: u.name, userRole: u.role,
      comment: msgs[action] || '', isSystem: true,
    }).catch(() => {});

    toast(({ approve: '✅ Product approved', query: '💬 Query sent', vendor_received: '📦 Marked received', stock_received: '📦 Marked received' })[action] || '✅ Done', 'green');

    // Reload + show approval confirmation if approve
    const fresh = await DB.getOrderById(o.order_id);
    if (fresh) DETAIL_STATE.order = fresh;
    setRoot(orderDetailHTML());
    bindDetailHandlers();

    if (action === 'approve' && p.product_type === 'manufacture') {
      showApprovalConfirmation(p);
    }
  } catch (e) { toast(e.message || 'Error', 'red'); }
}

async function handleQcAction(idx, kind, reason) {
  const o = DETAIL_STATE.order;
  const u = STATE.user;
  try {
    const products = orderProducts(o).slice();
    const p = { ...products[idx] };
    if (kind === 'pass') {
      p.product_status = 'Product Ready';
    } else {
      p.product_status = 'In Production'; // send back
      p.product_query = `QC Failed: ${reason}`;
    }
    products[idx] = p;

    // Overall status recompute
    const set = new Set(products.map(x => x.product_status));
    let overallStatus = o.status;
    if (set.size === 1 && set.has('Product Ready')) overallStatus = 'Product Ready';
    else if ([...set].some(s => s === 'In Production' || s === 'Assigned to Carpenter')) overallStatus = 'In Production';

    await DB.updateOrder(o.order_id, { products, status: overallStatus });
    await DB.addComment({
      orderId: o.order_id, userId: u.id, userName: u.name, userRole: u.role,
      comment: kind === 'pass'
        ? `🔍 QC passed for "${p.product_name}" — Product Ready.`
        : `❌ QC failed for "${p.product_name}" — sent back. Reason: ${reason}`,
      isSystem: true,
    }).catch(() => {});

    toast(kind === 'pass' ? '✅ QC passed' : '↩️ Sent back', 'green');
    const fresh = await DB.getOrderById(o.order_id);
    if (fresh) DETAIL_STATE.order = fresh;
    setRoot(orderDetailHTML());
    bindDetailHandlers();
  } catch (e) { toast(e.message || 'Error', 'red'); }
}

async function handleDispatchAction(idx) {
  const o = DETAIL_STATE.order;
  const u = STATE.user;
  if (!await confirmDialog('Send Out for Delivery?', `This will mark "${orderProducts(o)[idx].product_name}" as Out for Delivery.`, { okLabel: 'Send', okKind: 'blue' })) return;
  try {
    const products = orderProducts(o).slice();
    products[idx] = { ...products[idx], product_status: 'Out for Delivery' };
    const set = new Set(products.map(p => p.product_status));
    let overall = o.status;
    if ([...set].every(s => s === 'Out for Delivery' || s === 'Delivered')) overall = 'Out for Delivery';
    await DB.updateOrder(o.order_id, { products, status: overall });
    await DB.addComment({
      orderId: o.order_id, userId: u.id, userName: u.name, userRole: u.role,
      comment: `🚚 "${products[idx].product_name}" sent out for delivery.`, isSystem: true,
    }).catch(() => {});
    toast('🚚 Out for delivery', 'green');
    const fresh = await DB.getOrderById(o.order_id);
    if (fresh) DETAIL_STATE.order = fresh;
    setRoot(orderDetailHTML());
    bindDetailHandlers();
  } catch (e) { toast(e.message || 'Error', 'red'); }
}

async function saveFactoryControls() {
  const o = DETAIL_STATE.order;
  const u = STATE.user;
  try {
    const fdate = $('#fc-fdate').value;
    const priority = $('#fc-priority').value;
    const products = orderProducts(o).slice().map((p, i) => {
      if (p.product_type !== 'manufacture') return p;
      const assigned = DETAIL_STATE.productAssignments[i];
      if (assigned !== undefined && assigned !== p.assigned_to) {
        return { ...p, assigned_to: assigned, product_status: assigned ? 'Assigned to Carpenter' : p.product_status };
      }
      return p;
    });
    const set = new Set(products.map(p => p.product_status));
    let overall = o.status;
    if ([...set].some(s => s === 'Assigned to Carpenter' || s === 'In Production')) overall = 'In Production';

    const patch = { products, priority, status: overall };
    if (fdate) patch.factory_delivery_date = fdate;
    // factory_assigned_to mirrors first manufacture assignee for legacy display
    const firstMfr = products.find(p => p.product_type === 'manufacture' && p.assigned_to);
    if (firstMfr) patch.factory_assigned_to = firstMfr.assigned_to;

    await DB.updateOrder(o.order_id, patch);
    await DB.addComment({
      orderId: o.order_id, userId: u.id, userName: u.name, userRole: u.role,
      comment: `🏭 Factory updated: priority=${priority}${fdate ? `, factory delivery=${fdate}` : ''}`,
      isSystem: true,
    }).catch(() => {});
    toast('✅ Saved', 'green');
    const fresh = await DB.getOrderById(o.order_id);
    if (fresh) DETAIL_STATE.order = fresh;
    setRoot(orderDetailHTML());
    bindDetailHandlers();
  } catch (e) { toast(e.message || 'Error', 'red'); }
}

async function carpenterMarkCompleted(idx) {
  const files = DETAIL_STATE.completedFilesByIdx[idx] || [];
  if (!files.length) return;
  const o = DETAIL_STATE.order;
  const u = STATE.user;
  const btn = $(`[data-cp-mark="${idx}"]`);
  if (btn) { btn.disabled = true; btn.textContent = 'Uploading...'; }
  try {
    const urls = [];
    for (const f of files) urls.push(await DB.uploadImage(f, 'completed'));
    const products = orderProducts(o).slice();
    const p = products[idx];
    const existing = productImages(p, 'completed_image_url');
    products[idx] = {
      ...p,
      completed_image_url: existing.concat(urls).join(','),
      product_status: 'Quality Check',
      completed_at: todayISO(),
    };
    const allMfrInQC = products
      .filter(x => x.product_type === 'manufacture')
      .every(x => ['Quality Check','Product Ready','Out for Delivery','Delivered'].includes(x.product_status));
    const patch = { products };
    if (allMfrInQC) patch.status = 'Quality Check';
    await DB.updateOrder(o.order_id, patch);
    await DB.addComment({
      orderId: o.order_id, userId: u.id, userName: u.name, userRole: u.role,
      comment: `🔨 "${p.product_name}" completed by ${u.name} — ${urls.length} photo(s) uploaded.`, isSystem: true,
    }).catch(() => {});
    toast('✅ Marked completed', 'green');
    delete DETAIL_STATE.completedFilesByIdx[idx];
    const fresh = await DB.getOrderById(o.order_id);
    if (fresh) DETAIL_STATE.order = fresh;
    setRoot(orderDetailHTML());
    bindDetailHandlers();
  } catch (e) {
    toast(e.message || 'Error', 'red');
    if (btn) { btn.disabled = false; btn.textContent = '✅ Mark Completed'; }
  }
}
