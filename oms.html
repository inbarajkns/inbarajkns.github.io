function usrCard(u){
  const stc=u.status==='active'?'var(--green)':u.status==='suspended'?'var(--red)':'var(--yel)';
  return`<div class="uc">
    <div class="uc-av">${(u.name||'?')[0].toUpperCase()}</div>
    <div class="uc-i">
      <div class="uc-nm">${u.name} <span class="rtag">${ROLES[u.role]||u.role}</span></div>
      <div class="uc-mt">${u.branch||''} · ${u.email||''}</div>
      <div style="font-size:10px;color:${stc};font-weight:700;margin-top:2px">${(u.status||'').toUpperCase()}${!u.approved?' · NOT APPROVED':''}</div>
    </div>
    <div class="uc-acts">
      ${(!u.approved||u.status==='pending')?`<button class="btn bg2 bxs" onclick="approveUsr('${u.id}')">✅</button>`:''}
      ${u.status==='active'?`<button class="btn bs bxs" onclick="resetPass('${u.id}','${u.name}')" title="Reset PIN">🔐</button><button class="btn bd bxs" onclick="suspendUsr('${u.id}')">🚫</button>`:''}
      ${u.status==='suspended'?`<button class="btn bg2 bxs" onclick="unsuspendUsr('${u.id}')">✅</button>`:''}
      <button class="btn bd bxs" onclick="deleteUsr('${u.id}','${u.name}')">🗑</button>
    </div>
  </div>`;
}

async function approveUsr(id){try{const{e}=await DB.from('users').update({approved:true,status:'active'}).eq('id',id);if(e)throw e;toast('ok','Approved!');await loadUsers();renderUsers()}catch(e){toast('err',e.message)}}
async function suspendUsr(id){if(!confirm('Suspend?'))return;try{await DB.from('users').update({status:'suspended'}).eq('id',id);toast('info','Suspended');await loadUsers();renderUsers()}catch(e){toast('err',e.message)}}
async function unsuspendUsr(id){try{await DB.from('users').update({status:'active'}).eq('id',id);toast('ok','Reactivated');await loadUsers();renderUsers()}catch(e){toast('err',e.message)}}
async function deleteUsr(id,name){if(!confirm(`Delete "${name}"?`))return;try{await DB.from('users').delete().eq('id',id);await loadUsers();renderUsers()}catch(e){toast('err',e.message)}}
async function resetPass(id,name){const p=prompt(`New PIN for ${name} (numbers only):`);if(!p)return;if(!/^\d{4,}$/.test(p)){toast('err','PIN must be 4+ digits');return}try{await DB.from('users').update({password:p,pin_changed:true}).eq('id',id);toast('ok','PIN updated')}catch(e){toast('err',e.message)}}

function openAddUser(){
  openDyn(`
    <div class="mh"><div class="mh-t">👤 Add User</div><div class="mc-x" onclick="closeDyn()">×</div></div>
    <div class="mb">
      <div id="au-err"></div>
      <div class="fg"><label class="fl">Full Name *</label><input class="fi" id="au-nm" placeholder="Name"></div>
      <div class="g2">
        <div class="fg"><label class="fl">Role</label><select class="fi" id="au-rl">${Object.entries(ROLES).filter(([k])=>k!=='owner').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
        <div class="fg"><label class="fl">Branch</label><select class="fi" id="au-br">${BRANCHES.map(b=>`<option>${b}</option>`).join('')}</select></div>

async function submitAddUser(){
  const nm=gv('au-nm'),pw=gv('au-pw');
  const el=g('au-err');
  if(!nm||!pw){el.innerHTML=err('Name and PIN required');return}
  if(!/^\d{4,}$/.test(pw)){el.innerHTML=err('PIN must be 4+ digits, numbers only');return}
  try{
    const{error}=await DB.from('users').insert({id:'u'+Date.now(),name:nm,role:g('au-rl').value,branch:g('au-br').value,email:g('au-em').value,phone:g('au-ph').value,password:pw,approved:true,status:'active',pin_changed:true});
    if(error)throw error;
    toast('ok',nm+' added!'); closeDyn(); await loadUsers(); renderUsers();
  }catch(e){el.innerHTML=err(e.message)}
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CHANGE PIN
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderPass(force){
  const isForce=force===true;
  g('pg').innerHTML=`<div style="max-width:380px;margin:0 auto">
    <div class="info-box">
      <div class="sec-t">🔐 ${isForce?'Set Your New PIN':'Change PIN'}</div>
      ${isForce?`<div style="background:rgba(232,144,10,.1);border:1px solid rgba(232,144,10,.3);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--yel)">We've switched from passwords to numeric PINs for easier login. Please set your new 4+ digit PIN below.</div>`:''}
      <div id="cp-err"></div><div id="cp-ok"></div>
      <div class="fg"><label class="fl">${isForce?'Current Password / PIN':'Current PIN'}</label><input class="fi" id="cp-old" type="password"></div>
      <div class="fg"><label class="fl">New PIN (numbers only)</label><input class="fi" id="cp-new" type="password" inputmode="numeric"></div>
      <div class="fg"><label class="fl">Confirm New PIN</label><input class="fi" id="cp-cf" type="password" inputmode="numeric"></div>
      <button class="btn bp bfull" onclick="doCP(${isForce})">Update PIN</button>
    </div>
  </div>`;
}
async function doCP(isForce){
  const o=g('cp-old').value,n=g('cp-new').value,c=g('cp-cf').value;
  const el=g('cp-err'),okEl=g('cp-ok');
  el.innerHTML='';okEl.innerHTML='';
  if(!o||!n||!c){el.innerHTML=err('All fields required');return}
  if(n!==c){el.innerHTML=err('New PINs do not match');return}
  if(o!==ME.password){el.innerHTML=err(isForce?'Current password/PIN incorrect':'Current PIN incorrect');return}
  if(!/^\d{4,}$/.test(n)){el.innerHTML=err('New PIN must be 4+ digits, numbers only');return}
  if(n===o){el.innerHTML=err('New PIN must be different from current');return}
  try{
    const{error}=await DB.from('users').update({password:n,pin_changed:true}).eq('id',ME.id);
    if(error)throw error;
    ME.password=n;ME.pin_changed=true;sessionStorage.setItem('me',JSON.stringify(ME));
    okEl.innerHTML=ok('PIN updated successfully!');
    if(isForce) setTimeout(()=>go('dashboard'),1200);
  }catch(e){el.innerHTML=err(e.message)}
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CUSTOMER ENQUIRIES
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const ENQ_STATUSES={
  'New':{emoji:'📝',short:'New',color:'#78909C'},
  'Rep Assigned':{emoji:'👤',short:'Rep Assigned',color:'#5C6BC0'},
  'Site Visited':{emoji:'🏠',short:'Site Visited',color:'#26A69A'},
  'WhatsApp Group Opened':{emoji:'💬',short:'WA Group',color:'#66BB6A'},
  'Quotation Given':{emoji:'📄',short:'Quotation Given',color:'#FFA726'},
  'Finalized':{emoji:'✅',short:'Finalized',color:'#43A047'},
  'Pending':{emoji:'⏸️',short:'Pending',color:'#EF5350'},
};
const ENQ_PIPELINE=['New','Rep Assigned','Site Visited','WhatsApp Group Opened','Quotation Given'];
const ENQ_NEXT={
  'New':['Rep Assigned','Site Visited','Pending'],
  'Rep Assigned':['Site Visited','Pending'],
  'Site Visited':['WhatsApp Group Opened','Pending'],
  'WhatsApp Group Opened':['Quotation Given','Pending'],
  'Quotation Given':['Finalized','Pending'],
  'Pending':['New','Rep Assigned','Site Visited','WhatsApp Group Opened','Quotation Given','Finalized'],
  'Finalized':[],
};
const PROJECT_LABELS={'modular_kitchen':'Modular Kitchen Only','1bhk':'1 BHK','2bhk':'2 BHK','3bhk':'3 BHK','4bhk':'4 BHK','renovation':'Renovation','others':'Others'};

function renderEnquiries(){
  g('tb-a').innerHTML=`<button class="btn bp bsm" onclick="openNewEnquiry()">+ New Enquiry</button>`;
  let list=[...ENQUIRIES];
  // Non-owner: show assigned + unassigned + own entries
  if(ME.role!=='owner'){
    list=list.filter(e=>!e.assigned_rep||e.assigned_rep===ME.name||e.entered_by===ME.name);
  }
  if(_enqStatusFilter) list=list.filter(e=>e.enquiry_status===_enqStatusFilter);
  if(_enqSearch){
    const q=_enqSearch.toLowerCase();
    list=list.filter(e=>(e.customer_name||'').toLowerCase().includes(q)||(e.phone1||'').includes(q)||(e.location||'').toLowerCase().includes(q)||(e.assigned_rep||'').toLowerCase().includes(q));
  }

  const statusCounts={};ENQUIRIES.forEach(e=>{statusCounts[e.enquiry_status]=(statusCounts[e.enquiry_status]||0)+1});

  function filterChip(label,value,count,color){
    const sel=_enqStatusFilter===value;
    return`<span class="chip${sel?' on':''}" style="${sel?`background:rgba(${hexToRgb(color||'#E8900A')},.2);border-color:${color||'var(--acc)'};color:${color||'var(--acc)'}`:''}" onclick="_enqStatusFilter=_enqStatusFilter==='${value}'?'':'${value}';renderEnquiries()">${label}${count?` (${count})`:''}</span>`;
  }

  function miniPipeline(status){
    const isPending=status==='Pending',isFinal=status==='Finalized';
    const curIdx=ENQ_PIPELINE.indexOf(status);
    const compIdx=(isPending||isFinal)?ENQ_PIPELINE.length:curIdx;
    return`<div class="enq-pipe">${ENQ_PIPELINE.map((s,i)=>{
      const done=i<compIdx;
      const isCur=i===curIdx&&!isPending&&!isFinal;
      const sc=ENQ_STATUSES[s]||ENQ_STATUSES['New'];
      return`${i>0?`<div class="enq-line" style="background:${done?'rgba(39,174,96,.4)':'var(--bdr)'}"></div>`:''}
        <div class="enq-dot${isCur?' cur':''}" style="background:${done?'var(--green)':(isCur?sc.color:'var(--bdr)')}">${done?'✓':''}</div>`;
    }).join('')}</div>`;
  }

  g('pg').innerHTML=`
    <div class="s-wrap" style="max-width:400px;margin-bottom:10px"><span class="s-ic">🔍</span><input class="s-in" placeholder="Search name, phone, location, rep…" value="${_enqSearch}" oninput="_enqSearch=this.value;renderEnquiries()"></div>
    <div class="chips" style="margin-bottom:12px">
      ${filterChip('All','',ENQUIRIES.length)}
      ${Object.entries(ENQ_STATUSES).map(([k,v])=>{
        const c=statusCounts[k]||0;
        return c>0?filterChip(v.short,k,c,v.color):'';
      }).join('')}
    </div>
    ${list.map(e=>{
      const sc=ENQ_STATUSES[e.enquiry_status]||ENQ_STATUSES['New'];
      const pl=PROJECT_LABELS[e.project_type]||e.project_type;
      return`<div class="enq-card" onclick="openEnquiryDetail('${e.id}')">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
          <span style="font-weight:700;font-size:15px">${e.customer_name}</span>
          <span class="enq-stchip" style="background:rgba(${hexToRgb(sc.color)},.15);color:${sc.color}">${sc.emoji} ${sc.short}</span>
        </div>
        ${miniPipeline(e.enquiry_status)}
        <div style="display:flex;gap:6px;margin:8px 0">
          <span style="background:rgba(232,144,10,.12);color:var(--acc);padding:2px 8px;border-radius:7px;font-size:10px;font-weight:600">${pl}</span>
          <span style="background:${e.house_type==='new'?'rgba(39,174,96,.12)':'rgba(230,126,34,.12)'};color:${e.house_type==='new'?'var(--green)':'var(--yel)'};padding:2px 8px;border-radius:7px;font-size:10px;font-weight:600">${e.house_type==='new'?'🏠 New':'🏚️ Old'}</span>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:2px">📞 ${e.phone1}</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:2px">📍 ${e.location||'—'}</div>
        ${e.assigned_rep?`<div style="font-size:12px;color:#5C6BC0;margin-bottom:2px">👤 ${e.assigned_rep}</div>`:''}
        ${e.enquiry_status==='Pending'&&e.pending_reason?`<div style="font-size:11px;color:var(--red);margin-top:4px">⚠️ ${e.pending_reason}</div>`:''}
        <div style="border-top:1px solid var(--bdr);margin-top:8px;padding-top:6px;display:flex;gap:10px;font-size:10px;color:var(--muted)">
          <span>📅 ${e.entry_date||''}</span><span>👤 ${e.entered_by||''}</span>
          ${ME.role==='owner'?`<span style="margin-left:auto;color:#5C6BC0;cursor:pointer" onclick="event.stopPropagation();assignEnqRep('${e.id}')">${e.assigned_rep?'Change Rep':'Assign Rep'}</span>`:''}
        </div>

async function updateEnqStatus(eid,newStatus){
  const e=ENQUIRIES.find(x=>x.id===eid);if(!e)return;
  let pendingReason='',note='';
  if(newStatus==='Pending'){
    pendingReason=prompt('Why is this pending?');
    if(!pendingReason)return;
    note='Pending: '+pendingReason;
  }
  const history=[...(e.status_history||[]),{status:newStatus,date:todayStr(),updated_by:ME.name,note}];
  const updates={enquiry_status:newStatus,status_history:history};
  if(pendingReason) updates.pending_reason=pendingReason;
  if(newStatus==='Finalized') updates.pending_reason='';
  try{
    await DB.from('customer_enquiries').update(updates).eq('id',eid);
    toast('ok','Status → '+newStatus);closeDyn();await loadEnquiries();renderEnquiries();
  }catch(ex){toast('err',ex.message)}
}

async function assignEnqRep(eid){
  const reps=USERS.filter(u=>u.approved&&u.status==='active');
  const sel=prompt('Assign rep:\\n'+reps.map((u,i)=>`${i+1}. ${u.name} (${ROLES[u.role]||u.role})`).join('\\n')+'\\nEnter number:');
  if(!sel)return;
  const ci=parseInt(sel)-1;if(ci<0||ci>=reps.length)return;
  const rep=reps[ci];
  const e=ENQUIRIES.find(x=>x.id===eid);if(!e)return;
  const history=[...(e.status_history||[]),{status:'Rep Assigned',date:todayStr(),updated_by:ME.name,note:'Assigned to '+rep.name}];
  await DB.from('customer_enquiries').update({
    assigned_rep:rep.name,
    enquiry_status:e.enquiry_status==='New'?'Rep Assigned':e.enquiry_status,
    status_history:history
  }).eq('id',eid);
  await loadEnquiries();renderEnquiries();
}

function todayStr(){const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// DELIVERY CALENDAR
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderCalendar(){
  g('tb-a').innerHTML='';
  const now=new Date();
  const firstDay=new Date(_calYear,_calMonth,1);
  const daysInMonth=new Date(_calYear,_calMonth+1,0).getDate();
  const startDow=firstDay.getDay();
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];

  // Get visible orders (active, not closed/delivered)
  let vis=ORDERS.filter(o=>!['Closed','Delivered'].includes(o.status));
  if(ME.role==='sales') vis=vis.filter(o=>o.sales_person===ME.name);
  else if(ME.role==='branch_head') vis=vis.filter(o=>o.branch_name===ME.branch);
  else if(ME.role==='carpenter') vis=vis.filter(o=>(o.products||[]).some(p=>p.product_type==='manufacture'&&p.assigned_to===ME.name));
  else if(ME.role==='driver') vis=vis.filter(o=>(o.products||[]).some(p=>p.product_status==='Out for Delivery'));

  // Map: dateKey → orders
  const ordersByDate={};
  vis.forEach(o=>{try{const d=new Date(o.delivery_date);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;(ordersByDate[k]=ordersByDate[k]||[]).push(o)}catch(_){}});

  function dayColor(count){return count>=4?'var(--red)':count>=2?'var(--yel)':'var(--green)'}

  // Calendar grid
  let gridHtml='';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{gridHtml+=`<div class="cal-dh" style="${d==='Sun'?'color:var(--red)':''}">${d}</div>`});
  for(let w=0;w<6;w++){
    for(let d=0;d<7;d++){
      const dayIdx=w*7+d-startDow+1;
      if(dayIdx<1||dayIdx>daysInMonth){gridHtml+='<div></div>';continue}
      const date=new Date(_calYear,_calMonth,dayIdx);
      const k=`${_calYear}-${String(_calMonth+1).padStart(2,'0')}-${String(dayIdx).padStart(2,'0')}`;
      const orders=ordersByDate[k]||[];
      const isToday=date.getFullYear()===now.getFullYear()&&date.getMonth()===now.getMonth()&&date.getDate()===now.getDate();
      const isSel=_calSelDay===k;
      const isPast=date<new Date(now.getFullYear(),now.getMonth(),now.getDate());
      gridHtml+=`<div class="cal-day${isToday?' today':''}${isSel?' sel':''}${isPast?' past':''}" onclick="_calSelDay=_calSelDay==='${k}'?null:'${k}';renderCalendar()">
        <span style="font-weight:${isToday?'800':'500'}">${dayIdx}</span>
        ${orders.length?`<div style="display:flex;align-items:center;gap:2px"><div class="cal-dot" style="background:${dayColor(orders.length)}"></div>${orders.length>1?`<span style="font-size:9px;color:${dayColor(orders.length)};font-weight:700">${orders.length}</span>`:''}</div>`:''}
      </div>`;
    }
  }

  // Selected day panel
  let panelHtml='';
  if(_calSelDay){
    const selOrders=ordersByDate[_calSelDay]||[];
    const [y,m,dd]=_calSelDay.split('-');
    panelHtml=`<div class="cal-panel">
      <div style="font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px">${dd}/${m}/${y} — ${selOrders.length?`${selOrders.length} deliver${selOrders.length===1?'y':'ies'}`:'No deliveries'}</div>
      ${selOrders.map(o=>`<div class="ord-c" onclick="openOrd('${o.order_id}')">
        <div style="display:flex;justify-content:space-between;align-items:center"><div><div class="ord-trk">${o.tracking_code}</div><div class="ord-nm">${o.customer_name}</div></div>
        <span class="badge ${priB(o.priority)}" style="font-size:10px">${o.priority==='High'?'🔴':'🟢'} ${o.priority}</span></div>
      </div>`).join('')||'<div style="color:var(--muted);font-size:13px">No orders on this date</div>'}
    </div>`;
  }else{
    // Show next 14 days summary
    const upcoming=[];
    for(let i=0;i<=14;i++){
      const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);
      const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const orders=ordersByDate[k]||[];
      if(orders.length) upcoming.push({date:d,key:k,orders});
    }
    panelHtml=`<div class="cal-panel">
      ${upcoming.length?`<div style="font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px">📅 Next 14 Days</div>
        ${upcoming.map(u=>`<div style="display:flex;gap:8px;margin-bottom:8px">
          <div style="width:50px;text-align:center"><div style="font-size:10px;color:var(--acc);font-weight:700">${u.date.getDate()===now.getDate()?'Today':['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][u.date.getDay()]}</div><div style="font-size:12px;font-weight:600;color:var(--muted)">${u.date.getDate()}/${u.date.getMonth()+1}</div></div>
          <div style="flex:1">${u.orders.map(o=>`<div style="background:${o.priority==='High'?'rgba(224,60,49,.1)':o.priority==='Medium'?'rgba(230,126,34,.1)':'rgba(39,174,96,.08)'};border-radius:6px;padding:6px 10px;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:12px;font-weight:600" onclick="openOrd('${o.order_id}')"><span>${o.customer_name}</span><span>${o.priority==='High'?'🔴':o.priority==='Medium'?'🟡':'🟢'}</span></div>`).join('')}</div>
        </div>`).join('')}`
        :`<div style="text-align:center;padding:20px;color:var(--muted)"><div style="font-size:36px">📅</div><div style="margin-top:6px">Tap a date to see orders</div><div style="font-size:12px;margin-top:3px">No deliveries in next 14 days</div></div>`}
    </div>`;
  }

  g('pg').innerHTML=`
    <div class="cal-hd">
      <button class="btn bs bsm" onclick="_calMonth--;if(_calMonth<0){_calMonth=11;_calYear--};_calSelDay=null;renderCalendar()">◀</button>
      <div style="flex:1;text-align:center;font-weight:800;font-size:16px">${months[_calMonth]} ${_calYear}</div>
      <button class="btn bs bsm" onclick="_calMonth++;if(_calMonth>11){_calMonth=0;_calYear++};_calSelDay=null;renderCalendar()">▶</button>
      <button class="btn bp bsm" onclick="_calMonth=${now.getMonth()};_calYear=${now.getFullYear()};_calSelDay=null;renderCalendar()">Today</button>
    </div>
    <div class="cal-legend"><div class="cal-leg-d" style="background:var(--green)"></div>1 <div class="cal-leg-d" style="background:var(--yel)"></div>2–3 <div class="cal-leg-d" style="background:var(--red)"></div>4+ deliveries</div>
    <div class="cal-grid">${gridHtml}</div>
    ${panelHtml}
  `;
}

        <select class="fi" id="calc-lw-unit" onchange="calcLW()" style="width:60px"><option value="feet">ft</option><option value="inches">in</option><option value="meters">m</option><option value="cm">cm</option></select>
      </div>
    </div>`:''}
    ${cfg.units.map(unitCard).join('')}
    <div class="calc-ref">
      <div class="calc-ref-t">💡 Quick Reference</div>
      <ul style="list-style:none;padding:0;margin:0">${cfg.ref.map(r=>`<li>• <strong>${r[0]}</strong> = ${r[1]}</li>`).join('')}</ul>
    </div>`;
}

function calcConvert(tab,fromUnit,val){
  const cfg=CALC[tab];
  const v=parseFloat(val);
  cfg.units.forEach(u=>{
    if(u===fromUnit)return;
    const inp=g('ci-'+u);if(!inp)return;
    if(isNaN(v)||val===''){inp.value='';return}
    const base=v*cfg.toBase[fromUnit];
    const result=base/cfg.toBase[u];
    inp.value=calcFmt(result);
  });
  // Highlight active
  cfg.units.forEach(u=>{
    const card=g('calc-'+u);if(card)card.classList.toggle('active',u===fromUnit&&val!=='');
  });
}
function calcFmt(v){if(v===0)return'0';if(Math.abs(v)>=1000)return v.toFixed(2);if(Math.abs(v)>=1)return parseFloat(v.toFixed(4)).toString();return parseFloat(v.toFixed(6)).toString()}
function calcClear(){document.querySelectorAll('[id^="ci-"]').forEach(i=>i.value='');document.querySelectorAll('.calc-card').forEach(c=>c.classList.remove('active'));const l=g('calc-lw-l'),w=g('calc-lw-w');if(l)l.value='';if(w)w.value=''}
function calcLW(){
  const l=parseFloat(g('calc-lw-l')?.value),w=parseFloat(g('calc-lw-w')?.value);
  if(isNaN(l)||isNaN(w))return;
  const unit=g('calc-lw-unit')?.value||'feet';
  const sqUnit='sq_'+unit;
  const area=l*w;
  const inp=g('ci-'+sqUnit);if(inp){inp.value=calcFmt(area);calcConvert('area',sqUnit,calcFmt(area))}
}

function openIV(urls,idx,title){
  if(!urls||!urls.length)return;
  _ivUrls=Array.isArray(urls)?urls:[urls];_ivIdx=Math.max(0,Math.min(idx||0,_ivUrls.length-1));
  g('iv-title').textContent=title||'';
  g('iv-ov').style.display='flex';
  g('iv-ov').classList.remove('dn');
  renderIV();
}
function renderIV(){
  const img=g('iv-img');
  img.src=_ivUrls[_ivIdx];
  img.style.maxWidth='95vw';img.style.maxHeight='calc(100vh - 90px)';
  g('iv-ctr').textContent=_ivUrls.length>1?`${_ivIdx+1}/${_ivUrls.length}`:'';
  g('iv-prev').style.display=_ivIdx>0?'':'none';
  g('iv-next').style.display=_ivIdx<_ivUrls.length-1?'':'none';
}
function navIV(d){_ivIdx=Math.max(0,Math.min(_ivUrls.length-1,_ivIdx+d));renderIV()}

function toast(type,msg){
  const ic={ok:'✅',err:'❌',info:'ℹ️'};
  const tc={ok:'toks',err:'toke',info:'toki'};
  const el=document.createElement('div');
  el.className='toast '+tc[type];
  el.innerHTML=`<span>${ic[type]||'•'}</span><span>${msg}</span>`;
  g('toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},3200);
}

function fmtDate(s){
  if(!s)return'—';
  try{const d=new Date(s);return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',weekday:'short'})}catch(_){return s}
}
function fmtRel(s){
  if(!s)return'';
  try{
    const diff=Math.floor((Date.now()-new Date(s))/1000);
    if(diff<60)return'just now';if(diff<3600)return Math.floor(diff/60)+'m ago';
    if(diff<86400)return Math.floor(diff/3600)+'h ago';if(diff<604800)return Math.floor(diff/86400)+'d ago';
    return new Date(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
  }catch(_){return''}
}
function daysLeft(s){
  if(!s)return null;
  try{const d=new Date(s);d.setHours(0,0,0,0);const n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/86400000)}catch(_){return null}
}
function dlLbl(n){if(n===0)return'Today';if(n===1)return'Tomorrow';if(n===-1)return'Yesterday';return n<0?`${-n}d ago`:`${n}d`}
function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function ptIcon(t){return t==='vendor'?'🏪 ':t==='stock'?'📦 ':'🏭 '}
function stColor(s){
  const m={Delivered:'#27AE60','Out for Delivery':'#2D7DD2','Ready for Dispatch':'#2D7DD2','Quality Check':'#8E44AD','In Production':'#8E44AD','Assigned to Carpenter':'#E67E22','Sent to Factory':'#E67E22','Approved by Branch':'#2D7DD2','Waiting for Branch Approval':'#E8900A','Query Raised':'#E67E22',Closed:'#8B8FA8'};
  return m[s]||'#8B8FA8';
}
function badgeSt(s){
  if(!s)return'bnorm';
  if(['Delivered','Approved by Branch'].includes(s))return'bappr';
  if(['Pending Approval','Waiting for Branch Approval','Order Created'].includes(s))return'bpend';
  if(s==='Query Raised')return'bqry';
  if(['In Production','Assigned to Carpenter','Sent to Factory','Quality Check','Ready for Dispatch','Out for Delivery','In Progress','Order Placed','Product Received'].includes(s))return'bprod';
  return'bnorm';
}
