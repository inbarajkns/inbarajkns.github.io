          <option value="vendor" ${p.product_type==='vendor'?'selected':''}>🛒 Vendor (3rd party)</option>
          <option value="stock" ${p.product_type==='stock'?'selected':''}>🏬 Stock (in-store)</option>
        </select>
      </label>

      <label class="field"><span class="lbl">Product Name *</span>
        <input data-pn="product_name" data-pi="${i}" value="${esc(p.product_name)}" />
      </label>
      <label class="field"><span class="lbl">Material</span>
        <input data-pn="material_type" data-pi="${i}" value="${esc(p.material_type)}" />
      </label>
      <div class="row gap8">
        <label class="field flex1"><span class="lbl">Size</span>
          <input data-pn="size" data-pi="${i}" value="${esc(p.size)}" />
        </label>
        <label class="field flex1"><span class="lbl">Color</span>
          <input data-pn="color" data-pi="${i}" value="${esc(p.color)}" />
        </label>
      </div>
      <div class="row gap8">
        <label class="field flex1"><span class="lbl">Quantity *</span>
          <input data-pn="quantity" data-pi="${i}" type="number" min="1" value="${esc(p.quantity || 1)}" />
        </label>
        <label class="field flex1"><span class="lbl">Unit Value (₹)</span>
          <input data-pn="unit_value" data-pi="${i}" type="number" min="0" step="1" value="${esc(p.unit_value || '')}" />
        </label>
      </div>

      ${p.product_type === 'vendor' ? `
        <div class="row gap8">
          <label class="field flex1"><span class="lbl">Vendor Brand</span>
            <input data-pn="vendor_brand" data-pi="${i}" value="${esc(p.vendor_brand)}" />
          </label>
          <label class="field flex1"><span class="lbl">Vendor Product Name</span>
            <input data-pn="vendor_product_name" data-pi="${i}" value="${esc(p.vendor_product_name)}" />
          </label>
        </div>
      ` : ''}

      <div class="text-xs muted mt8 mb4">📸 Images</div>
      <div class="row gap8" style="flex-wrap:wrap">
        ${imageTile('Showroom', `pi-show-${i}`, p.showroomFile || p.showroom_image_url)}
        ${imageTile('Drawing*', `pi-draw-${i}`, exDrawings.length || p.drawingFiles.length, true, exDrawings.length + p.drawingFiles.length)}
        ${imageTile('Reference', `pi-ref-${i}`, exRefs.length || p.referenceFiles.length, true, exRefs.length + p.referenceFiles.length)}
        ${imageTile('Model', `pi-model-${i}`, p.modelFile || p.model_image_url)}
      </div>
      <input type="file" accept="image/*" capture="environment" style="display:none" data-pi-show="${i}" />
      <input type="file" accept="image/*" multiple style="display:none" data-pi-draw="${i}" />
      <input type="file" accept="image/*" multiple style="display:none" data-pi-ref="${i}" />
      <input type="file" accept="image/*" capture="environment" style="display:none" data-pi-model="${i}" />
      ${p.product_type === 'manufacture' ? `<p class="text-xs c-yellow mt4">⚠️ Drawing image is required for Manufacture products.</p>` : ''}
      <div data-pi-preview="${i}"></div>
    </div>
  `;
}

function imageTile(label, id, value, multi, count) {
  const has = !!value;
  return `
    <div class="upload-tile" id="${id}" style="flex:1;min-width:120px;${has ? 'border-style:solid;border-color:var(--accent);color:var(--accent)' : ''}">
      <span class="emoji">${has ? '✅' : '📷'}</span>
      <span>${esc(label)}${multi && count ? ` (${count})` : ''}</span>
    </div>
  `;
}

function bindNewOrderHandlers() {
  const s = NEW_ORDER_STATE;
  $('#no-back').onclick = async () => {
    if (await confirmDialog('Discard changes?', 'Your unsaved changes will be lost.', { okLabel: 'Discard' })) {
      NEW_ORDER_STATE = null;
      renderApp();
    }
  };
  $('#theme-toggle').onclick = () => { toggleTheme(); drawNewOrderScreen(); };

  // Top-level inputs
  const bind = (id, key) => $('#' + id).addEventListener('input', e => s[key] = e.target.value);
  bind('no-cname', 'customer_name');
  bind('no-cphone1', 'customer_number1');
  bind('no-cphone2', 'customer_number2');
  bind('no-addr', 'address');
  bind('no-floor', 'floor_number');
  bind('no-track', 'tracking_code');
  bind('no-ddate', 'delivery_date');
  bind('no-tval', 'total_order_value');
  $('#no-assembling').addEventListener('change', e => s.assembling_required = e.target.value);
  $('#no-verified').addEventListener('change', e => s.verified_by = e.target.value);

  // Order copy upload
  const ocTile = $('#no-oc-tile');
  ocTile.onclick = () => $('#no-oc-file').click();
  $('#no-oc-file').onchange = (e) => {
    const f = e.target.files[0];
    if (!f) return;
    s.orderCopyFile = f;
    $('#no-oc-text').textContent = '✅ ' + f.name;
    $('#no-oc-preview').innerHTML = `<div class="img-thumb full-w mt8"><img src="${URL.createObjectURL(f)}" /></div>`;
  };

  // Per-product field inputs
  $$('[data-pn]').forEach(inp => {
    inp.oninput = inp.onchange = (e) => {
      const i = parseInt(inp.dataset.pi);
      const k = inp.dataset.pn;
      s.products[i][k] = inp.value;
      // If product_type changed, redraw to show/hide vendor fields
      if (k === 'product_type') drawNewOrderScreen();
    };
  });

  // Remove product
  $$('[data-rm-product]').forEach(b => b.onclick = () => {
    s.products.splice(parseInt(b.dataset.rmProduct), 1);
    drawNewOrderScreen();
  });
  $('#no-add-product').onclick = () => {
    s.products.push(emptyProduct());
    drawNewOrderScreen();
  };

  // Image tile clicks
  $$('[id^="pi-show-"]').forEach(tile => {
    const i = tile.id.split('-').pop();
    tile.onclick = () => $(`[data-pi-show="${i}"]`).click();
  });
  $$('[id^="pi-draw-"]').forEach(tile => {
    const i = tile.id.split('-').pop();
    tile.onclick = () => $(`[data-pi-draw="${i}"]`).click();
  });
  $$('[id^="pi-ref-"]').forEach(tile => {
    const i = tile.id.split('-').pop();
    tile.onclick = () => $(`[data-pi-ref="${i}"]`).click();
  });
  $$('[id^="pi-model-"]').forEach(tile => {
    const i = tile.id.split('-').pop();
    tile.onclick = () => $(`[data-pi-model="${i}"]`).click();
  });

  // File inputs
  $$('[data-pi-show]').forEach(inp => inp.onchange = (e) => {
    const i = parseInt(inp.dataset.piShow);
    const f = e.target.files[0];
    if (!f) return;
    s.products[i].showroomFile = f;
    s.products[i].showroom_image_url = '';
    drawNewOrderScreen();
  });
  $$('[data-pi-draw]').forEach(inp => inp.onchange = (e) => {
    const i = parseInt(inp.dataset.piDraw);
    s.products[i].drawingFiles = (s.products[i].drawingFiles || []).concat(Array.from(e.target.files || []));
    drawNewOrderScreen();
  });
  $$('[data-pi-ref]').forEach(inp => inp.onchange = (e) => {
    const i = parseInt(inp.dataset.piRef);
    s.products[i].referenceFiles = (s.products[i].referenceFiles || []).concat(Array.from(e.target.files || []));
    drawNewOrderScreen();
  });
  $$('[data-pi-model]').forEach(inp => inp.onchange = (e) => {
    const i = parseInt(inp.dataset.piModel);
    const f = e.target.files[0];
    if (!f) return;
    s.products[i].modelFile = f;
    s.products[i].model_image_url = '';
    drawNewOrderScreen();
  });

  // Preview/save
  $('#no-preview').onclick = previewAndSave;
}

async function previewAndSave() {
  const s = NEW_ORDER_STATE;
  // Validate
  if (!s.customer_name) return toast('Customer name required', 'red');
  if (!s.delivery_date) return toast('Delivery date required', 'red');
  if (!s.tracking_code) return toast('Tracking code required', 'red');
  const tval = parseFloat(s.total_order_value);
  if (!tval || tval <= 0) return toast('Total order value is required', 'red');

  for (let i = 0; i < s.products.length; i++) {
    const p = s.products[i];
    if (!p.product_name) return toast(`Product ${i+1}: name required`, 'red');
    if (p.product_type === 'manufacture') {
      const drawCount = (p._existingDrawings || []).length + (p.drawingFiles || []).length;
      if (drawCount === 0) return toast(`Product ${i+1}: Drawing image required for Manufacture`, 'red');
    }
  }

  if (!s.isEdit) {
    // Check duplicate tracking code
    try {
      const all = await DB.getOrders();
      if (all.some(o => (o.tracking_code || '').trim().toLowerCase() === s.tracking_code.trim().toLowerCase())) {
        return toast(`❌ Tracking code "${s.tracking_code}" already exists`, 'red');
      }
    } catch(_) {}
  }

  const node = el('div');
  node.innerHTML = `
    <p class="text-sm muted mb12">Review the order before submitting:</p>
    <div class="card">
      <div class="kv-row"><span class="k">Customer</span><span class="v">${esc(s.customer_name)}</span></div>
      <div class="kv-row"><span class="k">Phone</span><span class="v">${esc(s.customer_number1)}${s.customer_number2 ? ' / ' + esc(s.customer_number2) : ''}</span></div>
      <div class="kv-row"><span class="k">Address</span><span class="v">${esc(s.address)}</span></div>
      <div class="kv-row"><span class="k">Delivery</span><span class="v">${fmtDate(s.delivery_date)}</span></div>
      <div class="kv-row"><span class="k">Total Value</span><span class="v">₹ ${Number(s.total_order_value).toLocaleString('en-IN')}</span></div>
      <div class="kv-row"><span class="k">Products</span><span class="v">${s.products.length}</span></div>
    </div>
    ${s.products.map((p, i) => `
      <div class="card" style="border-left:3px solid var(--accent)">
        <b>Product ${i+1}: ${esc(p.product_name)}</b>
        <div class="text-xs muted">${esc(p.product_type)} · qty ${esc(p.quantity || 1)} · ${esc(p.material_type || '')} · ${esc(p.size || '')} · ${esc(p.color || '')}</div>
      </div>
    `).join('')}
  `;
  showModal({
    title: s.isEdit ? '💾 Save Changes?' : '👁️ Confirm Order',
    body: node,
    actions: [
      { label: 'Back to edit' },
      { label: s.isEdit ? '💾 Save' : '✅ Submit', kind: '', onClick: async () => {
        await saveOrder();
      }},
    ],
  });
}

async function saveOrder() {
  const s = NEW_ORDER_STATE;
  const u = STATE.user;
  toast('⬆ Uploading...', 'green');
  try {
    let orderCopyUrl = s.order_copy_url;
    if (s.orderCopyFile) orderCopyUrl = await DB.uploadImage(s.orderCopyFile, 'order-copies');

    const products = [];
    for (const p of s.products) {
      const obj = {
        product_name: p.product_name, material_type: p.material_type,
        size: p.size, color: p.color,
        verified_type: p.verified_type || 'physical',
        vendor_brand: p.vendor_brand || '',
        vendor_product_name: p.vendor_product_name || '',
        stock_available: p.stock_available || 'yes',
        product_type: p.product_type,
        quantity: parseInt(p.quantity) || 1,
        unit_value: parseFloat(p.unit_value) || 0,
        showroom_image_url: p.showroom_image_url || '',
        drawing_image_urls: (p._existingDrawings || []).join(','),
        reference_image_urls: (p._existingRefs || []).join(','),
        model_image_url: p.model_image_url || '',
        completed_image_url: '',
        product_status: 'Pending Approval',
        product_query: '', assigned_to: '', completed_at: '',
      };
      if (p.showroomFile) obj.showroom_image_url = await DB.uploadImage(p.showroomFile, 'showroom');
      if (p.modelFile) obj.model_image_url = await DB.uploadImage(p.modelFile, 'model');
      const drawingUrls = (p._existingDrawings || []).slice();
      for (const f of (p.drawingFiles || [])) drawingUrls.push(await DB.uploadImage(f, 'drawings'));
      obj.drawing_image_urls = drawingUrls.join(',');
      const refUrls = (p._existingRefs || []).slice();
      for (const f of (p.referenceFiles || [])) refUrls.push(await DB.uploadImage(f, 'reference'));
      obj.reference_image_urls = refUrls.join(',');
      products.push(obj);
    }

    if (s.isEdit) {
      await DB.updateOrder(s.orderId, {
        customer_name: s.customer_name,
        customer_number1: s.customer_number1,
        customer_number2: s.customer_number2,
        address: s.address, floor_number: s.floor_number,
        assembling_required: s.assembling_required,
        verified_by: s.verified_by,
        delivery_date: s.delivery_date,
        total_order_value: parseFloat(s.total_order_value) || 0,
        order_copy_url: orderCopyUrl,
        products,
        is_second_approval: true,  // BH must re-approve after edits
      });
      await DB.addComment({
        orderId: s.orderId, userId: u.id, userName: u.name, userRole: u.role,
        comment: `✏️ Order edited by ${u.name}.`, isSystem: true,
      }).catch(() => {});
      toast('✅ Saved', 'green');
    } else {
      await DB.createOrder({
        order_id: s.orderId,
        tracking_code: s.tracking_code,
        branch_name: u.branch,
        sales_person: u.role === 'sales' ? u.name : (s.sales_person || u.name),
        customer_name: s.customer_name,
        customer_number1: s.customer_number1,
        customer_number2: s.customer_number2,
        address: s.address, floor_number: s.floor_number,
        assembling_required: s.assembling_required,
        verified_by: s.verified_by,
        delivery_date: s.delivery_date,
        manufacture_or_vendor: products[0]?.product_type || 'manufacture',
        status: 'Waiting for Branch Approval',
        priority: 'Normal',
        branch_approved: 'no',
        branch_approved_by: '',
        factory_assigned_to: '',
        created_at: todayISO(),
        products,
        order_copy_url: orderCopyUrl,
        total_order_value: parseFloat(s.total_order_value) || 0,
      });
      await DB.addComment({
        orderId: s.orderId, userId: u.id, userName: u.name, userRole: u.role,
        comment: `📝 Order created by ${u.name}.`, isSystem: true,
      }).catch(() => {});
      toast('✅ Order created!', 'green');
    }
    NEW_ORDER_STATE = null;
    closeModal();
    renderApp();
  } catch (e) { toast(e.message || 'Error saving', 'red'); }
}

/* ────────────────────────────────────────────────────────────────────
   USERS TAB (owner only)
   ──────────────────────────────────────────────────────────────────── */
const USERS_STATE = { tab: 0 };
function renderUsersTab(host) {
  const pending = STATE.users.filter(u => !u.approved || u.status === 'pending');
  const active  = STATE.users.filter(u => u.approved && u.status === 'active');
  host.innerHTML = `
    <div class="tabs">
      <button class="tab ${USERS_STATE.tab === 0 ? 'active' : ''}" data-utab="0">Pending ${pending.length ? `<span class="count-badge" style="background:var(--yellow)">${pending.length}</span>` : ''}</button>
      <button class="tab ${USERS_STATE.tab === 1 ? 'active' : ''}" data-utab="1">Active ${active.length ? `<span class="count-badge" style="background:var(--green)">${active.length}</span>` : ''}</button>
    </div>
    <div class="container">
      ${(USERS_STATE.tab === 0 ? pending : active).length === 0 ? `
        <div class="empty"><span class="emoji">${USERS_STATE.tab === 0 ? '✅' : '👥'}</span>${USERS_STATE.tab === 0 ? 'No pending approvals' : 'No active users'}</div>
      ` : (USERS_STATE.tab === 0 ? pending : active).map(u => userCard(u)).join('')}
    </div>
  `;
  $$('[data-utab]').forEach(b => b.onclick = () => {
    USERS_STATE.tab = parseInt(b.dataset.utab);
    renderUsersTab(host);
  });
  $$('[data-u-edit]').forEach(b => b.onclick = () => editUserDialog(b.dataset.uEdit));
  $$('[data-u-approve]').forEach(b => b.onclick = async () => {
    try {
      await DB.updateUser(b.dataset.uApprove, { approved: true, status: 'active' });
      toast('✅ User approved', 'green');
    } catch (e) { toast(e.message || 'Error', 'red'); }
  });
  $$('[data-u-reject]').forEach(b => b.onclick = async () => {
    if (!await confirmDialog('Reject & Delete User?', 'This will permanently delete this user.', { okLabel: 'Delete' })) return;
    try {
      await DB.deleteUser(b.dataset.uReject);
      toast('🗑️ User deleted', 'yellow');
    } catch (e) { toast(e.message || 'Error', 'red'); }
  });
  $$('[data-u-suspend]').forEach(b => b.onclick = async () => {
    if (!await confirmDialog('Suspend user?', 'They will not be able to log in until reactivated.', { okLabel: 'Suspend', okKind: 'yellow' })) return;
    try {
      await DB.updateUser(b.dataset.uSuspend, { status: 'suspended' });
      toast('User suspended', 'yellow');
    } catch (e) { toast(e.message || 'Error', 'red'); }
  });
}

  const isPending = !u.approved || u.status === 'pending';
  return `
    <div class="card">
      <div class="row gap8 mb8">
        ${avatar(u.name)}
        <div class="flex1">
          <div class="fw7">${esc(u.name)}</div>
          <div class="row gap4 mt4">${roleTag(u.role)}<span class="text-xs muted">${esc(u.branch || '')}</span></div>
        </div>
        <button class="btn outline small" data-u-edit="${esc(u.id)}">✏️ Edit</button>
      </div>
      ${u.email ? `<div class="text-xs muted">📧 ${esc(u.email)}</div>` : ''}
      ${u.phone ? `<div class="text-xs muted">📞 <a href="tel:${esc(u.phone)}" style="color:var(--green)">${esc(u.phone)}</a></div>` : ''}
      ${isPending ? `
        <div class="row gap8 mt12">
          <button class="btn green flex1" data-u-approve="${esc(u.id)}">✅ Approve</button>
          <button class="btn outline red" data-u-reject="${esc(u.id)}">🗑️ Reject</button>

    <label class="field"><span class="lbl">Name</span><input id="u-name" value="${esc(u.name)}" /></label>

    <label class="field"><span class="lbl">Phone</span><input id="u-phone" type="tel" value="${esc(u.phone || '')}" /></label>
    <label class="field"><span class="lbl">PIN</span><input id="u-pin" type="text" inputmode="numeric" value="${esc(u.password || '')}" /></label>
    <label class="field"><span class="lbl">Role</span>
      <select id="u-role">${ROLES.map(r => `<option value="${r}" ${u.role===r?'selected':''}>${esc(ROLE_LABELS[r])}</option>`).join('')}</select>
    </label>
    <label class="field"><span class="lbl">Branch</span>

/* ────────────────────────────────────────────────────────────────────
   TASKS TAB
   ──────────────────────────────────────────────────────────────────── */
function renderTasksTab(host) {
  const u = STATE.user;
  const f = STATE.filterState.tasks;
  const isOwner = u.role === 'owner';
  const allTasks = isOwner ? STATE.tasks : STATE.tasks.filter(t => t.assigned_to_id === u.id);
  const pending = allTasks.filter(t => t.status === 'pending');
  const doubt   = allTasks.filter(t => t.status === 'doubt');
  const done    = allTasks.filter(t => t.status === 'completed');

  let visible = allTasks;
  if (isOwner) {
    if (f.filter === 'pending') visible = pending;
    else if (f.filter === 'doubt') visible = doubt;
    else if (f.filter === 'completed') visible = done;
  }

  host.innerHTML = `
    ${isOwner ? `
      <div class="container" style="padding-bottom:6px">
        <div class="chip-row">
          <button class="chip ${f.filter==='pending'?'active':''}" data-tf="pending">Pending <span class="ct">${pending.length}</span></button>
          <button class="chip ${f.filter==='doubt'?'active':''}" data-tf="doubt">Doubts <span class="ct">${doubt.length}</span></button>
          <button class="chip ${f.filter==='completed'?'active':''}" data-tf="completed">Done <span class="ct">${done.length}</span></button>
          <button class="chip ${f.filter==='all'?'active':''}" data-tf="all">All <span class="ct">${allTasks.length}</span></button>
        </div>
      </div>
    ` : ''}
    <div class="container">
      ${visible.length === 0 ? `
        <div class="empty"><span class="emoji">✅</span>${isOwner ? 'No tasks here' : 'You\'re all caught up'}</div>
      ` : visible.map(t => taskCard(t, isOwner)).join('')}
      ${isOwner ? '<button class="btn full mt16" id="t-new">📋 Assign New Task</button>' : ''}
    </div>
  `;
  if (isOwner) {
    $$('[data-tf]').forEach(b => b.onclick = () => {
      f.filter = b.dataset.tf;
      renderTasksTab(host);
    });
    const newBtn = $('#t-new'); if (newBtn) newBtn.onclick = assignTaskDialog;
  }
  $$('[data-t-act]').forEach(b => b.onclick = () => taskActionDialog(b.dataset.tAct, b.dataset.tId));
  $$('[data-t-del]').forEach(b => b.onclick = async () => {
    if (!await confirmDialog('Delete task?', 'This task will be removed permanently.', { okLabel: 'Delete' })) return;
    try { await DB.deleteTask(b.dataset.tDel); toast('Deleted', 'yellow'); }
    catch (e) { toast(e.message || 'Error', 'red'); }
  });
}

function taskCard(t, isOwner) {
  const c = t.status === 'pending' ? 'var(--blue)' : t.status === 'doubt' ? 'var(--yellow)' : 'var(--green)';
  const icon = t.status === 'pending' ? '🟡' : t.status === 'doubt' ? '💬' : '✅';
  return `
    <div class="card" style="border-left:3px solid ${c}">
      <div class="row between mb4">
        <div class="row gap4">
          <span>${icon}</span>

      <div class="row gap8 mt8" style="justify-content:flex-end;flex-wrap:wrap">

          ${t.status === 'doubt' ? `<button class="btn small" data-t-act="reply" data-t-id="${esc(t.id)}">💬 Reply to Doubt</button>` : ''}
          <button class="btn outline red small" data-t-del="${esc(t.id)}">🗑️ Delete</button>
        ` : `
          ${t.status === 'pending' ? `
            <button class="btn green small" data-t-act="complete" data-t-id="${esc(t.id)}">✅ Mark Completed</button>
            <button class="btn outline yellow small" data-t-act="doubt" data-t-id="${esc(t.id)}">💬 Raise Doubt</button>
          ` : ''}
        `}
      </div>
    </div>
  `;
}

function taskActionDialog(action, id) {
  const t = STATE.tasks.find(x => x.id === id);
  if (!t) return;
  if (action === 'complete') {
    confirmDialog('Mark task completed?', 'You can add a note (optional).', { okLabel: 'Mark Done', okKind: '' }).then(async ok => {
      if (!ok) return;
      try {
        await DB.updateTask(id, { status: 'completed', completed_at: nowISO() });
        toast('✅ Marked done', 'green');
      } catch (e) { toast(e.message || 'Error', 'red'); }
    });
    return;
  }
  if (action === 'doubt') {
    const node = el('div');
    node.innerHTML = `<textarea id="td-note" rows="3" placeholder="What's unclear about this task?"></textarea>`;
    showModal({
      title: '💬 Raise Doubt',
      body: node,
      actions: [
        { label: 'Cancel' },
        { label: 'Send Doubt', kind: 'yellow', onClick: async () => {
          const note = node.querySelector('#td-note').value.trim();
          if (!note) { toast('Type your doubt', 'red'); return false; }
          try { await DB.updateTask(id, { status: 'doubt', status_note: note }); toast('💬 Doubt sent', 'green'); }
          catch (e) { toast(e.message || 'Error', 'red'); return false; }
        }},
      ],
    });
  }
  if (action === 'reply') {
    const node = el('div');
    node.innerHTML = `
      <p class="text-sm muted mb8">Their doubt: <b>${esc(t.status_note)}</b></p>
      <textarea id="tr-text" rows="3" placeholder="Your reply..."></textarea>
    `;
    showModal({
      title: '💬 Reply to Doubt',
      body: node,
      actions: [
        { label: 'Cancel' },
        { label: 'Send Reply', onClick: async () => {
          const text = node.querySelector('#tr-text').value.trim();
          if (!text) { toast('Type a reply', 'red'); return false; }
          try { await DB.updateTask(id, { doubt_reply: text, status: 'pending' }); toast('💬 Reply sent', 'green'); }
          catch (e) { toast(e.message || 'Error', 'red'); return false; }
        }},
      ],
    });
  }
}

const ENQ_STATUSES = ['New','Rep Assigned','Site Visited','WhatsApp Group Opened','Quotation Given','Finalized','Pending'];

function renderEnquiriesTab(host) {
  const u = STATE.user;
  const f = STATE.filterState.enquiries;
  let list = STATE.enquiries.slice();
  if (f.filter !== 'all') list = list.filter(e => e.enquiry_status === f.filter);

  host.innerHTML = `
    <div class="container" style="padding-bottom:6px">
      <div class="chip-row">
        <button class="chip ${f.filter==='all'?'active':''}" data-ef="all">All <span class="ct">${STATE.enquiries.length}</span></button>
        ${ENQ_STATUSES.map(s => {
          const n = STATE.enquiries.filter(e => e.enquiry_status === s).length;
          return `<button class="chip ${f.filter===s?'active':''}" data-ef="${esc(s)}">${esc(s)} <span class="ct">${n}</span></button>`;
        }).join('')}
      </div>

      </div>

      <div class="kv-row"><span class="k">Project</span><span class="v">${esc(e.project_type)}${e.others_description?' — '+esc(e.others_description):''}</span></div>
      <div class="kv-row"><span class="k">House</span><span class="v">${esc(e.house_type)}</span></div>
      <div class="kv-row"><span class="k">Heard via</span><span class="v">${esc(e.heard_about_us || '—')}</span></div>
      <div class="kv-row"><span class="k">Entered</span><span class="v">${fmtDate(e.entry_date)} by ${esc(e.entered_by)}</span></div>
      ${e.assigned_rep?`<div class="kv-row"><span class="k">Rep</span><span class="v">${esc(e.assigned_rep)}</span></div>`:''}
      ${e.pending_reason?`<div class="banner yellow mt8 text-xs">⏸ ${esc(e.pending_reason)}</div>`:''}
      ${(e.custom_fields && Object.keys(e.custom_fields).length) ? Object.entries(e.custom_fields).map(([k,v]) => `<div class="kv-row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('') : ''}
    </div>

    ${e.enquiry_status === 'New' ? `
      <label class="field mt12"><span class="lbl">Assign Representative</span>
        <select id="enq-rep">
          <option value="">— Select Rep —</option>
          ${reps.map(r => `<option value="${esc(r.name)}">${esc(r.name)} (${esc(ROLE_LABELS[r.role])})</option>`).join('')}
        </select>
      </label>

    ${nextStatuses.length ? `
      <div class="mt12">
        <div class="text-xs muted mb4">Move to next stage:</div>
        <div class="row gap8" style="flex-wrap:wrap">
          ${nextStatuses.map(s => `<button class="btn small" data-enq-next="${esc(s)}">→ ${esc(s)}</button>`).join('')}
        </div>
      </div>
    ` : ''}

    <div class="row gap8 mt12">
      <button class="btn outline flex1" id="enq-edit">✏️ Edit</button>
      <button class="btn outline red" id="enq-del">🗑️ Delete</button>
    </div>
  `;
  showModal({
    title: '📞 Enquiry Details',
    body,
    actions: [{ label: 'Close' }],
  });

  body.querySelector('#enq-del').onclick = async () => {
    if (!await confirmDialog('Delete enquiry?', 'This cannot be undone.', { okLabel: 'Delete' })) return;
    try { await DB.deleteEnquiry(e.id); toast('🗑 Deleted', 'yellow'); closeModal(); }
    catch (er) { toast(er.message || 'Error', 'red'); }
  };
  body.querySelectorAll('[data-enq-next]').forEach(b => b.onclick = async () => {
    const next = b.dataset.enqNext;
    let updates = { enquiry_status: next };
    if (next === 'Rep Assigned') {
      const rep = body.querySelector('#enq-rep')?.value;
      if (!rep) { toast('Select a rep first', 'red'); return; }
      updates.assigned_rep = rep;
    }
    if (next === 'Pending') {
      const reason = prompt('Reason for pending?');
      if (!reason) return;
      updates.pending_reason = reason;
    }
    const hist = (e.status_history || []).slice();
    hist.push({ status: next, date: nowISO(), updatedBy: u.name, note: updates.pending_reason || '' });
    updates.status_history = hist;
    try { await DB.updateEnquiry(e.id, updates); toast(`→ ${next}`, 'green'); closeModal(); }
    catch (er) { toast(er.message || 'Error', 'red'); }
  });
}

function manageCustomFieldsDialog() {

  function rebuild() {
    node.innerHTML = `

      <div id="cf-list">
        ${STATE.customFields.length === 0 ? '<p class="muted text-xs">No custom fields yet.</p>' :
          STATE.customFields.map(f => `

          `).join('')}

      <div class="row gap8 mt12">
        <input id="cf-new" placeholder="Field name (e.g. Site Photo Link)" style="flex:1" />
        <button class="btn" id="cf-add">+ Add</button>
      </div>
    `;
    node.querySelectorAll('[data-cf-del]').forEach(b => b.onclick = async () => {

    node.querySelector('#cf-add').onclick = async () => {

        });

        rebuild();
      } catch (e) { toast(e.message || 'Error', 'red'); }
    };
  }
  rebuild();
  showModal({
    title: '🛠 Custom Form Fields',
    body: node,
    actions: [{ label: 'Done' }],
  });
}

/* ────────────────────────────────────────────────────────────────────
   CALENDAR TAB
   ──────────────────────────────────────────────────────────────────── */
let CAL_STATE = { y: new Date().getFullYear(), m: new Date().getMonth() };

function renderCalendarTab(host) {
  const u = STATE.user;
  let scope = STATE.orders.slice();
  if (u.role === 'sales') scope = scope.filter(o => o.sales_person === u.name);
  if (u.role === 'branch_head') scope = scope.filter(o => o.branch_name === u.branch);
  if (u.role === 'driver') scope = scope.filter(o => orderProducts(o).some(p => p.product_status === 'Out for Delivery'));

  const ordersByDate = {};
  for (const o of scope) {
    const d = deliveryDateFor(o, u.role);
    if (d) (ordersByDate[d] = ordersByDate[d] || []).push(o);
  }

  const first = new Date(CAL_STATE.y, CAL_STATE.m, 1);
  const lastDay = new Date(CAL_STATE.y, CAL_STATE.m + 1, 0).getDate();
  const startWeekDay = first.getDay();
  const todayIso = todayISO();
  const monthName = first.toLocaleString('default', { month: 'long' });

  const days = [];
  for (let i = 0; i < startWeekDay; i++) days.push(null);
  for (let d = 1; d <= lastDay; d++) days.push(d);

  host.innerHTML = `
    <div class="container">
      <div class="row between mb12">
        <button class="btn outline small" id="cal-prev">‹</button>
        <h3 style="font-size:16px">${monthName} ${CAL_STATE.y}</h3>
        <button class="btn outline small" id="cal-next">›</button>
      </div>
      <div class="cal-head">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div>${d}</div>`).join('')}</div>
      <div class="cal-grid">
        ${days.map(d => {
          if (!d) return '<div class="cal-day muted"></div>';
          const iso = `${CAL_STATE.y}-${String(CAL_STATE.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const list = ordersByDate[iso] || [];
          const isToday = iso === todayIso;
          return `
            <div class="cal-day ${isToday ? 'today' : ''}" data-cal-day="${iso}">
              <span class="num">${d}</span>
              ${list.length ? `<div class="dots">${list.slice(0,5).map(o => `<span class="dot" style="background:${statusColor(computedStatus(o))}"></span>`).join('')}${list.length>5?'<span class="text-xs">+'+(list.length-5)+'</span>':''}</div>` : ''}
            </div>
          `;
        }).join('')}
      </div>

      <h3 class="section-title">Today &amp; Upcoming (next 7 days)</h3>
      ${(() => {
        const upcoming = [];
        const today = new Date();
        for (let i = 0; i < 7; i++) {
          const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
          const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          if (ordersByDate[iso]) upcoming.push({ iso, list: ordersByDate[iso] });
        }
        if (upcoming.length === 0) return '<div class="empty"><span class="emoji">📅</span>No deliveries in the next 7 days</div>';
        return upcoming.map(({ iso, list }) => `
          <h4 class="section-title">${fmtDate(iso)}${iso === todayIso ? ' (Today)' : ''}</h4>
          ${list.map(o => `
            <div class="card" data-order-card="${esc(o.order_id)}" style="cursor:pointer">
              <div class="row between mb4">
                <span class="fw7">${esc(o.customer_name)}</span>
                ${statusBadge(computedStatus(o))}
              </div>
              <div class="text-xs muted">#${esc(o.tracking_code)} · ${esc(o.branch_name)}</div>
            </div>
          `).join('')}
        `).join('');
      })()}
    </div>
  `;
  $('#cal-prev').onclick = () => { CAL_STATE.m--; if (CAL_STATE.m < 0) { CAL_STATE.m = 11; CAL_STATE.y--; } renderCalendarTab(host); };
  $('#cal-next').onclick = () => { CAL_STATE.m++; if (CAL_STATE.m > 11) { CAL_STATE.m = 0; CAL_STATE.y++; } renderCalendarTab(host); };
  $$('[data-cal-day]').forEach(d => d.onclick = () => {
    const iso = d.dataset.calDay;
    const list = ordersByDate[iso] || [];
    if (list.length === 0) return;
    const node = el('div');
    node.innerHTML = list.map(o => `
      <div class="card" data-order-card="${esc(o.order_id)}" style="cursor:pointer">
        <div class="row between mb4">
          <span class="fw7">${esc(o.customer_name)}</span>
          ${statusBadge(computedStatus(o))}
        </div>
        <div class="text-xs muted">#${esc(o.tracking_code)} · ${esc(o.branch_name)}</div>
      </div>
    `).join('');
    showModal({ title: `📅 ${fmtDate(iso)}`, body: node, actions: [{ label: 'Close' }] });
    node.querySelectorAll('[data-order-card]').forEach(c => c.onclick = () => {
      const o = STATE.orders.find(x => x.order_id === c.dataset.orderCard);
      if (o) { closeModal(); renderOrderDetail(o); }
    });
  });
  $$('[data-order-card]').forEach(c => c.onclick = () => {
    const o = STATE.orders.find(x => x.order_id === c.dataset.orderCard);
    if (o) renderOrderDetail(o);
  });
}

      <button class="tab ${CALC_STATE.tab==='weight'?'active':''}" data-calc="weight">⚖️ Weight</button>
    </div>
    <div class="container" id="calc-body"></div>
  `;
  $$('[data-calc]').forEach(b => b.onclick = () => {
    CALC_STATE.tab = b.dataset.calc;
    renderCalculatorTab(host);
  });
  if (CALC_STATE.tab === 'length') renderLengthCalc($('#calc-body'));
  else if (CALC_STATE.tab === 'area') renderAreaCalc($('#calc-body'));
  else renderWeightCalc($('#calc-body'));
}

function makeConverter(host, units, toBase, fromBase, refs) {
  // Each unit has its own input. When user types in one, others recompute.
  const values = Object.fromEntries(units.map(u => [u, '']));
  let active = null;

  function recompute(activeUnit) {
    const v = parseFloat(values[activeUnit]);
    if (isNaN(v)) {
      for (const u of units) if (u !== activeUnit) values[u] = '';
    } else {
      const base = v * toBase[activeUnit];
      for (const u of units) {
        if (u === activeUnit) continue;
        values[u] = (base / toBase[u]).toFixed(4).replace(/\.?0+$/, '');
      }
    }
    redraw();
  }

  function redraw() {
    host.innerHTML = `
      <div class="row between mb12">
        <span class="text-xs muted">👇 Type in any field — others update instantly</span>
        <button class="btn text" id="cl-clear">↻ Clear</button>
      </div>
      ${units.map(u => `
        <div class="card" style="border:1.5px solid ${active === u ? 'var(--accent)' : 'var(--border)'};${active === u ? 'background:var(--accent)0d' : ''}">
          <div class="row gap12">
            <div class="tac" style="width:64px">
              <div style="font-size:24px">${UNIT_EMOJI[u] || '📐'}</div>
              <div class="tag" style="background:${active === u ? 'var(--accent)' : 'var(--bg3)'};color:${active === u ? '#fff' : 'var(--text)'};margin-top:4px">${esc(UNIT_LABELS[u] || u)}</div>
            </div>
            <div class="flex1">
              <div class="text-xs muted">${esc(UNIT_NAMES[u] || u)}</div>
              <input data-cl-u="${u}" type="number" inputmode="decimal" value="${esc(values[u] || '')}" placeholder="—" style="font-size:22px;font-weight:800;border:0;background:transparent;padding:4px 0" />
            </div>
            ${values[u] ? `<button class="btn outline small" data-cl-copy="${u}">📋</button>` : ''}
          </div>
        </div>
      `).join('')}
      <div class="card" style="background:var(--accent)0d;border-color:var(--accent)33;margin-top:12px">
        <div class="row gap4 mb8"><span style="color:var(--accent)">💡</span><b style="color:var(--accent);font-size:13px">Quick Reference</b></div>
        ${refs.map(([a,b]) => `<div class="text-sm" style="margin-bottom:4px">• <b>${esc(a)}</b> <span class="muted">= ${esc(b)}</span></div>`).join('')}
      </div>
    `;
    host.querySelectorAll('[data-cl-u]').forEach(inp => {
      inp.oninput = () => {
        const u = inp.dataset.clU;
        active = u;
        values[u] = inp.value;
        recompute(u);
      };
      inp.onfocus = () => { active = inp.dataset.clU; redraw(); };
    });
    host.querySelector('#cl-clear').onclick = () => {
      for (const u of units) values[u] = '';
      active = null;
      redraw();
    };
    host.querySelectorAll('[data-cl-copy]').forEach(b => b.onclick = () => {
      navigator.clipboard.writeText(values[b.dataset.clCopy]).then(() => toast('📋 Copied', 'green'));
    });
  }
  redraw();
}

const UNIT_EMOJI = { mm:'📍', cm:'📐', inches:'📏', feet:'🦶', meters:'📏', sqft:'🟦', sqm:'🟦', sqcm:'🟪', sqin:'🟫', kg:'⚖️', g:'🪙', lb:'🏋️', oz:'🍃', tonne:'🚚' };
const UNIT_LABELS = { mm:'mm', cm:'cm', inches:'in', feet:'ft', meters:'m', sqft:'sqft', sqm:'m²', sqcm:'cm²', sqin:'in²', kg:'kg', g:'g', lb:'lb', oz:'oz', tonne:'t' };
const UNIT_NAMES = { mm:'Millimeters', cm:'Centimeters', inches:'Inches', feet:'Feet', meters:'Meters', sqft:'Square Feet', sqm:'Square Meters', sqcm:'Square Centimeters', sqin:'Square Inches', kg:'Kilograms', g:'Grams', lb:'Pounds', oz:'Ounces', tonne:'Tonnes' };

function renderLengthCalc(host) {
  const units = ['mm','cm','inches','feet','meters'];
  const toBase = { mm:0.001, cm:0.01, inches:0.0254, feet:0.3048, meters:1 };
  const refs = [
    ['1 inch', '2.54 cm = 25.4 mm'],
    ['1 foot', '12 inches = 30.48 cm'],
    ['1 meter', '3.28 ft = 39.37 in'],
    ['1 yard', '3 ft = 91.44 cm'],
  ];
  makeConverter(host, units, toBase, null, refs);
}
function renderAreaCalc(host) {
  const units = ['sqcm','sqin','sqft','sqm'];
  const toBase = { sqcm: 0.0001, sqin: 0.00064516, sqft: 0.092903, sqm: 1 };
  const refs = [
    ['1 sqft', '0.0929 m² = 144 sq in'],
    ['1 m²', '10.76 sqft'],
    ['1 cent', '435.6 sqft'],
  ];
  makeConverter(host, units, toBase, null, refs);
}
function renderWeightCalc(host) {
  const units = ['g','kg','lb','oz','tonne'];
  const toBase = { g: 0.001, kg: 1, lb: 0.453592, oz: 0.0283495, tonne: 1000 };
  const refs = [
    ['1 kg', '2.205 lb = 1000 g'],
    ['1 lb', '453.6 g = 16 oz'],
    ['1 tonne', '1000 kg'],
  ];
  makeConverter(host, units, toBase, null, refs);
}

   TRACK TAB
   ──────────────────────────────────────────────────────────────────── */
function renderTrackTab(host) {
  host.innerHTML = `
    <div class="container">
      <h3 class="section-title">Track an Order</h3>
      <div class="card">
        <p class="muted text-sm">Enter the tracking code shared with you.</p>
        <div class="row gap8 mt8">
          <input id="trk2-code" placeholder="e.g. OC1001" style="flex:1" />
          <button class="btn" id="trk2-go">Track</button>
        </div>
        <div id="trk2-result" style="margin-top:14px"></div>
      </div>
    </div>
  `;
  $('#trk2-go').onclick = async () => {
    const code = $('#trk2-code').value.trim();
    const out = $('#trk2-result');
    out.innerHTML = '';
    if (!code) return;
    out.innerHTML = '<div class="row gap8"><div class="spinner sm"></div><span class="muted">Searching…</span></div>';
    try {
      const o = await DB.trackOrder(code);
      if (!o) { out.innerHTML = '<div class="banner red">Order not found.</div>'; return; }
      out.innerHTML = renderTrackResult(o);
    } catch (e) {
      out.innerHTML = '<div class="banner red">' + esc(e.message || 'Error') + '</div>';
    }
  };
}

/* ────────────────────────────────────────────────────────────────────
   BOOT SEQUENCE
   ──────────────────────────────────────────────────────────────────── */
async function boot() {
  // 1. If no Supabase URL/key → setup
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
    renderSetup();
    return;
  }

  // 2. Init Supabase client
  initSupabase();
  if (!STATE.sb) {
    toast('Failed to init Supabase', 'red');
    renderSetup();
    return;
  }

  showSplash();

  // 3. Try seed (idempotent)
  try { await DB.seedIfEmpty(); } catch(e) { console.warn('seed:', e.message); }

  // 4. Try restoring session from localStorage
  const savedId = localStorage.getItem('iom_session_id');
  const savedRole = localStorage.getItem('iom_session_role');
  if (savedId && savedRole) {
    try {
      const users = await DB.getUsers();
      const found = users.find(x => x.id === savedId);
      if (found && found.approved && found.status === 'active') {
        // Restore session
        return onLogin(found);
      } else if (savedRole === 'owner' && savedId === 'owner-1') {
        return onLogin({
          id: 'owner-1', name: 'Owner', role: 'owner',
          branch: 'Steel Main Branch', password: '',
          email: 'owner@indira.com', phone: '9999999999',
          approved: true, status: 'active', pin_changed: true,
        });
      }
    } catch (e) {
      console.warn('restore session:', e.message);
    }
  }

  // 5. Otherwise show login
  renderLogin();
}

// Kick off
boot().catch(e => {
  console.error('boot failed:', e);
  toast('Boot error: ' + (e.message || ''), 'red');
  renderLogin();
});
