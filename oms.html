<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indira OMS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --acc:#E8900A;--acc2:#D4720A;--blue:#2D7DD2;--green:#27AE60;
  --red:#E03C31;--yel:#E67E22;--pur:#8E44AD;
  --bg:#0A0C10;--bg2:#111318;--bg3:#1A1D24;--bdr:#2A2D35;
  --card:#14171F;--txt:#E8EAF0;--muted:#8B8FA8;--inp:#1A1D24;
  --r:10px;--r2:6px;--shadow:0 4px 20px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px}
a{color:var(--acc);text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:10px}
.dn{display:none!important}

/* ─── Auth Screens ─── */
#screen-login{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 20% 50%,rgba(232,144,10,.08) 0%,transparent 60%),var(--bg);
  padding:20px
}
.a-card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:32px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.logo-i{width:40px;height:40px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px}
.logo-t{font-size:19px;font-weight:800}
.logo-s{font-size:11px;color:var(--muted)}
.ftitle{font-size:17px;font-weight:800;margin-bottom:4px}
.fsub{color:var(--muted);font-size:12px;margin-bottom:20px}

/* ─── Form ─── */
.fg{margin-bottom:12px}
.fl{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fi{width:100%;padding:9px 12px;background:var(--inp);border:1px solid var(--bdr);border-radius:var(--r2);color:var(--txt);transition:border-color .15s}
.fi:focus{outline:none;border-color:var(--acc)}
.fi::placeholder{color:var(--muted);opacity:.6}
select.fi option{background:var(--bg3)}
.fi-wrap{position:relative}
.fi-eye{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;font-size:15px;background:none;border:none;color:var(--muted)}
textarea.fi{resize:vertical;min-height:72px}
.err{background:rgba(224,60,49,.1);border:1px solid rgba(224,60,49,.3);color:var(--red);padding:9px 12px;border-radius:var(--r2);font-size:13px;margin-bottom:12px}
.ok{background:rgba(39,174,96,.1);border:1px solid rgba(39,174,96,.3);color:var(--green);padding:9px 12px;border-radius:var(--r2);font-size:13px;margin-bottom:12px}

/* ─── Buttons ─── */
.btn{padding:9px 16px;border-radius:var(--r2);font-weight:700;font-size:13px;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bp{background:var(--acc);color:#fff}.bp:hover{background:var(--acc2)}
.bs{background:var(--bg3);color:var(--txt);border:1px solid var(--bdr)}.bs:hover{border-color:var(--acc);color:var(--acc)}
.bd{background:rgba(224,60,49,.12);color:var(--red);border:1px solid rgba(224,60,49,.25)}.bd:hover{background:rgba(224,60,49,.2)}
.bg2{background:rgba(39,174,96,.12);color:var(--green);border:1px solid rgba(39,174,96,.25)}.bg2:hover{background:rgba(39,174,96,.22)}
.bsm{padding:5px 11px;font-size:12px}
.bxs{padding:3px 8px;font-size:11px;border-radius:4px}
.bfull{width:100%;justify-content:center;padding:11px}
.bload{opacity:.6;pointer-events:none}

/* ─── Main Layout ─── */
#screen-app{display:flex;min-height:100vh}
.sb{width:220px;min-width:220px;background:var(--card);border-right:1px solid var(--bdr);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s}
.sb-logo{padding:18px 14px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:9px}
.sb-li{width:32px;height:32px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:13px}
.sb-lt{font-size:14px;font-weight:800}
.sb-lv{font-size:10px;color:var(--muted)}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.sb-sec{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 8px 3px}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;transition:all .15s;margin-bottom:1px;border:1px solid transparent}
.ni:hover{background:var(--bg3);color:var(--txt)}
.ni.on{background:rgba(232,144,10,.12);color:var(--acc);border-color:rgba(232,144,10,.2)}
.ni-ic{font-size:16px;width:20px;text-align:center}
.nbadge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;min-width:18px;text-align:center}
.sb-foot{padding:10px 8px;border-top:1px solid var(--bdr)}
.u-row{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px}
.u-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--pur));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.u-nm{font-weight:700;font-size:13px}
.u-rl{font-size:11px;color:var(--muted)}
.sb-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99}
.sb-ov.on{display:block}
.mc{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.tb{background:var(--card);border-bottom:1px solid var(--bdr);padding:11px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.tb-t{font-size:16px;font-weight:800;flex:1}
.tb-a{display:flex;gap:7px;align-items:center}
.pc{padding:18px;flex:1}
.hmbg{display:none;background:none;border:1px solid var(--bdr);border-radius:6px;padding:5px 7px;color:var(--txt);font-size:17px}

/* ─── Cards ─── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat-c{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;cursor:pointer;transition:border-color .15s}
.stat-c:hover{border-color:var(--acc)}
.stat-n{font-size:26px;font-weight:800;line-height:1}
.stat-l{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}

.ord-c{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.ord-c:hover{border-color:var(--acc);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.ord-trk{font-size:12px;font-weight:700;color:var(--acc);font-family:'DM Mono',monospace}
.ord-nm{font-size:14px;font-weight:700}
.ord-br{font-size:11px;color:var(--muted);font-weight:600}
.ord-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px;font-size:12px;color:var(--muted);align-items:center}

/* ─── Badges ─── */
.badge{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.bpend{background:rgba(232,144,10,.15);color:var(--acc)}
.bappr{background:rgba(39,174,96,.2);color:#2ecc71}
.bprod{background:rgba(45,125,210,.15);color:var(--blue)}
.bqry{background:rgba(230,126,34,.15);color:var(--yel)}
.bhigh{background:rgba(224,60,49,.15);color:var(--red)}
.bmed{background:rgba(230,126,34,.15);color:var(--yel)}
.bnorm{background:rgba(139,143,168,.12);color:var(--muted)}
.bmfr{background:rgba(142,68,173,.15);color:var(--pur)}
.bven{background:rgba(45,125,210,.15);color:var(--blue)}
.bstk{background:rgba(39,174,96,.15);color:var(--green)}
.rtag{padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;background:rgba(232,144,10,.15);color:var(--acc);text-transform:uppercase;letter-spacing:.4px}

/* ─── Tabs ─── */
.tabs{display:flex;border-bottom:1px solid var(--bdr);margin-bottom:14px}
.tab{padding:8px 14px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}

/* ─── Chips ─── */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--bdr);color:var(--muted);transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:rgba(232,144,10,.15);border-color:rgba(232,144,10,.3);color:var(--acc)}

/* ─── Toolbar ─── */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.s-wrap{position:relative;flex:1;min-width:180px}
.s-ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
.s-in{width:100%;padding:8px 10px 8px 32px;background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);color:var(--txt)}
.s-in:focus{outline:none;border-color:var(--acc)}
.fsel{padding:8px 10px;background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);color:var(--txt);font-size:13px}
.fsel:focus{outline:none;border-color:var(--acc)}

/* ─── Modal ─── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.modal{background:var(--card);border:1px solid var(--bdr);border-radius:14px;width:100%;max-width:660px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-lg{max-width:840px}
.mh{padding:18px 22px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1}
.mh-t{font-size:16px;font-weight:800}
.mh-s{font-size:11px;color:var(--muted);margin-top:2px}
.mc-x{background:var(--bg3);border:1px solid var(--bdr);color:var(--muted);width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;flex-shrink:0}
.mc-x:hover{color:var(--txt)}
.mb{padding:18px 22px}
.mf{padding:14px 22px;border-top:1px solid var(--bdr);display:flex;gap:8px;justify-content:flex-end}

/* ─── Product card ─── */
.p-card{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:13px;margin-bottom:9px}
.p-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.p-nm{font-size:13px;font-weight:700}
.p-mt{font-size:11px;color:var(--muted);margin-top:2px}
.p-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.prog-w{background:var(--bg2);border-radius:4px;height:5px;overflow:hidden;margin-top:5px}
.prog-b{height:100%;border-radius:4px;background:var(--acc);transition:width .4s}

/* ─── Detail grid ─── */
.dg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.di{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);padding:9px 11px}
.di-l{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:2px}
.di-v{font-size:13px;font-weight:600}
.sec-t{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 9px;display:flex;align-items:center;gap:6px}
.sec-t:first-child{margin-top:0}

/* ─── Task card ─── */
.tk-c{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:13px 15px;margin-bottom:8px}
.tk-d{font-size:13px;font-weight:600;margin-bottom:7px;line-height:1.4}
.tk-m{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.tk-note{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);padding:7px 11px;font-size:12px;color:var(--muted);margin-top:7px}

/* ─── User card ─── */
.uc{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.uc-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--pur));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.uc-i{flex:1}
.uc-nm{font-size:13px;font-weight:700}
.uc-mt{font-size:11px;color:var(--muted);margin-top:1px}
.uc-acts{display:flex;gap:5px;flex-wrap:wrap}

/* ─── Product form ─── */
.pf-item{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:13px;margin-bottom:9px}
.pf-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ─── Image thumbs ─── */
.img-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.imt{width:58px;height:58px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.imt:hover{border-color:var(--acc)}

/* ─── Image viewer ─── */
#iv-ov{position:fixed;inset:0;background:#000;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center}
#iv-img{max-width:100%;max-height:calc(100vh - 80px);object-fit:contain}
.iv-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(#000b,transparent)}
.iv-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:none;color:#fff;width:42px;height:42px;border-radius:50%;font-size:22px;cursor:pointer}
.iv-nav:hover{background:rgba(255,255,255,.2)}

/* ─── Empty/Loading ─── */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty-ic{font-size:44px;opacity:.35;margin-bottom:10px}
.empty-t{font-size:14px;font-weight:600}
.empty-s{font-size:12px;margin-top:3px}
.ld{display:flex;align-items:center;justify-content:center;height:180px;gap:9px;color:var(--muted)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── Toast ─── */
#toasts{position:fixed;bottom:22px;right:18px;z-index:900;display:flex;flex-direction:column;gap:7px}
.toast{background:var(--card);border:1px solid var(--bdr);border-radius:9px;padding:10px 14px;min-width:220px;max-width:340px;box-shadow:var(--shadow);display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;animation:tin .25s ease}
.toks{border-left:3px solid var(--green)}.toke{border-left:3px solid var(--red)}.toki{border-left:3px solid var(--acc)}
@keyframes tin{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ─── Misc ─── */
.qbox{background:rgba(230,126,34,.08);border:1px solid rgba(230,126,34,.25);border-radius:7px;padding:10px;font-size:12px;color:var(--yel);margin-top:8px}
.info-box{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}

/* ─── Expandable Stats ─── */
.xstat{border-radius:var(--r);padding:12px;cursor:pointer;transition:all .15s;border:1px solid transparent;flex:1}
.xstat:hover{border-color:var(--acc)}
.xstat.open{border-width:2px}
.xstat-n{font-size:24px;font-weight:900;line-height:1}
.xstat-l{font-size:10px;font-weight:600;margin-top:3px}
.xstat-exp{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:10px;margin-top:8px;max-height:240px;overflow-y:auto}
.xstat-row{padding:7px 0;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;font-size:12px}
.xstat-row:last-child{border-bottom:none}

/* ─── Status Overview Expandable ─── */
.sto-row{display:flex;align-items:center;gap:7px;padding:6px 0;cursor:pointer;transition:background .1s;border-radius:4px}
.sto-row:hover{background:rgba(232,144,10,.05)}
.sto-bar{height:4px;border-radius:2px;flex:1}
.sto-exp{margin-left:26px;margin-top:4px;margin-bottom:8px;border:1px solid var(--bdr);border-radius:8px;background:var(--bg3);max-height:200px;overflow-y:auto}
.sto-exp-row{padding:6px 10px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;font-size:11px}
.sto-exp-row:last-child{border-bottom:none}

/* ─── Calendar ─── */
.cal-hd{display:flex;align-items:center;gap:10px;padding:10px 0;margin-bottom:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px}
.cal-dh{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px}
.cal-day{text-align:center;padding:6px 2px;border-radius:6px;cursor:pointer;transition:all .12s;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px}
.cal-day:hover{background:rgba(232,144,10,.1)}
.cal-day.today{border:1.5px solid var(--blue);background:rgba(45,125,210,.1)}
.cal-day.sel{background:rgba(232,144,10,.2);border:1.5px solid var(--acc)}
.cal-day.past{opacity:.35}
.cal-dot{width:6px;height:6px;border-radius:50%;margin-top:2px}
.cal-legend{display:flex;gap:12px;justify-content:flex-end;font-size:10px;color:var(--muted);align-items:center;margin-bottom:8px}
.cal-leg-d{width:8px;height:8px;border-radius:50%;display:inline-block}
.cal-panel{border-top:1px solid var(--bdr);padding-top:10px;min-height:120px}

/* ─── Calculator ─── */
.calc-tabs{display:flex;border-bottom:1px solid var(--bdr);margin-bottom:14px}
.calc-tab{flex:1;text-align:center;padding:10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.calc-tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.calc-card{border:1px solid var(--bdr);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:border-color .15s}
.calc-card.active{border-color:var(--acc);background:rgba(232,144,10,.05)}
.calc-ico{width:50px;text-align:center}
.calc-ico span{font-size:26px}
.calc-abbr{display:inline-block;padding:2px 8px;border-radius:5px;font-size:12px;font-weight:800;margin-top:4px}
.calc-inp{flex:1}
.calc-inp label{font-size:12px;color:var(--muted);font-weight:600}
.calc-inp input{width:100%;background:transparent;border:none;outline:none;font-size:24px;font-weight:800;color:var(--txt);padding:2px 0;font-family:inherit}
.calc-inp input::placeholder{color:var(--muted);opacity:.2;font-weight:200}
.calc-ref{background:rgba(232,144,10,.06);border:1px solid rgba(232,144,10,.2);border-radius:10px;padding:12px;margin-top:12px}
.calc-ref-t{color:var(--acc);font-weight:800;font-size:12px;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.calc-ref li{font-size:12px;margin-bottom:5px;color:var(--muted)}
.calc-ref li strong{color:var(--txt)}

/* ─── Enquiry ─── */
.enq-pipe{display:flex;align-items:center;gap:0;margin:8px 0}
.enq-dot{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;color:#fff;flex-shrink:0;transition:all .15s}
.enq-dot.done{background:var(--green)}
.enq-dot.cur{width:18px;height:18px}
.enq-line{flex:1;height:2px}
.enq-card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px;margin-bottom:9px;cursor:pointer;transition:all .15s}
.enq-card:hover{border-color:var(--acc);transform:translateY(-1px)}
.enq-stchip{padding:3px 8px;border-radius:7px;font-size:10px;font-weight:700}
.enq-timeline{margin-top:8px}
.enq-tl-item{display:flex;gap:8px;margin-bottom:0}
.enq-tl-dot{width:30px;display:flex;flex-direction:column;align-items:center}
.enq-tl-circle{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.enq-tl-line{width:2px;flex:1;min-height:12px}

/* ─── Profile ─── */
.prof-av{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--pur));display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;font-weight:800;margin:0 auto 12px}
.prof-card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:16px;margin-bottom:12px}
.prof-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bdr);font-size:13px}
.prof-row:last-child{border-bottom:none}
.prof-row span:first-child{color:var(--muted);font-size:12px}
.prof-row span:last-child{font-weight:600}

/* ─── Individual Reports ─── */
.rpt-chip{padding:4px 10px;border-radius:14px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid rgba(232,144,10,.3);transition:all .15s}
.rpt-chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.rpt-chip:not(.on){color:var(--acc);background:rgba(232,144,10,.08)}
.rpt-person{border:1px solid var(--bdr);border-radius:8px;margin-bottom:6px;overflow:hidden;transition:border-color .15s}
.rpt-person.open{border-color:rgba(232,144,10,.4)}
.rpt-ph{padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.rpt-pb{padding:8px;border-top:1px solid var(--bdr)}
.rpt-pr{padding:5px 8px;border-radius:6px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;font-size:11px}

/* ─── Track Widget ─── */
.trk-prod{border-radius:8px;padding:8px;margin-bottom:6px}
.trk-prod-bar{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;margin-top:4px}

/* ─── Responsive ─── */
@media(max-width:768px){
  .sb{transform:translateX(-100%)}.sb.on{transform:translateX(0)}
  .mc{margin-left:0}.hmbg{display:flex}
  .dg,.g2{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
  .ov{align-items:flex-end;padding:0}
  .modal{border-radius:14px 14px 0 0;max-height:95vh}
}
</style>
</head>

<script>
'use strict';
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// STATE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let DB = null;
let ME = null;
let ORDERS = [];
let USERS = [];
let TASKS = [];
let PAGE = 'dashboard';
let _bhTab = 'pending';
let _ordSearch = '', _ordStatus = '', _ordPri = '', _ordSort = 'newest';
let _usrSearch = '', _usrFilter = 'pending';
let _tskFilter = 'pending';
let _newProds = [];
let _ivUrls = [], _ivIdx = 0;
let _imgStore = {}; // global image store for safe onclick references
let _imgStoreId = 0;
let _expandedStat = ''; // 'active','delivered','high' or ''
let _expandedStatus = ''; // status label or ''
let _rptPeriod = 'week'; // 'week','month'
let _rptExpanded = ''; // expanded person key
let _calMonth = new Date().getMonth();
let _calYear = new Date().getFullYear();
let _calSelDay = null;
let _calcTab = 'length'; // 'length','area','weight'
let _enqSearch = '', _enqStatusFilter = '';
let ENQUIRIES = [];
let _trkCode = '', _trkResult = null, _trkNotFound = false;

const ROLES = {sales:'Sales',branch_head:'Branch Head',factory_head:'Factory Head',carpenter:'Carpenter',quality_check:'Quality Check',driver:'Delivery',owner:'Owner'};
const BRANCHES = ['Steel Main Branch','Vengamedu Branch','Chennimalai Branch','Factory'];
const PRIS = ['High','Medium','Normal'];
const MFR = ['Pending Approval','Query Raised','Approved','Sent to Factory','Assigned to Carpenter','In Production','Quality Check','Ready for Dispatch','Out for Delivery','Delivered'];
const VEN = ['Pending Approval','Query Raised','Approved','Order Placed','Product Received','Out for Delivery','Delivered'];
const STK = ['Pending Approval','Query Raised','Approved','Out for Delivery','Delivered'];

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INIT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function mkDB(url, key){
  DB = window.supabase.createClient(url, key, {
    auth:{persistSession:false}
  });
}




// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SCREEN HELPERS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function hide(id){g(id).classList.add('dn')}
function show(id){g(id).classList.remove('dn')}
function g(id){return document.getElementById(id)}
function ls(k,v){try{localStorage.setItem(k,v)}catch(_){}}
function gl(k){try{return localStorage.getItem(k)||''}catch(_){return''}}
function err(m){return`<div class="err">${m}</div>`}
function ok(m){return`<div class="ok">${m}</div>`}

function showLogin(){
  show('screen-login');
}
function showApp(user){
  ME = user;
  hide('screen-login'); show('screen-app');
  g('u-av').textContent=(user.name||'?')[0].toUpperCase();
  g('u-nm').textContent=user.name;
  g('u-rl').textContent=ROLES[user.role]||user.role;
  if(user.role==='owner') show('ni-users');
  // Show calendar for owner, branch_head, factory_head, driver
  if(['owner','branch_head','factory_head','driver'].includes(user.role)) show('ni-calendar');
  // Show calculator for carpenter
  if(user.role==='carpenter') show('ni-calculator');
  bootData().then(()=>{
    // Force PIN change if not yet changed
    if(!ME.pin_changed){
      go('password');
      renderPass(true);
    }
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// LOGIN
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function switchLTab(t){
  ['staff','owner','track'].forEach(x=>{
    g('lt-'+x).classList.toggle('on',x===t);
    g('lp-'+x).classList.toggle('dn',x!==t);
  });
}

async function onRolePick(role){
  const wrap=g('l-user-wrap'), sel=g('l-user');
  if(!role){hide('l-user-wrap');return}
  show('l-user-wrap');
  sel.innerHTML='<option>Loading…</option>';
  try{
    const {data,error}=await DB.from('users').select('id,name').eq('role',role).eq('approved',true).eq('status','active').order('name');
    if(error) throw error;
    if(!data||!data.length){sel.innerHTML='<option value="">No active users</option>';return}
    sel.innerHTML='<option value="">— Select Name —</option>'+(data.map(u=>`<option value="${u.id}">${u.name}</option>`).join(''));
  }catch(e){sel.innerHTML='<option>Error loading</option>'}
}

async function doLogin(){
  const role=g('l-role').value, uid=g('l-user').value, pass=g('l-pass').value;
  const el=g('l-err');
  if(!role){el.innerHTML=err('Select role');return}
  if(!uid){el.innerHTML=err('Select your name');return}
  if(!pass){el.innerHTML=err('Enter PIN');return}
  const btn=g('l-btn'); btn.classList.add('bload'); btn.textContent='Signing in…';
  el.innerHTML='';
  try{
    const {data,error}=await DB.from('users').select('*').eq('id',uid).eq('role',role).eq('password',pass).maybeSingle();
    if(error) throw error;
    if(!data){el.innerHTML=err('Incorrect PIN');return}
    if(!data.approved||data.status==='pending'){el.innerHTML=err('Account pending owner approval');return}
    if(data.status==='suspended'){el.innerHTML=err('Account suspended. Contact owner.');return}
    sessionStorage.setItem('me',JSON.stringify(data));
    showApp(data);
  }catch(e){el.innerHTML=err(e.message)}
  finally{btn.classList.remove('bload');btn.textContent='Sign In'}
}

async function doOwnerLogin(){
  const pass=g('lo-pass').value;
  const el=g('lo-err');
  if(!pass){el.innerHTML=err('Enter PIN');return}
  el.innerHTML='';
  try{
    let {data}=await DB.from('users').select('*').eq('id','owner-1').eq('password',pass).maybeSingle();
    if(!data&&pass==='owner123'){
      const rec={id:'owner-1',name:'Owner',role:'owner',branch:'Steel Main Branch',password:'owner123',email:'owner@indira.com',phone:'9999999999',approved:true,status:'active'};
      await DB.from('users').insert(rec);
      data=rec;
    }
    if(!data){el.innerHTML=err('Incorrect owner PIN');return}
    sessionStorage.setItem('me',JSON.stringify(data));
    showApp(data);
  }catch(e){el.innerHTML=err(e.message)}
}

async function doTrack(){
  const code=g('track-inp').value.trim();
  const out=g('track-out');
  if(!code)return;
  out.innerHTML='<div class="ld"><div class="spin"></div></div>';
  try{
    const {data,error}=await DB.from('orders').select('*').ilike('tracking_code',code).maybeSingle();
    if(error) throw error;
    if(!data){out.innerHTML=err('No order found with this tracking code');return}
    const o=data, prods=o.products||[];
    out.innerHTML=`<div class="info-box">
      <div style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        <span class="ord-trk">${o.tracking_code}</span>
        <span class="badge ${badgeSt(o.status)}">${o.status}</span>
      </div>
      <div style="font-size:13px;font-weight:700;margin-bottom:6px">${o.customer_name}</div>
      <div style="font-size:12px;color:var(--muted)">${o.branch_name} · ${prods.length} product(s)</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">📅 Delivery: ${fmtDate(o.delivery_date)}</div>
    </div>`;
  }catch(e){out.innerHTML=err(e.message)}
}

// Register
function openRegModal(){show('reg-ov')}
function closeReg(){hide('reg-ov');g('reg-err').innerHTML='';g('reg-ok').innerHTML=''}
async function doRegister(){
  const name=g('reg-name').value.trim(), pass=g('reg-pass').value.trim();
  const el=g('reg-err'), ok2=g('reg-ok');
  if(!name||!pass){el.innerHTML=err('Name and PIN required');return}
  if(!/^\d{4,}$/.test(pass)){el.innerHTML=err('PIN must be 4+ digits, numbers only');return}
  try{
    await DB.from('users').insert({id:'u'+Date.now(),name,role:g('reg-role').value,branch:g('reg-branch').value,email:g('reg-email').value,phone:g('reg-phone').value,password:pass,approved:false,status:'pending',pin_changed:true});
    ok2.innerHTML=ok('Registered! Awaiting owner approval.');
    setTimeout(closeReg,2000);
  }catch(e){el.innerHTML=err(e.message)}
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// DATA
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function bootData(){
  await loadAll();
  // Realtime
  DB.channel('ch-ord').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrders().then(()=>{refresh();badges()})).subscribe();
  DB.channel('ch-usr').on('postgres_changes',{event:'*',schema:'public',table:'users'},()=>loadUsers().then(()=>{refresh();badges()})).subscribe();
  DB.channel('ch-tsk').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>loadTasks().then(()=>{refresh();badges()})).subscribe();
  DB.channel('ch-enq').on('postgres_changes',{event:'*',schema:'public',table:'customer_enquiries'},()=>loadEnquiries().then(()=>{if(PAGE==='enquiries')renderEnquiries()})).subscribe();
  go('dashboard');
}
async function loadAll(){ await Promise.all([loadOrders(),loadUsers(),loadTasks(),loadEnquiries()]); badges(); }
async function loadOrders(){
  try{const{data}=await DB.from('orders').select('*').order('created_at',{ascending:false}); ORDERS=data||[]}catch(_){ORDERS=[]}
}
async function loadUsers(){
  try{const{data}=await DB.from('users').select('*').order('name'); USERS=data||[]}catch(_){USERS=[]}
}
async function loadTasks(){
  try{
    let q=DB.from('tasks').select('*').order('created_at',{ascending:false});
    if(ME.role!=='owner') q=q.eq('assigned_to_id',ME.id);
    const{data}=await q; TASKS=data||[];
  }catch(_){TASKS=[]}
}
async function loadEnquiries(){
  try{
    const{data}=await DB.from('customer_enquiries').select('*').order('created_at',{ascending:false});
    ENQUIRIES=data||[];
  }catch(_){ENQUIRIES=[]}
}

function badges(){
  const vis=visOrders();
  const pendOrd=vis.filter(o=>(o.products||[]).some(p=>['Pending Approval','Query Raised'].includes(p.product_status))).length;
  const pendTsk=TASKS.filter(t=>t.status==='pending'||t.status==='doubt').length;
  const pendUsr=USERS.filter(u=>!u.approved||u.status==='pending').length;
  setBadge('badge-ord',pendOrd);
  setBadge('badge-tsk',pendTsk);
  setBadge('badge-usr',pendUsr);
}
function setBadge(id,n){const el=g(id);if(!el)return;el.textContent=n;el.classList.toggle('dn',n===0)}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// NAVIGATION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const PAGE_TITLES={dashboard:'Dashboard',orders:'Orders',tasks:'Tasks',users:'Users',password:'Change PIN',enquiries:'Customer Enquiries',calendar:'Delivery Calendar',calculator:'Unit Calculator',profile:'Profile'};
function go(p){
  // Block navigation if PIN change is forced
  if(!ME.pin_changed && p!=='password'){
    go('password'); renderPass(true); return;
  }
  PAGE=p;
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('on'));
  const ni=g('ni-'+p); if(ni) ni.classList.add('on');
  g('tb-t').textContent=PAGE_TITLES[p]||p;
  g('tb-a').innerHTML='';
  closeSb();
  render();
}
function refresh(){if(g('pg'))render()}
function toggleSb(){g('sb').classList.toggle('on');g('sb-ov').classList.toggle('on')}
function closeSb(){g('sb').classList.remove('on');g('sb-ov').classList.remove('on')}
function render(){
  switch(PAGE){
    case'dashboard':renderDash();break;
    case'orders':renderOrders();break;
    case'tasks':renderTasks();break;
    case'users':renderUsers();break;
    case'password':renderPass();break;
    case'enquiries':renderEnquiries();break;
    case'calendar':renderCalendar();break;
    case'calculator':renderCalculator();break;
    case'profile':renderProfile();break;
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// DASHBOARD
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderDash(){
  const vis=visOrders();
  const active=vis.filter(o=>!['Delivered','Closed'].includes(o.status));
  const deliv=vis.filter(o=>o.status==='Delivered');
  const high=vis.filter(o=>o.priority==='High'&&!['Delivered','Closed'].includes(o.status));
  const pend=vis.filter(o=>(o.products||[]).some(p=>['Pending Approval','Query Raised'].includes(p.product_status)));
  const pendUsr=USERS.filter(u=>!u.approved||u.status==='pending');
  // Status breakdown
  const sc={};vis.forEach(o=>{sc[o.status]=(sc[o.status]||0)+1});
  const sorted=Object.entries(sc).sort((a,b)=>b[1]-a[1]);

  // Expandable stat boxes
  function xstatBox(key,n,lbl,col,icon){
    const isOpen=_expandedStat===key;
    return`<div class="xstat${isOpen?' open':''}" style="background:rgba(${col},.08);border-color:${isOpen?`rgba(${col},.5)`:'transparent'}" onclick="_expandedStat=_expandedStat==='${key}'?'':'${key}';renderDash()">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:18px">${icon}</span>
        <div style="flex:1"><div class="xstat-n" style="color:rgb(${col})">${n}</div><div class="xstat-l" style="color:rgba(${col},.7)">${lbl}</div></div>
        <span style="font-size:12px;color:rgba(${col},.5)">${isOpen?'▲':'▼'}</span>
      </div>
    </div>`;
  }

  function xstatExpanded(orders,title){
    if(!orders.length) return`<div class="xstat-exp"><div style="padding:10px;color:var(--muted);font-size:12px">No orders</div></div>`;
    return`<div class="xstat-exp"><div style="padding:6px 10px;font-weight:700;font-size:12px;border-bottom:1px solid var(--bdr)">${title}</div>${orders.map(o=>`
      <div class="xstat-row" onclick="openOrd('${o.order_id}')" style="cursor:pointer;padding:7px 10px">
        <div><div style="font-weight:600;font-size:12px">${o.customer_name}</div><div style="font-size:10px;color:var(--muted)">#${o.tracking_code} · ${o.branch_name}</div></div>
        <div style="text-align:right"><span class="badge ${badgeSt(o.status)}" style="font-size:9px">${o.status}</span><br><span class="badge ${priB(o.priority)}" style="font-size:9px;margin-top:2px">${o.priority}</span></div>
      </div>`).join('')}</div>`;
  }

  // Expandable status overview
  function stoRows(){
    if(!sorted.length) return'<div style="color:var(--muted);font-size:12px;padding:8px">No orders yet</div>';
    return sorted.map(([s,c])=>{
      const frac=vis.length?(c/vis.length):0;
      const col=stColor(s);
      const isOpen=_expandedStatus===s;
      const matchOrders=vis.filter(o=>o.status===s);
      return`<div>
        <div class="sto-row" onclick="_expandedStatus=_expandedStatus==='${s}'?'':'${s}';renderDash()">
          <div style="width:7px;height:7px;border-radius:50%;background:${col};flex-shrink:0"></div>
          <span style="flex:1;font-size:11px;color:var(--muted)">${s}</span>
          <span style="font-weight:700;font-size:12px;color:${col}">${c}</span>
          <span style="font-size:11px;color:${col};opacity:.6;margin-left:4px">${isOpen?'▲':'▼'}</span>
        </div>
        <div style="margin-left:13px;margin-bottom:2px"><div style="background:rgba(${hexToRgb(col)},.15);border-radius:2px;height:4px;overflow:hidden"><div style="width:${frac*100}%;height:100%;background:${col};border-radius:2px"></div></div></div>
        ${isOpen?`<div class="sto-exp">${matchOrders.map(o=>`<div class="sto-exp-row" onclick="openOrd('${o.order_id}')" style="cursor:pointer"><div><span style="font-weight:600">${o.customer_name}</span><br><span style="color:var(--muted);font-size:10px">#${o.tracking_code} · ${o.branch_name}</span></div><span class="badge ${priB(o.priority)}" style="font-size:9px">${o.priority}</span></div>`).join('')}</div>`:''}
      </div>`;
    }).join('');
  }

  // Branch breakdown (owner/factory_head)
  function branchSection(){
    if(!['owner','factory_head'].includes(ME.role)) return'';
    return`<div class="sec-t">🏬 Branches</div>${BRANCHES.filter(b=>b!=='Factory').map(b=>{
      const bt=ORDERS.filter(o=>o.branch_name===b).length;
      const bp=ORDERS.filter(o=>o.branch_name===b&&!['Delivered','Closed'].includes(o.status)).length;
      return`<div style="background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px">
        <span style="font-size:16px">🏬</span><span style="flex:1;font-weight:600;font-size:13px">${b}</span>
        <span style="color:var(--yel);font-size:11px">${bp} pending</span>
        <span style="color:var(--muted);font-size:11px">${bt} total</span>
      </div>`;
    }).join('')}`;
  }

  // Carpenter workload (owner/factory_head)
  function carpenterSection(){
    if(!['owner','factory_head'].includes(ME.role)) return'';
    const carps=USERS.filter(u=>u.role==='carpenter'&&u.approved);
    if(!carps.length) return'';
    return`<div class="sec-t" style="margin-top:14px">🔨 Carpenter Workload</div>${carps.map(c=>{
      const ca=ORDERS.filter(o=>o.factory_assigned_to===c.name&&!['Delivered','Closed'].includes(o.status)).length;
      const ch=ORDERS.filter(o=>o.factory_assigned_to===c.name&&o.priority==='High'&&!['Delivered','Closed'].includes(o.status)).length;
      return`<div style="background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px">
        <div class="u-av" style="width:32px;height:32px;font-size:11px">${(c.name||'?')[0]}</div>
        <span style="flex:1;font-weight:600;font-size:13px">${c.name}</span>
        ${ch>0?`<span style="color:var(--red);font-size:12px;font-weight:700">🔴 ${ch}</span>`:''}
        <span style="color:var(--blue);font-size:12px;font-weight:700">${ca} active</span>
      </div>`;
    }).join('')}`;
  }

  // Track order widget
  function trackWidget(){
    let resultHtml='';
    if(_trkNotFound) resultHtml=`<div style="margin-top:10px;background:rgba(224,60,49,.08);border:1px solid rgba(224,60,49,.25);border-radius:8px;padding:10px;display:flex;gap:6px;align-items:center"><span>❌</span><span style="color:var(--red);font-weight:600">Order not found.</span></div>`;
    if(_trkResult){
      const o=_trkResult, prods=o.products||[];
      const total=prods.length, delivered=prods.filter(p=>p.product_status==='Delivered').length;
      resultHtml=`<div style="margin-top:12px;border-top:1px solid var(--bdr);padding-top:12px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
          <div><div style="font-weight:800;font-size:15px">${o.customer_name}</div><div style="font-size:11px;color:var(--muted)">#${o.tracking_code}</div></div>
          <div style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;background:${delivered===total?'rgba(39,174,96,.12)':'rgba(45,125,210,.1)'};color:${delivered===total?'var(--green)':'var(--blue)'}">${delivered===total?'✅ All Done':`${delivered}/${total} Done`}</div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px">🏬 ${o.branch_name} · 📅 Delivery: ${fmtDate(o.delivery_date)}</div>
        ${prods.map((p,i)=>{
          const sc=trkStatusColor(p.product_status);
          const ti=p.product_type==='manufacture'?'🏭':p.product_type==='vendor'?'🛒':'🏬';
          const tl=p.product_type==='manufacture'?'Manufacture':p.product_type==='vendor'?'Vendor':'Stock';
          const hint=trkHint(p);
          return`<div class="trk-prod" style="background:rgba(${hexToRgb(sc)},.05);border:1px solid rgba(${hexToRgb(sc)},.2)">
            <div style="display:flex;align-items:center;gap:6px;padding:2px 0">
              <div style="width:3px;height:24px;background:${sc};border-radius:2px"></div>
              <div style="flex:1"><div style="font-size:9px;color:var(--muted)">${ti} Product ${i+1} · ${tl}</div><div style="font-size:12px;font-weight:700">${p.product_name||'Item'}</div></div>
              <span style="font-size:10px;color:var(--muted)">×${p.quantity||1}</span>
            </div>
            <div class="trk-prod-bar" style="background:rgba(${hexToRgb(sc)},.08);border:1px solid rgba(${hexToRgb(sc)},.15)">
              <div style="width:6px;height:6px;border-radius:50%;background:${sc}"></div>
              <div style="flex:1"><div style="color:${sc};font-weight:800;font-size:11px">${p.product_status}</div><div style="color:var(--muted);font-size:9px">${hint}</div></div>
              ${p.product_status==='Delivered'?'<span style="font-size:14px">✅</span>':''}
            </div>
          </div>`;
        }).join('')}
      </div>`;
    }
    return`<div class="sec-t" style="margin-top:14px;display:flex;justify-content:space-between;align-items:center">
        <span>🔍 Track Order</span>
        ${_trkResult||_trkNotFound?`<span style="font-size:11px;color:var(--muted);cursor:pointer" onclick="_trkResult=null;_trkNotFound=false;_trkCode='';renderDash()">Clear</span>`:''}
      </div>
      <div style="background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:12px">
        <div style="display:flex;gap:8px">
          <input class="fi" style="flex:1" placeholder="Enter Order Copy No. (e.g. OC1001)" value="${_trkCode}" oninput="_trkCode=this.value" onkeydown="if(event.key==='Enter')dashTrack()">
          <button class="btn bp" onclick="dashTrack()">Track</button>
        </div>
        ${resultHtml}
      </div>`;
  }

  // Individual reports (owner only)
  function reportsSection(){
    if(ME.role!=='owner') return'';
    const now=new Date();
    const periodStart=_rptPeriod==='week'?new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay()):new Date(now.getFullYear(),now.getMonth(),1);
    const periodOrders=ORDERS.filter(o=>{try{return new Date(o.created_at)>=periodStart}catch(_){return false}});
    const sales=USERS.filter(u=>u.role==='sales'&&u.approved);
    const bhs=USERS.filter(u=>u.role==='branch_head'&&u.approved);
    const carps=USERS.filter(u=>u.role==='carpenter'&&u.approved);

    function personCard(key,name,color,stats,orders){
      const isOpen=_rptExpanded===key;
      return`<div class="rpt-person${isOpen?' open':''}">
        <div class="rpt-ph" onclick="_rptExpanded=_rptExpanded==='${key}'?'':'${key}';renderDash()">
          <div><div style="font-weight:700;font-size:13px">${name}</div><div style="color:rgb(${color});font-size:11px;font-weight:600">${stats}</div></div>
          <span style="font-size:14px;color:rgb(${color})">${isOpen?'▲':'▼'}</span>
        </div>
        ${isOpen&&orders.length?`<div class="rpt-pb">${orders.map(o=>`<div class="rpt-pr" style="background:rgba(${color},.04)"><div><span style="font-weight:600;font-size:11px">${o.customer_name}</span><br><span style="color:var(--muted);font-size:10px">#${o.tracking_code} · ₹${Number(o.total_order_value||0).toLocaleString('en-IN')}</span></div><span class="badge ${badgeSt(o.status)}" style="font-size:9px">${o.status}</span></div>`).join('')}</div>`:''}
      </div>`;
    }

    return`<div style="margin-top:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-weight:800;font-size:14px">📊 Individual Reports</span>
        <div style="display:flex;gap:6px">
          <span class="rpt-chip${_rptPeriod==='week'?' on':''}" onclick="_rptPeriod='week';renderDash()">Week</span>
          <span class="rpt-chip${_rptPeriod==='month'?' on':''}" onclick="_rptPeriod='month';renderDash()">Month</span>
        </div>
      </div>
      ${sales.length?`<div style="display:flex;align-items:center;gap:5px;margin-bottom:6px;font-size:12px;color:var(--green);font-weight:700">🛒 Sales</div>
        ${sales.map(u=>{
          const my=periodOrders.filter(o=>o.sales_person===u.name);
          const tv=my.reduce((s,o)=>s+(o.total_order_value||0),0);
          return personCard('sales_'+u.id,u.name,'39,174,96',`${my.length} orders · ₹${tv.toLocaleString('en-IN')}`,my);
        }).join('')}`:''}
      ${bhs.length?`<div style="display:flex;align-items:center;gap:5px;margin:10px 0 6px;font-size:12px;color:var(--blue);font-weight:700">🏬 Branch Heads</div>
        ${bhs.map(u=>{
          const my=periodOrders.filter(o=>o.branch_name===u.branch);
          const appr=my.filter(o=>o.branch_approved==='yes').length;
          return personCard('bh_'+u.id,`${u.name} (${u.branch})`,'45,125,210',`${my.length} orders · ${appr} approved`,my);
        }).join('')}`:''}
      ${carps.length?`<div style="display:flex;align-items:center;gap:5px;margin:10px 0 6px;font-size:12px;color:var(--pur);font-weight:700">🔨 Carpenters</div>
        ${carps.map(u=>{
          const myProds=[];
          periodOrders.forEach(o=>(o.products||[]).forEach(p=>{
            if(p.product_type==='manufacture'&&p.assigned_to===u.name) myProds.push({...p,_order:o});
          }));
          const comp=myProds.filter(p=>['Quality Check','Ready for Dispatch','Out for Delivery','Delivered'].includes(p.product_status)).length;
          return personCard('carp_'+u.id,u.name,'142,68,173',`${myProds.length} products · ${comp} completed`,myProds.map(p=>p._order).filter((o,i,a)=>a.findIndex(x=>x.order_id===o.order_id)===i));
        }).join('')}`:''}
    </div>`;
  }

  g('pg').innerHTML=`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px">
      <div>
        <div style="font-size:19px;font-weight:800">${greeting()}, ${(ME.name||'').split(' ')[0]} 👋</div>
        <div style="display:flex;align-items:center;gap:7px;margin-top:4px">
          <span class="rtag">${ROLES[ME.role]||ME.role}</span>
          ${ME.branch?`<span style="font-size:11px;color:var(--muted)">${ME.branch}</span>`:''}
        </div>
      </div>
      ${high.length?`<div style="background:rgba(224,60,49,.1);border:1px solid rgba(224,60,49,.3);border-radius:8px;padding:7px 13px;font-size:12px;color:var(--red);font-weight:700">⚠️ ${high.length} High Priority</div>`:''}
    </div>

    <!-- Expandable Stat Boxes -->
    <div style="display:flex;gap:10px;margin-bottom:10px">
      ${xstatBox('active',active.length,'Active Orders','232,144,10','📦')}
      ${xstatBox('delivered',deliv.length,'Delivered','39,174,96','✅')}
      ${xstatBox('high',high.length,'High Priority','224,60,49','🔴')}
    </div>
    ${_expandedStat==='active'?xstatExpanded(active,'Active Orders'):''}
    ${_expandedStat==='delivered'?xstatExpanded(deliv,'Delivered Orders'):''}
    ${_expandedStat==='high'?xstatExpanded(high,'High Priority Orders'):''}

    <!-- Alert banners -->
    ${ME.role==='owner'&&pendUsr.length?`<div style="background:rgba(230,126,34,.08);border:1px solid rgba(230,126,34,.25);border-radius:8px;padding:9px 13px;margin-bottom:8px;display:flex;gap:8px;align-items:center"><span>⚠️</span><span style="color:var(--yel);font-weight:600;font-size:12px">${pendUsr.length} user${pendUsr.length!==1?'s':''} waiting for approval</span></div>`:''}
    ${['owner','branch_head'].includes(ME.role)&&pend.length?`<div style="background:rgba(45,125,210,.08);border:1px solid rgba(45,125,210,.25);border-radius:8px;padding:9px 13px;margin-bottom:8px;display:flex;gap:8px;align-items:center"><span>📋</span><span style="color:var(--blue);font-weight:600;font-size:12px">${pend.length} order${pend.length!==1?'s':''} awaiting approval</span></div>`:''}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="info-box">
        <div class="sec-t">📈 Status Overview</div>
        ${stoRows()}
      </div>
      <div class="info-box">
        <div class="sec-t">🚀 Recent Orders</div>
        ${vis.slice(0,6).map(o=>`
          <div onclick="openOrd('${o.order_id}')" style="padding:7px 0;border-bottom:1px solid var(--bdr);cursor:pointer;display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-size:11px;color:var(--acc);font-weight:700;font-family:'DM Mono',monospace">${o.tracking_code}</div>
              <div style="font-size:12px;font-weight:600">${o.customer_name}</div>
            </div>
            <span class="badge ${badgeSt(o.status)}" style="font-size:9px">${o.status}</span>
          </div>`).join('')||'<div class="empty"><div class="empty-t">No orders</div></div>'}
      </div>
    </div>

    ${branchSection()}
    ${carpenterSection()}
    ${trackWidget()}
    ${reportsSection()}

    <!-- Recent orders list -->
    <div class="sec-t" style="margin-top:14px">📋 Recent Orders</div>
    ${vis.slice(0,5).map(o=>`<div style="background:var(--card);border:1px solid var(--bdr);border-radius:8px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="openOrd('${o.order_id}')">
      <div><div style="font-weight:600;font-size:13px">${o.customer_name}</div><div style="font-size:11px;color:var(--muted)">#${o.tracking_code} · ${o.branch_name}</div></div>
      <div style="text-align:right"><span class="badge ${badgeSt(o.status)}" style="font-size:9px">${o.status}</span><br><span class="badge ${priB(o.priority)}" style="font-size:9px;margin-top:2px">${o.priority}</span></div>
    </div>`).join('')||'<div class="empty"><div class="empty-t">No orders yet</div></div>'}
  `;
}

// Dashboard track helper
async function dashTrack(){
  if(!_trkCode.trim())return;
  _trkResult=null;_trkNotFound=false;
  // Local search first
  const local=ORDERS.find(o=>o.tracking_code?.toLowerCase()===_trkCode.trim().toLowerCase());
  if(local){_trkResult=local;renderDash();return}
  try{
    const{data}=await DB.from('orders').select('*').ilike('tracking_code',_trkCode.trim()).maybeSingle();
    if(data){_trkResult=data}else{_trkNotFound=true}
  }catch(_){_trkNotFound=true}
  renderDash();
}

function trkStatusColor(s){
  if(s==='Delivered')return'#22C55E';
  if(s==='Out for Delivery'||s==='Product Received')return'#0EA5E9';
  if(s==='Product Ready'||s==='Ready for Dispatch')return'#10B981';
  if(s.includes('Production')||s.includes('Factory')||s==='Order Placed'||s.includes('Assigned')||s.includes('Quality'))return'#3B82F6';
  if(s.includes('Query')||s.includes('Pending'))return'#F59E0B';
  if(s.includes('Approved'))return'#22C55E';
  return'#6B7280';
}

function trkHint(p){
  const t=p.product_type,s=p.product_status;
  if(t==='manufacture'){
    if(s==='Pending Approval')return'Waiting for branch head review';
    if(s==='Query Raised')return'Branch head has a query';
    if(s==='Sent to Factory')return'Sent to factory for production';
    if(s==='Assigned to Carpenter')return'Assigned to carpenter — work starting';
    if(s==='In Production')return'Carpenter is building your product';
    if(s==='Quality Check')return'Quality check in progress';
    if(s==='Product Ready'||s==='Ready for Dispatch')return'Product ready — awaiting dispatch';
    if(s==='Out for Delivery')return'On the way!';
    if(s==='Delivered')return'Delivered successfully ✅';
  }else if(t==='vendor'){
    if(s==='Order Placed')return'Order placed with vendor';
    if(s==='Product Received')return'Product received — ready';
    if(s==='Out for Delivery')return'On the way!';
    if(s==='Delivered')return'Delivered ✅';
  }
  if(s==='Pending Approval')return'Waiting for review';
  if(s==='Out for Delivery')return'On the way!';
  if(s==='Delivered')return'Delivered ✅';
  return s;
}

function hexToRgb(hex){
  if(!hex||hex[0]!=='#')return'128,128,128';
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`${r},${g},${b}`;
}

// Exact port of Flutter filter logic from orders_screen.dart
function visOrders(){
  let o=[...ORDERS];
  switch(ME.role){
    // Sales: only their own orders
    case'sales':
      o=o.filter(x=>x.sales_person===ME.name);
      break;
    // Branch head: branch orders (tab logic applied in renderOrders)
    case'branch_head':
      o=o.filter(x=>x.branch_name===ME.branch);
      break;
    // Factory head: manufacture products in factory pipeline
    case'factory_head':
      o=o.filter(x=>(x.products||[]).some(p=>
        p.product_type==='manufacture'&&
        ['Sent to Factory','Assigned to Carpenter','In Production','Quality Check','Ready for Dispatch'].includes(p.product_status)
      ));
      break;
    // Carpenter: only their assigned products still in active work (not yet at QC or beyond)
    case'carpenter':
      o=o.filter(x=>(x.products||[]).some(p=>
        p.assigned_to===ME.name&&
        p.product_type==='manufacture'&&
        !['Quality Check','Ready for Dispatch','Out for Delivery','Delivered'].includes(p.product_status)
      ));
      o.sort((a,b)=>({High:0,Medium:1,Normal:2}[a.priority]||2)-({High:0,Medium:1,Normal:2}[b.priority]||2));
      break;
    // QC: only orders with a product in Quality Check
    case'quality_check':
      o=o.filter(x=>(x.products||[]).some(p=>p.product_status==='Quality Check'));
      break;
    // Driver: only orders with products Out for Delivery (NOT Ready for Dispatch)
    case'driver':
      o=o.filter(x=>(x.products||[]).some(p=>p.product_status==='Out for Delivery'));
      break;
  }
  return o;
}

function renderOrders(){
  if(['sales','owner'].includes(ME.role))
    g('tb-a').innerHTML=`<button class="btn bp bsm" onclick="openCreateOrd()">+ New Order</button>`;
  else
    g('tb-a').innerHTML='';

  // Branch Head: exact 3-tab layout matching Flutter app
  if(ME.role==='branch_head'){
    const branchOrders=ORDERS.filter(o=>o.branch_name===ME.branch);

    // Tab 1 – Pending: order-level status is waiting/query
    const pendingVis=branchOrders.filter(o=>
      o.status==='Waiting for Branch Approval'||o.status==='Query Raised'
    );

    // Tab 2 – Orders: active, not pending, no product is Ready for Dispatch
    const listVis=branchOrders.filter(o=>
      !['Delivered','Closed','Waiting for Branch Approval','Query Raised'].includes(o.status)&&
      !(o.products||[]).some(p=>p.product_status==='Ready for Dispatch')
    );

    // Tab 3 – Ready: any product is Ready for Dispatch (QC passed)
    const readyVis=branchOrders.filter(o=>
      (o.products||[]).some(p=>p.product_status==='Ready for Dispatch')
    );

    function tabBadge(lbl,cnt,col){
      return `<div class="tab ${_bhTab===lbl?'on':''}" onclick="_bhTab='${lbl}';renderOrders()" style="display:flex;align-items:center;gap:5px">
        ${lbl}
        ${cnt>0?`<span style="background:${col};color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center">${cnt}</span>`:''}
      </div>`;
    }

    let listHtml='';
    if(_bhTab==='Pending'){
      listHtml=pendingVis.length
        ? pendingVis.map(ordCard).join('')
        : emptyState('📋','No pending orders','All orders are approved or in progress');
    } else if(_bhTab==='Orders'){
      listHtml=listVis.length
        ? listVis.map(ordCard).join('')
        : emptyState('📦','No active orders','');
    } else {
      // Ready tab — special QC-passed dispatch cards
      listHtml=readyVis.length
        ? readyVis.map(readyCard).join('')
        : emptyState('🚚','No orders ready for dispatch','Waiting for quality check');
    }

    g('pg').innerHTML=`
      <div class="tabs">
        ${tabBadge('Pending',pendingVis.length,'var(--red)')}
        ${tabBadge('Orders',listVis.length,'var(--blue)')}
        ${tabBadge('Ready',readyVis.length,'var(--green)')}
      </div>
      <div id="ord-list">${listHtml}</div>`;
    return;
  }

  // Driver: special delivery-focused list
  if(ME.role==='driver'){
    const vis=visOrders();
    g('pg').innerHTML=`
      ${vis.length?`<div style="background:rgba(45,125,210,.1);border:1px solid rgba(45,125,210,.25);border-radius:8px;padding:9px 13px;margin-bottom:12px;display:flex;align-items:center;gap:8px">
        <span style="font-size:16px">🚚</span>
        <span style="color:var(--blue);font-weight:700;font-size:13px">${vis.length} delivery order${vis.length===1?'':'s'} pending</span>
      </div>`:''}
      <div id="ord-list">${vis.map(driverCard).join('')||emptyState('🚚','No deliveries pending','All caught up!')}</div>`;
    return;
  }

  // All other roles: standard filtered list
  let vis=visOrders();
  const allSt=[...new Set(ORDERS.map(o=>o.status))].sort();

  if(_ordSearch){const s=_ordSearch.toLowerCase();vis=vis.filter(o=>
    o.tracking_code?.toLowerCase().includes(s)||
    o.customer_name?.toLowerCase().includes(s)||
    o.sales_person?.toLowerCase().includes(s)||
    (o.customer_number1||'').includes(s)||
    (o.address||'').toLowerCase().includes(s)
  )}
  // Default: hide Closed & Delivered unless explicitly filtered
  if(_ordStatus) vis=vis.filter(o=>o.status===_ordStatus);
  else vis=vis.filter(o=>!['Closed','Delivered'].includes(o.status));
  if(_ordPri) vis=vis.filter(o=>o.priority===_ordPri);
  if(ME.role!=='carpenter'){
    if(_ordSort==='newest') vis.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    else if(_ordSort==='delivery') vis.sort((a,b)=>new Date(a.delivery_date)-new Date(b.delivery_date));
    else if(_ordSort==='value') vis.sort((a,b)=>(b.total_order_value||0)-(a.total_order_value||0));
  }

  g('pg').innerHTML=`
    <div class="toolbar">
      <div class="s-wrap"><span class="s-ic">🔍</span><input class="s-in" type="text" placeholder="Search tracking, customer, phone…" value="${_ordSearch}" oninput="_ordSearch=this.value;renderOrders()"></div>
      <select class="fsel" onchange="_ordStatus=this.value;renderOrders()">
        <option value="">All Statuses</option>
        ${allSt.map(s=>`<option value="${s}"${_ordStatus===s?' selected':''}>${s}</option>`).join('')}
      </select>
      <select class="fsel" onchange="_ordPri=this.value;renderOrders()">
        <option value="">All Priorities</option>
        ${PRIS.map(p=>`<option value="${p}"${_ordPri===p?' selected':''}>${p}</option>`).join('')}
      </select>
      ${ME.role!=='carpenter'?`<select class="fsel" onchange="_ordSort=this.value;renderOrders()">
        <option value="newest"${_ordSort==='newest'?' selected':''}>Newest First</option>
        <option value="delivery"${_ordSort==='delivery'?' selected':''}>Nearest Delivery</option>
        <option value="value"${_ordSort==='value'?' selected':''}>Highest Value</option>
      </select>`:''}
    </div>
    <div id="ord-list">
      ${vis.map(ordCard).join('')||emptyState('📭','No orders found','Try adjusting filters')}
    </div>`;
}

async function dispatchOrder(oid){
  if(!confirm('Mark order as Out for Delivery? Driver will be notified.'))return;
  const o=ORDERS.find(x=>x.order_id===oid); if(!o)return;
  const prods=JSON.parse(JSON.stringify(o.products||[]));
  prods.forEach(p=>{if(p.product_status==='Ready for Dispatch')p.product_status='Out for Delivery'});
  try{
    const{error}=await DB.from('orders').update({products:prods,status:'Out for Delivery'}).eq('order_id',oid);
    if(error)throw error;
    toast('ok','🚚 Dispatched — Out for Delivery');
    closeDyn();
    await loadOrders();
    renderOrders();
  }catch(e){toast('err',e.message)}
}

function prodCard(p,idx,order,canBH,canFH,isCarp,isQC,isDrv,isOwn){
  const stages=p.product_type==='vendor'?VEN:p.product_type==='stock'?STK:MFR;
  const si=stages.indexOf(p.product_status);
  const pct=Math.max(0,Math.min(100,(Math.max(0,si)/(stages.length-1))*100));
  const drawImgs=(p.drawing_image_urls||'').split(',').filter(Boolean);
  const refImgs=(p.reference_image_urls||'').split(',').filter(Boolean);
  const allImgs=[p.showroom_image_url,...drawImgs,...refImgs,p.model_image_url,p.completed_image_url].filter(Boolean);
  // Store images globally for safe onclick references
  const imgKey='_img'+(++_imgStoreId);
  if(allImgs.length) _imgStore[imgKey]=allImgs;
  const imgSize=isCarp?'width:90px;height:90px':'width:58px;height:58px';

  let acts='';
  const oid=order.order_id;
  if(canBH&&p.product_status==='Pending Approval')
    acts+=`<button class="btn bg2 bxs" onclick="approveProd('${oid}',${idx})">✅ Approve</button>
           <button class="btn bs bxs" onclick="queryProd('${oid}',${idx})">💬 Query</button>`;
  if(canBH&&p.product_status==='Query Raised')
    acts+=`<button class="btn bg2 bxs" onclick="approveProd('${oid}',${idx})">✅ Approve</button>`;
  if((canFH||isOwn)&&p.product_type==='manufacture'){
    if(p.product_status==='Approved') acts+=`<button class="btn bp bxs" onclick="setProdSt('${oid}',${idx},'Sent to Factory')">🏭 Send to Factory</button>`;
    if(p.product_status==='Sent to Factory') acts+=`<button class="btn bp bxs" onclick="assignCarp('${oid}',${idx})">👷 Assign Carpenter</button>`;
    if(p.product_status==='In Production') acts+=`<button class="btn bp bxs" onclick="setProdSt('${oid}',${idx},'Quality Check')">🔍 Send to QC</button>`;
    if(p.product_status==='Quality Check') acts+=`<button class="btn bg2 bxs" onclick="setProdSt('${oid}',${idx},'Ready for Dispatch')">📦 Ready</button>`;
    if(p.product_status==='Ready for Dispatch') acts+=`<button class="btn bg2 bxs" onclick="setProdSt('${oid}',${idx},'Out for Delivery')">🚚 Out for Delivery</button>`;
  }
  if((canFH||isOwn)&&p.product_type==='vendor'){
    if(p.product_status==='Approved') acts+=`<button class="btn bp bxs" onclick="setProdSt('${oid}',${idx},'Order Placed')">📋 Order Placed</button>`;
    if(p.product_status==='Order Placed') acts+=`<button class="btn bp bxs" onclick="setProdSt('${oid}',${idx},'Product Received')">📦 Received</button>`;
    if(p.product_status==='Product Received') acts+=`<button class="btn bg2 bxs" onclick="setProdSt('${oid}',${idx},'Out for Delivery')">🚚 Out for Delivery</button>`;
  }
  if((canFH||isOwn)&&p.product_type==='stock'&&p.product_status==='Approved')
    acts+=`<button class="btn bg2 bxs" onclick="setProdSt('${oid}',${idx},'Out for Delivery')">🚚 Out for Delivery</button>`;
  if(isCarp&&p.assigned_to===ME.name&&p.product_status==='Assigned to Carpenter')
    acts+=`<button class="btn bp bxs" onclick="setProdSt('${oid}',${idx},'In Production')">⚙️ Start Production</button>`;
  if(isQC&&p.product_status==='Quality Check')
    acts+=`<button class="btn bg2 bxs" onclick="setProdSt('${oid}',${idx},'Ready for Dispatch')">✅ Passed QC</button>`;

  return`<div class="p-card">
    <div class="p-hd">
      <div>
        <div class="p-nm">${p.product_name||'Unnamed'}</div>
        <div class="p-mt">${[p.material_type,p.size,p.color].filter(Boolean).join(' · ')}</div>
        <div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">
          <span class="badge b${(p.product_type||'man').substring(0,3)}">${ptIcon(p.product_type)}${p.product_type||'manufacture'}</span>
          <span class="badge bpend">${p.product_status||'Pending'}</span>
          ${(p.quantity||1)>1?`<span class="badge bnorm">Qty:${p.quantity}</span>`:''}
        </div>
      </div>
      <div style="text-align:right">
        ${p.unit_value?`<div style="font-size:12px;font-weight:700;color:var(--green)">₹${Number(p.unit_value).toLocaleString('en-IN')}</div>`:''}
        ${p.assigned_to?`<div style="font-size:10px;color:var(--muted)">👷 ${p.assigned_to}</div>`:''}
      </div>
    </div>
    <div class="prog-w"><div class="prog-b" style="width:${pct}%"></div></div>
    <div style="font-size:10px;color:var(--muted);margin-top:2px">${Math.max(0,si)+1}/${stages.length} · ${Math.round(pct)}%</div>
    ${p.product_query?`<div class="qbox">💬 Query: ${p.product_query}</div>`:''}
    ${allImgs.length?`<div class="img-row">${allImgs.map((u,i)=>`<img class="imt" style="${imgSize}" src="${u}" onclick="openIV(_imgStore['${imgKey}'],${i},'${(p.product_name||'Product').replace(/'/g,'\\&#39;')} Images')">`).join('')}</div>`:''}
    ${acts?`<div class="p-acts">${acts}</div>`:''}
  </div>`;
}

// ─── Product Status Actions ───
async function setProdSt(oid,idx,newSt){
  const o=ORDERS.find(x=>x.order_id===oid); if(!o)return;
  const prods=JSON.parse(JSON.stringify(o.products||[]));
  prods[idx].product_status=newSt;
  const ovSt=calcOrdSt(prods);
  try{
    const{error}=await DB.from('orders').update({products:prods,status:ovSt}).eq('order_id',oid);
    if(error)throw error;
    toast('ok','Updated to '+newSt);
    await loadOrders();
    openOrd(oid);
  }catch(e){toast('err',e.message)}
}

async function approveProd(oid,idx){
  const o=ORDERS.find(x=>x.order_id===oid); if(!o)return;
  const prods=JSON.parse(JSON.stringify(o.products||[]));
  prods[idx].product_status='Approved';
  prods[idx].product_query='';
  const ovSt=calcOrdSt(prods);
  try{
    const{error}=await DB.from('orders').update({products:prods,status:ovSt,branch_approved:'yes',branch_approved_by:ME.name}).eq('order_id',oid);
    if(error)throw error;
    toast('ok','Product approved!');
    await loadOrders(); openOrd(oid);
  }catch(e){toast('err',e.message)}
}

async function queryProd(oid,idx){
  const q=prompt('Enter your query for this product:');
  if(!q)return;
  const o=ORDERS.find(x=>x.order_id===oid); if(!o)return;
  const prods=JSON.parse(JSON.stringify(o.products||[]));
  prods[idx].product_status='Query Raised';
  prods[idx].product_query=q;
  const ovSt=calcOrdSt(prods);
  try{
    const{error}=await DB.from('orders').update({products:prods,status:ovSt,branch_query:q}).eq('order_id',oid);
    if(error)throw error;
    toast('info','Query raised');
    await loadOrders(); openOrd(oid);
  }catch(e){toast('err',e.message)}
}

async function assignCarp(oid,idx){
  const carps=USERS.filter(u=>u.role==='carpenter'&&u.approved&&u.status==='active');
  if(!carps.length){toast('err','No active carpenters');return}
  const sel=prompt('Select carpenter:\n'+carps.map((c,i)=>`${i+1}. ${c.name}`).join('\n')+'\nEnter number:');
  if(!sel)return;
  const ci=parseInt(sel)-1;
  if(ci<0||ci>=carps.length){toast('err','Invalid');return}
  const c=carps[ci];
  const o=ORDERS.find(x=>x.order_id===oid); if(!o)return;
  const prods=JSON.parse(JSON.stringify(o.products||[]));
  prods[idx].product_status='Assigned to Carpenter';
  prods[idx].assigned_to=c.name;
  const ovSt=calcOrdSt(prods);
  try{
    const{error}=await DB.from('orders').update({products:prods,status:ovSt,factory_assigned_to:c.name}).eq('order_id',oid);
    if(error)throw error;
    toast('ok','Assigned to '+c.name);
    await loadOrders(); openOrd(oid);
  }catch(e){toast('err',e.message)}
}

async function markDelivered(oid){
  if(!confirm('Mark order as Delivered?'))return;
  const o=ORDERS.find(x=>x.order_id===oid); if(!o)return;
  const prods=JSON.parse(JSON.stringify(o.products||[]));
  prods.forEach(p=>{if(['Out for Delivery','Ready for Dispatch'].includes(p.product_status))p.product_status='Delivered'});
  try{
    const{error}=await DB.from('orders').update({products:prods,status:'Delivered'}).eq('order_id',oid);
    if(error)throw error;
    toast('ok','Delivered!');
    await loadOrders(); closeDyn();
  }catch(e){toast('err',e.message)}
}

async function closeOrd(oid){
  if(!confirm('Close this order?'))return;
  try{
    await DB.from('orders').update({status:'Closed'}).eq('order_id',oid);
    toast('info','Order closed'); await loadOrders(); closeDyn(); if(PAGE==='orders')renderOrders();
  }catch(e){toast('err',e.message)}
}

async function editPri(oid,cur){
  const opts=PRIS.map((p,i)=>`${i+1}. ${p}`).join('\n');
  const sel=prompt(`Change priority:\n${opts}\nEnter number (current: ${cur}):`);
  if(!sel)return;
  const pi=parseInt(sel)-1;
  if(pi<0||pi>=PRIS.length)return;
  try{
    await DB.from('orders').update({priority:PRIS[pi]}).eq('order_id',oid);
    toast('ok','Priority: '+PRIS[pi]); await loadOrders(); openOrd(oid);
  }catch(e){toast('err',e.message)}
}

async function editDates(oid,cur,curF){
  const nd=prompt('New delivery date (YYYY-MM-DD):',cur); if(!nd)return;
  const nf=prompt('Factory deadline (YYYY-MM-DD, leave blank to keep):',curF);
  const upd={delivery_date:nd};
  if(nf!==null&&nf!=='') upd.factory_delivery_date=nf;
  try{
    await DB.from('orders').update(upd).eq('order_id',oid);
    toast('ok','Dates updated'); await loadOrders(); openOrd(oid);
  }catch(e){toast('err',e.message)}
}

function calcOrdSt(prods){
  if(!prods.length)return'Order Created';
  const sts=prods.map(p=>p.product_status);
  if(sts.every(s=>s==='Delivered'))return'Delivered';
  if(sts.every(s=>['Out for Delivery','Delivered'].includes(s)))return'Out for Delivery';
  if(sts.every(s=>['Ready for Dispatch','Out for Delivery','Delivered'].includes(s)))return'Ready for Dispatch';
  if(sts.some(s=>['Pending Approval','Query Raised'].includes(s)))return'Waiting for Branch Approval';
  if(sts.some(s=>['In Production','Assigned to Carpenter'].includes(s)))return'In Production';
  if(sts.some(s=>s==='Quality Check'))return'Quality Check';
  if(sts.some(s=>s==='Sent to Factory'))return'Sent to Factory';
  if(sts.some(s=>s==='Order Placed'))return'In Progress';
  if(sts.every(s=>s==='Approved'))return'Approved by Branch';
  return'Waiting for Branch Approval';
}

async function submitOrd(){

  const oid='ORD-'+Date.now();
  const trk='TRK-'+Math.random().toString(36).substring(2,8).toUpperCase();
  const tv=_newProds.reduce((s,p)=>s+(p.unit_value||0)*(p.quantity||1),0);
  const order={
    order_id:oid, tracking_code:trk,
    branch_name:gv('co-br'), sales_person:ME.name,
    customer_name:cn, customer_number1:p1, customer_number2:gv('co-p2'),
    address:addr, floor_number:gv('co-fl'),
    assembling_required:gv('co-asm'),
    delivery_date:dd, factory_delivery_date:gv('co-fd'),
    manufacture_or_vendor:_newProds.some(p=>p.product_type==='manufacture')?'manufacture':'vendor',
    status:'Waiting for Branch Approval',
    priority:gv('co-pri'), branch_approved:'no',
    factory_assigned_to:'', created_at:new Date().toISOString(),
    products:_newProds,

  }catch(e){el.innerHTML=err(e.message)}
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TASKS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderTasks(){
  if(ME.role==='owner')
    g('tb-a').innerHTML=`<button class="btn bp bsm" onclick="openAssignTask()">+ Assign Task</button>`;
  const pend=TASKS.filter(t=>t.status==='pending').length;
  const dbt=TASKS.filter(t=>t.status==='doubt').length;
  const done=TASKS.filter(t=>t.status==='completed').length;
  const show=ME.role==='owner'?(_tskFilter==='all'?TASKS:TASKS.filter(t=>t.status===_tskFilter)):TASKS;
  g('pg').innerHTML=`
    ${ME.role==='owner'?`<div class="chips">
      <div class="chip ${_tskFilter==='pending'?'on':''}" onclick="_tskFilter='pending';renderTasks()">⏳ Pending (${pend})</div>
      <div class="chip ${_tskFilter==='doubt'?'on':''}" onclick="_tskFilter='doubt';renderTasks()">💬 Doubts (${dbt})</div>
      <div class="chip ${_tskFilter==='completed'?'on':''}" onclick="_tskFilter='completed';renderTasks()">✅ Done (${done})</div>
      <div class="chip ${_tskFilter==='all'?'on':''}" onclick="_tskFilter='all';renderTasks()">All (${TASKS.length})</div>
    </div>`:''}
    ${show.map(tkCard).join('')||'<div class="empty"><div class="empty-ic">📋</div><div class="empty-t">No tasks</div></div>'}`;
}

function tkCard(t){
  const sc={pending:'var(--blue)',doubt:'var(--yel)',completed:'var(--green)'};
  const si={pending:'⏳',doubt:'💬',completed:'✅'};
  const isMe=t.assigned_to_id===ME.id, isOwn=ME.role==='owner';
  return`<div class="tk-c">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:5px">
      <span style="font-size:11px;font-weight:700;color:${sc[t.status]}">${si[t.status]} ${t.status.toUpperCase()}</span>
      <span style="font-size:10px;color:var(--muted)">${fmtRel(t.created_at)}</span>
    </div>
    <div class="tk-d">${t.task_description}</div>
    <div class="tk-m">
      <span>👤 ${t.assigned_to_name}</span>
      <span>${ROLES[t.assigned_to_role]||t.assigned_to_role}</span>
      ${t.phone_number?`<a href="tel:${t.phone_number}" style="color:var(--green)">📞 ${t.phone_number}</a>`:''}
      ${t.assigned_by_name?`<span>By: ${t.assigned_by_name}</span>`:''}
    </div>
    ${t.status_note?`<div class="tk-note">📝 ${t.status_note}</div>`:''}
    ${t.doubt_reply?`<div class="tk-note" style="color:var(--acc)">↩️ ${t.doubt_reply}</div>`:''}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
      ${isMe&&t.status==='pending'?`<button class="btn bg2 bxs" onclick="tkSt('${t.id}','completed')">✅ Done</button><button class="btn bs bxs" onclick="tkDoubt('${t.id}')">💬 Doubt</button>`:''}
      ${isOwn&&t.status==='doubt'?`<button class="btn bp bxs" onclick="tkReply('${t.id}')">↩️ Reply</button>`:''}
      ${isOwn?`<button class="btn bd bxs" onclick="tkDel('${t.id}')">🗑</button>`:''}
    </div>
  </div>`;
}

function openAssignTask(){
  const opts=USERS.filter(u=>u.approved&&u.status==='active').map(u=>`<option value="${u.id}|${u.name}|${u.role}">${u.name} (${ROLES[u.role]||u.role})</option>`).join('');
  openDyn(`
    <div class="mh"><div class="mh-t">📋 Assign Task</div><div class="mc-x" onclick="closeDyn()">×</div></div>
    <div class="mb">
      <div class="fg"><label class="fl">Assign To *</label><select class="fi" id="at-u"><option value="">— Select —</option>${opts}</select></div>
      <div class="fg"><label class="fl">Phone (optional)</label><input class="fi" id="at-ph" type="tel" placeholder="Relevant number"></div>
      <div class="fg"><label class="fl">Task Description *</label><textarea class="fi" id="at-d" rows="4" placeholder="Describe the task…"></textarea></div>
    </div>
    <div class="mf"><button class="btn bs" onclick="closeDyn()">Cancel</button><button class="btn bp" onclick="submitTask()">Assign</button></div>`);
}

async function submitTask(){
  const uv=gv('at-u'), d=gv('at-d'), ph=gv('at-ph');
  if(!uv||!d){toast('err','Select person and enter description');return}
  const[uid,uname,urole]=uv.split('|');
  try{
    const{error}=await DB.from('tasks').insert({id:'tsk'+Date.now(),phone_number:ph,task_description:d,assigned_to_id:uid,assigned_to_name:uname,assigned_to_role:urole,assigned_by_name:ME.name,created_at:new Date().toISOString(),status:'pending',status_note:'',doubt_reply:'',completed_at:''});
    if(error)throw error;
    toast('ok','Task assigned to '+uname); closeDyn(); await loadTasks(); renderTasks();
  }catch(e){toast('err',e.message)}
}
async function tkSt(id,st){
  const upd={status:st};if(st==='completed')upd.completed_at=new Date().toISOString();
  try{const{error}=await DB.from('tasks').update(upd).eq('id',id);if(error)throw error;toast('ok',st==='completed'?'Task done!':'Updated');await loadTasks();renderTasks()}catch(e){toast('err',e.message)}
}
async function tkDoubt(id){
  const n=prompt('Describe your doubt:');if(!n)return;
  try{const{error}=await DB.from('tasks').update({status:'doubt',status_note:n}).eq('id',id);if(error)throw error;toast('info','Doubt raised');await loadTasks();renderTasks()}catch(e){toast('err',e.message)}
}
async function tkReply(id){
  const r=prompt('Reply to the doubt:');if(!r)return;
  try{const{error}=await DB.from('tasks').update({doubt_reply:r,status:'pending'}).eq('id',id);if(error)throw error;toast('ok','Reply sent');await loadTasks();renderTasks()}catch(e){toast('err',e.message)}
}
async function tkDel(id){
  if(!confirm('Delete task?'))return;
  try{await DB.from('tasks').delete().eq('id',id);await loadTasks();renderTasks()}catch(e){toast('err',e.message)}
}

// USERS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderUsers(){
  g('tb-a').innerHTML=`<button class="btn bp bsm" onclick="openAddUser()">+ Add User</button>`;
  let vis=USERS.filter(u=>u.id!=='owner-1');
  if(_usrSearch){const s=_usrSearch.toLowerCase();vis=vis.filter(u=>u.name?.toLowerCase().includes(s)||u.email?.toLowerCase().includes(s)||u.phone?.includes(s))}
  const pend=vis.filter(u=>!u.approved||u.status==='pending');
  const act=vis.filter(u=>u.approved&&u.status==='active');
  const susp=vis.filter(u=>u.status==='suspended');
  const show=_usrFilter==='pending'?pend:_usrFilter==='active'?act:susp;
  g('pg').innerHTML=`
    <div class="s-wrap" style="max-width:340px;margin-bottom:12px"><span class="s-ic">🔍</span><input class="s-in" placeholder="Search users…" value="${_usrSearch}" oninput="_usrSearch=this.value;renderUsers()"></div>
    <div class="chips">
      <div class="chip ${_usrFilter==='pending'?'on':''}" onclick="_usrFilter='pending';renderUsers()">⏳ Pending (${pend.length})</div>
      <div class="chip ${_usrFilter==='active'?'on':''}" onclick="_usrFilter='active';renderUsers()">✅ Active (${act.length})</div>
      <div class="chip ${_usrFilter==='suspended'?'on':''}" onclick="_usrFilter='suspended';renderUsers()">🚫 Suspended (${susp.length})</div>
    </div>
    ${show.map(usrCard).join('')||'<div class="empty"><div class="empty-ic">👥</div><div class="empty-t">No users here</div></div>'}`;
