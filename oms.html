<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indira OMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ─── CSS VARIABLES ─────────────────────────────────────────────────────── */
:root{
  --a:#E07B39;--blue:#3B82F6;--purple:#8B5CF6;--green:#22C55E;
  --red:#EF4444;--yellow:#F59E0B;--cyan:#0EA5E9;
  --bg:#0F1117;--bg2:#161922;--bg3:#1E2230;
  --b:#2A2D3E;--b2:#363A50;
  --t:#E8EAF0;--t2:#9194A6;--t3:#5A5D70;
  --r:10px;--rl:14px;--sh:0 4px 20px rgba(0,0,0,.4);
  --tr:.18s ease;--f:'DM Sans',sans-serif;--sw:220px;
}
[data-theme=light]{
  --bg:#F5F6FA;--bg2:#FFF;--bg3:#ECEEF5;
  --b:#DDE0ED;--b2:#CDD0E0;
  --t:#1A1D2E;--t2:#5A5D70;--t3:#9194A6;
  --sh:0 4px 20px rgba(0,0,0,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--f);background:var(--bg);color:var(--t);font-size:14px;line-height:1.5;}
#app{height:100%;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--f);cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:var(--f);outline:none;}
*{scrollbar-width:thin;scrollbar-color:var(--b2) transparent;}

/* ─── LAYOUT ─────────────────────────────────────────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:var(--sw);flex-shrink:0;background:var(--bg2);border-right:1px solid var(--b);display:flex;flex-direction:column;overflow:hidden;transition:width var(--tr);}
.sb-brand{padding:18px 16px 14px;border-bottom:1px solid var(--b);}
.sb-logo{display:flex;align-items:center;gap:10px;}
.sb-icon{font-size:22px;}
.sb-name{font-weight:800;font-size:15px;color:var(--a);}
.sb-branch{font-size:11px;color:var(--t3);margin-top:2px;}
.sb-nav{flex:1;padding:8px;overflow-y:auto;}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r);color:var(--t2);font-weight:500;font-size:13px;cursor:pointer;transition:all var(--tr);margin-bottom:2px;white-space:nowrap;}
.nav-i:hover{background:var(--bg3);color:var(--t);}
.nav-i.on{background:var(--a);color:#fff;}
.nav-i .ic{font-size:16px;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;}
.nav-i.on .nav-badge{background:rgba(255,255,255,.3);}
.sb-foot{padding:10px 12px;border-top:1px solid var(--b);}
.uchip{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg3);border-radius:var(--r);}
.uav{width:32px;height:32px;border-radius:50%;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.uname{font-weight:600;font-size:12px;}
.urole{font-size:10px;color:var(--t3);}
.logout{background:none;color:var(--t3);padding:5px 7px;border-radius:6px;font-size:17px;transition:color var(--tr);margin-left:auto;}
.logout:hover{color:var(--red);}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0;}
.ph{padding:18px 22px 14px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:12px;flex-shrink:0;background:var(--bg2);position:sticky;top:0;z-index:10;}
.ptitle{font-size:17px;font-weight:700;}
.psub{font-size:11px;color:var(--t3);margin-top:1px;}
.pact{margin-left:auto;display:flex;align-items:center;gap:8px;}
.pb{padding:18px 22px;flex:1;}

/* ─── BUTTONS ────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-weight:600;font-size:13px;cursor:pointer;transition:all var(--tr);border:none;}
.btn-p{background:var(--a);color:#fff;} .btn-p:hover{filter:brightness(0.88);}
.btn-b{background:var(--blue);color:#fff;} .btn-b:hover{filter:brightness(0.88);}
.btn-g{background:var(--green);color:#000;} .btn-g:hover{filter:brightness(0.88);}
.btn-r{background:var(--red);color:#fff;} .btn-r:hover{filter:brightness(0.88);}
.btn-ghost{background:var(--bg3);color:var(--t2);border:1px solid var(--b);} .btn-ghost:hover{color:var(--t);}
.btn-pur{background:var(--purple);color:#fff;} .btn-pur:hover{filter:brightness(0.88);}
.btn-sm{padding:5px 12px;font-size:12px;}
.btn-lg{padding:11px 22px;font-size:14px;}
.btn-fw{width:100%;justify-content:center;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ─── CARDS ──────────────────────────────────────────────────────────────── */
.card{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rl);padding:16px;}

/* ─── FORMS ──────────────────────────────────────────────────────────────── */
.fg{margin-bottom:13px;}
.fl{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:5px;}
.fi,.fs,.fta{width:100%;background:var(--bg3);border:1px solid var(--b);border-radius:var(--r);padding:9px 12px;color:var(--t);font-size:13px;transition:border-color var(--tr);}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--a);}
.fta{resize:vertical;min-height:75px;}
.fs option{background:var(--bg2);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fsec{margin-bottom:18px;}
.fsec-t{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--b);}

/* ─── BADGES ─────────────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.bp{background:rgba(245,158,11,.12);color:var(--yellow);border:1px solid rgba(245,158,11,.2);}
.bf{background:rgba(59,130,246,.12);color:var(--blue);border:1px solid rgba(59,130,246,.2);}
.bd{background:rgba(14,165,233,.12);color:var(--cyan);border:1px solid rgba(14,165,233,.2);}
.bg2{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.2);}
.bq{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.bpu{background:rgba(139,92,246,.12);color:var(--purple);border:1px solid rgba(139,92,246,.2);}

/* ─── TABLE ──────────────────────────────────────────────────────────────── */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;padding:9px 13px;font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--b);white-space:nowrap;}
tbody td{padding:11px 13px;border-bottom:1px solid var(--b);vertical-align:middle;}
tbody tr:hover td{background:var(--bg3);}
tbody tr:last-child td{border-bottom:none;}

/* ─── ORDER CARDS ────────────────────────────────────────────────────────── */
.olist{display:flex;flex-direction:column;gap:9px;}
.ocard{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rl);padding:13px 15px;cursor:pointer;transition:all var(--tr);}
.ocard:hover{border-color:var(--a);transform:translateY(-1px);box-shadow:var(--sh);}
.ocard-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:7px;}
.ocard-title{font-weight:700;font-size:14px;}
.ocard-sub{font-size:11px;color:var(--t3);margin-top:2px;}
.pchip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:600;background:var(--bg3);color:var(--t2);border:1px solid var(--b);}

/* ─── MODAL ──────────────────────────────────────────────────────────────── */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;z-index:1000;padding:20px;overflow-y:auto;}
.modal{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rl);width:100%;max-width:660px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:sUp .2s ease;margin:auto;}
.modal-lg{max-width:820px;}
@keyframes sUp{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.mh{padding:16px 18px 12px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;}
.mt{font-weight:700;font-size:15px;}
.mcl{background:none;color:var(--t3);font-size:20px;padding:2px 5px;border-radius:5px;transition:color var(--tr);}
.mcl:hover{color:var(--t);}
.mb2{padding:16px 18px;max-height:75vh;overflow-y:auto;}
.mf{padding:12px 18px;border-top:1px solid var(--b);display:flex;gap:8px;justify-content:flex-end;}

/* ─── TABS ───────────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:2px;padding:3px;background:var(--bg3);border-radius:var(--r);margin-bottom:14px;}
.tab{flex:1;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;color:var(--t2);background:none;transition:all var(--tr);white-space:nowrap;}
.tab.on{background:var(--bg2);color:var(--t);box-shadow:0 1px 4px rgba(0,0,0,.2);}

/* ─── SEARCH ─────────────────────────────────────────────────────────────── */
.sbar{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--b);border-radius:var(--r);padding:0 12px;transition:border-color var(--tr);}
.sbar:focus-within{border-color:var(--a);}
.sbar input{flex:1;background:none;border:none;padding:8px 0;color:var(--t);font-size:13px;}

/* ─── LOGIN ──────────────────────────────────────────────────────────────── */
.lp{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.lbox{width:100%;max-width:400px;padding:20px;}
.lcard{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rl);padding:30px;box-shadow:var(--sh);}
.llogo{text-align:center;margin-bottom:24px;}
.llogo .li{font-size:38px;}
.llogo .lt{font-size:22px;font-weight:800;color:var(--a);margin-top:6px;}
.llogo .ls{font-size:12px;color:var(--t3);margin-top:2px;}

/* ─── TOAST ──────────────────────────────────────────────────────────────── */
.tc{position:fixed;top:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:7px;}
.toast{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:10px 14px;font-size:13px;box-shadow:var(--sh);display:flex;align-items:center;gap:8px;min-width:240px;max-width:340px;animation:sIn .2s ease;transition:opacity .3s;}
@keyframes sIn{from{transform:translateX(16px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.toast.ok{border-color:var(--green);}
.toast.err{border-color:var(--red);}
.toast.inf{border-color:var(--blue);}

/* ─── STATS ──────────────────────────────────────────────────────────────── */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;margin-bottom:18px;}
.scard{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rl);padding:14px;}
.slabel{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.sval{font-size:26px;font-weight:800;margin:3px 0 1px;}
.ssub{font-size:11px;color:var(--t3);}

/* ─── EMPTY ──────────────────────────────────────────────────────────────── */
.empty{text-align:center;padding:50px 20px;color:var(--t3);}
.empty .ei{font-size:44px;margin-bottom:10px;}
.empty .et{font-size:14px;font-weight:600;margin-bottom:5px;}

/* ─── LOADER ─────────────────────────────────────────────────────────────── */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;gap:10px;color:var(--t2);}
.spin{width:22px;height:22px;border:2px solid var(--b2);border-top-color:var(--a);border-radius:50%;animation:sp .6s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

/* ─── PRODUCT STATUS ROW ─────────────────────────────────────────────────── */
.psr{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;background:var(--bg3);margin-bottom:5px;border:1px solid var(--b);}

/* ─── DELIVERY CARD ──────────────────────────────────────────────────────── */
.dc{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rl);overflow:hidden;margin-bottom:11px;}
.dc-urg{padding:6px 13px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;border-bottom:1px solid var(--b);}
.dc-body{padding:13px;}

/* ─── TRACK ──────────────────────────────────────────────────────────────── */
.tr-res{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rl);overflow:hidden;margin-top:14px;}
.tr-h{padding:13px 15px;background:rgba(224,123,57,.07);border-bottom:1px solid var(--b);display:flex;align-items:center;gap:12px;}
.tr-pr{padding:9px 13px;border-bottom:1px solid var(--b);}
.tr-pr:last-child{border-bottom:none;}
.tr-sb{padding:7px 11px;border-radius:8px;margin-top:5px;display:flex;align-items:center;gap:8px;}

/* ─── INFO ROW ───────────────────────────────────────────────────────────── */
.ir{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid var(--b);}
.ir:last-child{border-bottom:none;}
.ir-l{font-size:11px;color:var(--t3);font-weight:600;min-width:110px;flex-shrink:0;}
.ir-v{font-size:13px;font-weight:500;}

/* ─── MISC ───────────────────────────────────────────────────────────────── */
.divider{border:none;border-top:1px solid var(--b);margin:12px 0;}
.sectitle{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--b);}
.alert{padding:9px 13px;border-radius:var(--r);font-size:12px;margin-bottom:11px;display:flex;align-items:flex-start;gap:8px;}
.aw{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:var(--yellow);}
.ai{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);color:var(--blue);}
.ag{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:var(--green);}
.img-th{width:68px;height:68px;object-fit:cover;border-radius:7px;cursor:pointer;border:1px solid var(--b);transition:transform var(--tr);}
.img-th:hover{transform:scale(1.06);}
.img-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
.priority-h{color:var(--red);font-weight:700;font-size:11px;}
.priority-m{color:var(--yellow);font-weight:700;font-size:11px;}
.priority-n{color:var(--t3);font-weight:600;font-size:11px;}
.theme-btn{background:var(--bg3);border:1px solid var(--b);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--t2);display:flex;align-items:center;gap:5px;cursor:pointer;transition:all var(--tr);}
.theme-btn:hover{color:var(--t);}

@media(max-width:768px){
  :root{--sw:0px;}
  .sidebar{position:fixed;left:-220px;top:0;bottom:0;width:220px;z-index:200;transition:left .25s ease;}
  .sidebar.open{left:0;}
  .mob-hdr{display:flex;align-items:center;gap:12px;padding:11px 15px;background:var(--bg2);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:100;}
  .ham{background:none;font-size:20px;color:var(--t);padding:4px;}
  .ph{display:none;}
  .pb{padding:12px 15px;}
  .frow{grid-template-columns:1fr;}
  .sgrid{grid-template-columns:repeat(2,1fr);}
  .mov{padding:0;align-items:flex-end;}
  .modal{border-radius:var(--rl) var(--rl) 0 0;max-height:92vh;overflow-y:auto;}
}
@media(min-width:769px){.mob-hdr{display:none;}}
</style>
</head>
<body>
<div id="app"></div>
<div class="tc" id="toasts"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════════════
const CFG = {
  URL: 'https://cwoanknzbeoqnswtcgfh.supabase.co',
  KEY: 'sb_publishable_jr0-HWDmstOv74xBfb2kuA_6QKa7AGt',
  BRANCHES: ['Steel Main Branch','Vengamedu Branch','Chennimalai Branch','Factory'],
  ROLES: ['sales','branch_head','factory_head','carpenter','quality_check','owner'],
  ROLE_LABELS: {sales:'Sales',branch_head:'Branch Head',factory_head:'Factory Head',carpenter:'Carpenter',quality_check:'Quality Check',owner:'Owner'},
  PRIORITIES: ['High','Medium','Normal'],
  STATUS_STAGES: ['Order Created','Waiting for Branch Approval','Query Raised','Approved by Branch','Sent to Factory','Assigned to Carpenter','In Production','Quality Check','Ready for Dispatch','Out for Delivery','Delivered','Closed'],
};

// ═══════════════════════════════════════════════════════════════════════════
// DB
// ═══════════════════════════════════════════════════════════════════════════
let _sb = null;
const DB = {
  get sb() { if(!_sb) _sb=supabase.createClient(CFG.URL,CFG.KEY); return _sb; },
  async getUsers()         { const {data,error}=await this.sb.from('users').select().order('name'); if(error)throw error; return data||[]; },
  async loginUser(role,id,pw) { const {data,error}=await this.sb.from('users').select().eq('id',id).eq('role',role).eq('password',pw).maybeSingle(); if(error)throw error; return data; },
  async registerUser(u)    { const id='u'+Date.now(); const {error}=await this.sb.from('users').insert({id,...u,approved:false,status:'pending'}); if(error)throw error; },
  async updateUser(id,d)   { const {error}=await this.sb.from('users').update(d).eq('id',id); if(error)throw error; },
  async deleteUser(id)     { const {error}=await this.sb.from('users').delete().eq('id',id); if(error)throw error; },
  async getOrders()        { const {data,error}=await this.sb.from('orders').select().order('created_at',{ascending:false}); if(error)throw error; return data||[]; },
  async getOrderById(id)   { const {data,error}=await this.sb.from('orders').select().eq('order_id',id).maybeSingle(); if(error)throw error; return data; },
  async trackOrder(code)   { const {data,error}=await this.sb.from('orders').select().ilike('tracking_code',code).maybeSingle(); if(error)throw error; return data; },
  async createOrder(o)     { const {error}=await this.sb.from('orders').insert(o); if(error)throw error; },
  async updateOrder(id,d)  { const {error}=await this.sb.from('orders').update(d).eq('order_id',id); if(error)throw error; },
  async uploadImage(file,folder) {
    const ext=file.name.split('.').pop();
    const path=`${folder}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const {error}=await this.sb.storage.from('oms-images').upload(path,file);
    if(error)throw error;
    const {data}=this.sb.storage.from('oms-images').getPublicUrl(path);
    return data.publicUrl;
  },
  subscribeOrders(cb) {
    return this.sb.channel('orders-rt').on('postgres_changes',{event:'*',schema:'public',table:'orders'},cb).subscribe();
  }
};

// ═══════════════════════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════════════════════
const Auth = {
  _u: null,
  init()  { try{const s=sessionStorage.getItem('oms_u'); if(s)this._u=JSON.parse(s);}catch(e){} },
  get u() { return this._u; },
  get ok(){ return !!this._u; },
  login(u){ this._u=u; sessionStorage.setItem('oms_u',JSON.stringify(u)); },
  logout(){ this._u=null; sessionStorage.removeItem('oms_u'); },
  is(...roles){ return roles.includes(this._u?.role); },
};

// ═══════════════════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════════════════
function toast(msg,type='inf'){
  const el=document.getElementById('toasts');
  const t=document.createElement('div');
  const icon={ok:'✅',err:'❌',inf:'ℹ️'}[type]||'ℹ️';
  t.className='toast '+type;
  t.innerHTML=`<span>${icon}</span><span>${msg}</span>`;
  el.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';},2700);
  setTimeout(()=>t.remove(),3000);
}
function fmtDate(d){
  if(!d)return'—';
  try{return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;}
}
function daysLabel(ds){
  try{
    const d=new Date(ds),n=new Date(); n.setHours(0,0,0,0); d.setHours(0,0,0,0);
    const diff=Math.round((d-n)/86400000);
    if(diff<0)return'⚠️ '+(-diff)+'d overdue';
    if(diff===0)return'🔴 Today';
    if(diff===1)return'🟡 Tomorrow';
    return'🟢 '+diff+' days away';
  }catch(e){return ds;}
}
function daysColor(ds){
  try{
    const diff=Math.round((new Date(ds)-new Date())/86400000);
    if(diff<0)return'var(--red)';
    if(diff<=1)return'var(--yellow)';
    return'var(--green)';
  }catch(e){return'var(--t3)';}
}
function typeIcon(t){return t==='manufacture'?'🏭':t==='vendor'?'🛒':'🏬';}
function typeColor(t){return t==='manufacture'?'var(--blue)':t==='vendor'?'var(--purple)':'var(--green)';}
function typeLabel(t){return t==='manufacture'?'Manufacture':t==='vendor'?'Vendor Order':'In Stock';}
function statusColor(s){
  if(!s)return'var(--t3)';
  if(s==='Delivered')return'var(--green)';
  if(s==='Out for Delivery'||s==='Product Received')return'var(--cyan)';
  if(s==='Ready for Dispatch')return'#10B981';
  if(['In Production','Sent to Factory','Assigned to Carpenter','Order Placed'].some(x=>s.includes(x.split(' ')[0])))return'var(--blue)';
  if(s.includes('Query')||s.includes('Pending'))return'var(--yellow)';
  if(s.includes('Approved'))return'var(--green)';
  return'var(--t3)';
}
function productLabel(p){
  const maps={
    manufacture:{'Pending Approval':'⏳ Pending','Query Raised':'💬 Query','Approved':'✅ Approved','Sent to Factory':'🏭 In Factory','Assigned to Carpenter':'🔨 Assigned','In Production':'⚙️ In Production','Quality Check':'🔍 QC','Ready for Dispatch':'📦 Product Ready','Out for Delivery':'🚚 Out for Delivery','Delivered':'✅ Delivered'},
    vendor:{'Pending Approval':'⏳ Pending','Query Raised':'💬 Query','Approved':'✅ Approved','Order Placed':'📋 Order Placed','Product Received':'📦 Received','Out for Delivery':'🚚 Out for Delivery','Delivered':'✅ Delivered'},
    stock:{'Pending Approval':'⏳ Pending','Query Raised':'💬 Query','Approved':'✅ Approved','Out for Delivery':'🚚 Out for Delivery','Delivered':'✅ Delivered'}
  };
  return (maps[p.product_type]||{})[p.product_status]||p.product_status||'—';
}
function statusHint(p){
  const h={
    manufacture:{'Pending Approval':'Waiting for branch head review','Query Raised':'Branch head raised a query','Sent to Factory':'Sent to factory for production','Assigned to Carpenter':'Assigned to carpenter','In Production':'Being built','Quality Check':'Quality inspection in progress','Ready for Dispatch':'Product ready — awaiting pickup','Out for Delivery':'On the way to customer','Delivered':'Delivered successfully ✅'},
    vendor:{'Pending Approval':'Waiting for branch head review','Order Placed':'Order placed with vendor — awaiting delivery','Product Received':'Received at branch','Out for Delivery':'On the way to customer','Delivered':'Delivered successfully ✅'},
    stock:{'Pending Approval':'Waiting for branch head review','Out for Delivery':'On the way to customer','Delivered':'Delivered successfully ✅'}
  };
  return (h[p.product_type]||{})[p.product_status]||'';
}
function priorityBadge(p){
  const cls=p==='High'?'priority-h':p==='Medium'?'priority-m':'priority-n';
  const ic=p==='High'?'🔴':p==='Medium'?'🟡':'⚪';
  return`<span class="${cls}">${ic} ${p}</span>`;
}
function statusBadge(s){
  let cls='bp';
  if(s&&s.includes('Delivered'))cls='bg2';
  else if(s&&(s.includes('Delivery')||s.includes('Out')))cls='bd';
  else if(s&&(s.includes('Query')||s.includes('Pending')))cls='bq';
  else if(s&&(s.includes('Factory')||s.includes('Production')||s.includes('Assigned')))cls='bf';
  else if(s&&(s.includes('Approved')||s.includes('Ready')))cls='bg2';
  else if(s&&s.includes('QC'))cls='bpu';
  return`<span class="badge ${cls}">${s||'—'}</span>`;
}
function productStatusSummary(prods,filterType){
  const list=filterType?prods.filter(p=>p.product_type===filterType):prods;
  if(!list.length)return'<div class="empty"><div class="ei">📦</div><div class="et">No products</div></div>';
  return list.map((p,i)=>{
    const sc=statusColor(p.product_status),tc=typeColor(p.product_type),ti=typeIcon(p.product_type);
    return`<div class="psr">
      <span style="font-size:15px">${ti}</span>
      <div style="width:3px;height:30px;background:${tc};border-radius:2px;flex-shrink:0"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:10px;color:var(--t3)">P${i+1} · ${typeLabel(p.product_type)}</div>
        <div style="font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.product_name||'—'}</div>
      </div>
      <span style="font-size:11px;color:var(--t3)">×${p.quantity||1}</span>
      <span class="badge" style="background:${sc}18;color:${sc};border:1px solid ${sc}40">${productLabel(p)}</span>
    </div>`;
  }).join('');
}
function imgThumb(url){
  if(!url)return'';
  return`<img class="img-th" src="${url}" onclick="previewImg('${url}')" />`;
}
function previewImg(url){
  openModal('Image',`<div style="text-align:center"><img src="${url}" style="max-width:100%;border-radius:8px"></div>`,'');
}
function computeStatus(prods,cur){
  if(!prods||!prods.length)return cur;
  const ss=prods.map(p=>p.product_status);
  if(ss.every(s=>s==='Delivered'))return'Delivered';
  if(ss.every(s=>s==='Out for Delivery'||s==='Delivered'))return'Out for Delivery';
  if(ss.some(s=>s==='Pending Approval'||s==='Query Raised'))return'Waiting for Branch Approval';
  const ok=['Approved','Sent to Factory','Assigned to Carpenter','In Production','Quality Check','Ready for Dispatch','Order Placed','Product Received','Out for Delivery','Delivered'];
  if(ss.every(s=>ok.includes(s))){
    if(ss.includes('In Production')||ss.includes('Assigned to Carpenter'))return'In Production';
    if(ss.includes('Quality Check'))return'Quality Check';
    if(ss.includes('Order Placed'))return'In Progress';
    if(ss.includes('Sent to Factory'))return'Sent to Factory';
    return'Approved by Branch';
  }
  return cur;
}
function genId(){return'ORD-'+Date.now();}
function genTrack(orders){
  const nums=(orders||[]).map(o=>parseInt((o.tracking_code||'').replace(/\D/g,''))||0);
  return'OC'+(nums.length?Math.max(...nums)+1:100);
}

async function doTrack(){
  const code=document.getElementById('tr-code').value.trim();
  if(!code)return;
  const el=document.getElementById('tr-result');
  el.innerHTML=loadingHTML();
  try{
    const o=await DB.trackOrder(code);
    if(!o){el.innerHTML=emptyHTML('🔍','Order not found','Check the order code and try again');return;}
    const prods=o.products||[];
    const done=prods.filter(p=>p.product_status==='Delivered').length;
    const total=prods.length;
    el.innerHTML=`<div class="tr-res">
      <div class="tr-h">
        <span style="font-size:22px">📦</span>
        <div style="flex:1">
          <div style="font-weight:800;font-size:15px;color:var(--a)">${o.tracking_code}</div>
          <div style="font-weight:600;font-size:13px">${o.customer_name}</div>
        </div>
        <span class="badge ${done===total?'bg2':'bf'}">${done===total?'✅ All Delivered':done+'/'+total+' Done'}</span>
      </div>
      <div style="padding:10px 14px;border-bottom:1px solid var(--b);display:flex;gap:8px;font-size:11px;color:var(--t3)">
        <span>📅 Expected: ${fmtDate(o.delivery_date)}</span>
        ${prods.some(p=>p.product_status==='Out for Delivery')?'<span class="badge bd">🚚 '+(prods.filter(p=>p.product_status==='Out for Delivery').length)+' out for delivery</span>':''}
      </div>
      ${prods.map((p,i)=>{
        const sc=statusColor(p.product_status);
        const hint=statusHint(p);
        return`<div class="tr-pr">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:3px;height:36px;background:${typeColor(p.product_type)};border-radius:2px;flex-shrink:0"></div>
            <div style="flex:1">
              <div style="font-size:10px;color:var(--t3)">${typeIcon(p.product_type)} Product ${i+1} · ${typeLabel(p.product_type)}</div>
              <div style="font-weight:700;font-size:13px">${p.product_name} <span style="font-size:11px;color:var(--t3)">×${p.quantity||1}</span></div>
            </div>
          </div>
          <div class="tr-sb" style="background:${sc}10;border:1px solid ${sc}25">
            <span style="width:8px;height:8px;border-radius:50%;background:${sc};flex-shrink:0;display:block"></span>
            <div style="flex:1">
              <div style="font-weight:800;font-size:12px;color:${sc}">${productLabel(p)}</div>
              <div style="font-size:11px;color:var(--t2)">${hint}</div>
            </div>
            ${p.product_status==='Delivered'?'<span style="font-size:16px">✅</span>':p.product_status==='Out for Delivery'?'<span style="font-size:14px">🚚</span>':''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }catch(e){el.innerHTML=emptyHTML('❌','Error',e.message);}
}

      if(sb&&!sb.contains(e.target)&&sb.classList.contains('open'))sb.classList.remove('open');
    },{once:false});
    this.renderPage();
  },
  getTabs(role){
    const all=[
      {id:'dashboard',icon:'📊',label:'Dashboard'},
      {id:'orders',icon:'📋',label:role==='factory_head'?'Factory Orders':role==='carpenter'?'My Work':'Orders'},
      {id:'delivery',icon:'🚚',label:'Delivery'},
      {id:'track',icon:'🔍',label:'Track'},
      ...(role==='owner'?[{id:'users',icon:'👥',label:'Users'}]:[]),
      {id:'profile',icon:'👤',label:'Profile'},
    ];
    // Only BH/owner see Delivery tab
    return all.filter(t=>t.id!=='delivery'||Auth.is('branch_head','owner'));
  },
  go(page){
    this.page=page;
    document.querySelectorAll('.nav-i').forEach(n=>n.classList.remove('on'));
    document.querySelectorAll('.nav-i').forEach(n=>{
      if(n.getAttribute('onclick')&&n.getAttribute('onclick').includes("'"+page+"'"))n.classList.add('on');
    });
    this.renderPage();
    // Close mobile sidebar
    document.getElementById('sidebar')?.classList.remove('open');
  },
  renderPage(){
    const c=document.getElementById('page-content');
    if(!c)return;
    if(this.page==='dashboard') renderDashboard(c);
    else if(this.page==='orders')   renderOrders(c);
    else if(this.page==='delivery') renderDelivery(c);
    else if(this.page==='track')    renderTrack(c);
    else if(this.page==='users')    renderUsers(c);
    else if(this.page==='profile')  renderProfile(c);
  },
  logout(){Auth.logout();renderLogin();}
};

function toggleTheme(){
  const h=document.documentElement;
  h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark');
}

function renderDashboard(c){
  const u=Auth.u; const orders=State.orders;
  let vis=orders;
  if(Auth.is('sales')) vis=vis.filter(o=>o.sales_person===u.name);
  if(Auth.is('branch_head')) vis=vis.filter(o=>o.branch_name===u.branch);

  const total=vis.length;
  const pending=vis.filter(o=>(o.products||[]).some(p=>p.product_status==='Pending Approval')).length;
  const active=vis.filter(o=>!['Delivered','Closed'].includes(o.status)).length;
  const delivered=vis.filter(o=>o.status==='Delivered').length;
  const outDel=vis.filter(o=>(o.products||[]).some(p=>p.product_status==='Out for Delivery')).length;
  const highPri=vis.filter(o=>o.priority==='High'&&!['Delivered','Closed'].includes(o.status)).length;

  // Overdue
  const today=new Date(); today.setHours(0,0,0,0);
  const overdue=vis.filter(o=>{
    if(['Delivered','Closed'].includes(o.status))return false;
    try{return new Date(o.delivery_date)<today;}catch(e){return false;}
  }).length;

  c.innerHTML=`
  <div class="ph"><div><div class="ptitle">📊 Dashboard</div><div class="psub">Hello, ${u.name}</div></div>
    <div class="pact"><button class="theme-btn" onclick="toggleTheme()">🌗 Theme</button></div>
  </div>
  <div class="pb">
    <div class="sgrid">
      <div class="scard"><div class="slabel">Total Orders</div><div class="sval">${total}</div><div class="ssub">All time</div></div>
      <div class="scard"><div class="slabel">Active</div><div class="sval" style="color:var(--blue)">${active}</div><div class="ssub">In progress</div></div>
      <div class="scard"><div class="slabel">Pending Approval</div><div class="sval" style="color:var(--yellow)">${pending}</div><div class="ssub">Awaiting BH</div></div>
      <div class="scard"><div class="slabel">Out for Delivery</div><div class="sval" style="color:var(--cyan)">${outDel}</div><div class="ssub">En route</div></div>
      <div class="scard"><div class="slabel">Delivered</div><div class="sval" style="color:var(--green)">${delivered}</div><div class="ssub">Completed</div></div>
      ${overdue?`<div class="scard"><div class="slabel">Overdue ⚠️</div><div class="sval" style="color:var(--red)">${overdue}</div><div class="ssub">Past delivery date</div></div>`:''}
      ${highPri?`<div class="scard"><div class="slabel">High Priority</div><div class="sval" style="color:var(--red)">${highPri}</div><div class="ssub">Needs attention</div></div>`:''}
    </div>
    ${pending>0&&Auth.is('branch_head','owner')?`
    <div class="alert aw" style="cursor:pointer" onclick="App.go('orders')">
      ⚠️ <strong>${pending} product(s)</strong> awaiting your approval — <u>Go to Orders →</u>
    </div>`:''}
    ${overdue>0?`<div class="alert" style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red)">
      🔴 <strong>${overdue} order(s)</strong> are past their delivery date
    </div>`:''}
    <div class="sectitle">Recent Orders</div>
    <div class="olist">
      ${vis.slice(0,8).map(o=>orderCardHTML(o)).join('')||emptyHTML('📋','No orders yet')}
    </div>
  </div>`;
}

let _orderSearch='', _orderFilter='';
function renderOrders(c){
  const u=Auth.u; let orders=State.orders;
  // Filter by role
  if(Auth.is('sales'))        orders=orders.filter(o=>o.sales_person===u.name);
  if(Auth.is('branch_head'))  orders=orders.filter(o=>o.branch_name===u.branch);
  if(Auth.is('factory_head')) orders=orders.filter(o=>(o.products||[]).some(p=>p.product_type==='manufacture'&&['Sent to Factory','Assigned to Carpenter','In Production','Quality Check','Ready for Dispatch'].includes(p.product_status)));
  if(Auth.is('carpenter'))    orders=orders.filter(o=>(o.products||[]).some(p=>p.product_type==='manufacture'&&p.assigned_to===u.name));
  if(Auth.is('quality_check'))orders=orders.filter(o=>(o.products||[]).some(p=>p.product_status==='Quality Check'));

  // Sort carpenters by priority
  if(Auth.is('carpenter')){
    const po={'High':0,'Medium':1,'Normal':2};
    orders=orders.sort((a,b)=>(po[a.priority]||2)-(po[b.priority]||2));
  }

  // Search
  if(_orderSearch) orders=orders.filter(o=>
    o.customer_name?.toLowerCase().includes(_orderSearch)||
    o.tracking_code?.toLowerCase().includes(_orderSearch));

  // Status filter
  if(_orderFilter) orders=orders.filter(o=>o.status===_orderFilter);
  else orders=orders.filter(o=>!['Closed','Delivered'].includes(o.status));

  const canCreate=Auth.is('sales','branch_head','owner');

  c.innerHTML=`
  <div class="ph">
    <div><div class="ptitle">📋 ${Auth.is('factory_head')?'Factory Orders':Auth.is('carpenter')?'My Work':'Orders'}</div>
    <div class="psub">${orders.length} order${orders.length!==1?'s':''}</div></div>
    <div class="pact">
      ${canCreate?`<button class="btn btn-p btn-sm" onclick="renderNewOrder()">+ New Order</button>`:''}
    </div>
  </div>
  <div class="pb">
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <div class="sbar" style="flex:1;min-width:180px">
        <span>🔍</span>
        <input placeholder="Search name / code..." value="${_orderSearch}" oninput="_orderSearch=this.value.toLowerCase();App.renderPage()" />
      </div>
      ${!Auth.is('carpenter')?`<select class="fs" style="width:auto;min-width:160px" onchange="_orderFilter=this.value;App.renderPage()">
        <option value="">All Active Statuses</option>
        ${CFG.STATUS_STAGES.map(s=>`<option value="${s}"${_orderFilter===s?' selected':''}>${s}</option>`).join('')}
      </select>`:''}
      ${_orderFilter||_orderSearch?`<button class="btn btn-ghost btn-sm" onclick="_orderFilter='';_orderSearch='';App.renderPage()">✕ Clear</button>`:''}
    </div>
    <div class="olist">
      ${orders.length?orders.map(o=>orderCardHTML(o)).join(''):emptyHTML('📋','No orders found','Try a different search or filter')}
    </div>
  </div>`;
}

function orderCardHTML(o){
  const prods=o.products||[];
  const types=[...new Set(prods.map(p=>p.product_type))];
  const typeSummary=types.length===1?(types[0]==='manufacture'?'🏭 Manufacture':types[0]==='vendor'?'🛒 Vendor':'🏬 Stock'):'🔀 Mixed';
  const hasQuery=prods.some(p=>p.product_query&&p.product_query.length>0);
  const hasPending=prods.some(p=>p.product_status==='Pending Approval');
  const today=new Date(); today.setHours(0,0,0,0);
  let isOverdue=false;
  try{isOverdue=new Date(o.delivery_date)<today&&!['Delivered','Closed'].includes(o.status);}catch(e){}

  return`<div class="ocard" onclick="openOrderDetail('${o.order_id}')">
    <div class="ocard-h">
      <div style="flex:1">
        <div class="ocard-title">${o.customer_name||'—'}</div>
        <div class="ocard-sub">${o.tracking_code} · ${o.branch_name} · ${fmtDate(o.delivery_date)}${isOverdue?' <span style="color:var(--red)">⚠️ Overdue</span>':''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        ${statusBadge(computeStatus(prods,o.status))}
        ${priorityBadge(o.priority)}
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
      <span style="font-size:11px;color:var(--t3)">${typeSummary}</span>
      ${hasPending?'<span class="badge bq">⏳ Needs Approval</span>':''}
      ${hasQuery?'<span class="badge bp">💬 Query</span>':''}
    </div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">
      ${prods.map(p=>`<span class="pchip">${typeIcon(p.product_type)} ${p.product_name||'—'} ×${p.quantity||1}</span>`).join('')}
    </div>
  </div>`;
}

    ...((p.reference_image_urls||'').split(',').filter(Boolean)),
    p.showroom_image_url,p.model_image_url,p.completed_image_url

// ─── BH ACTIONS ──────────────────────────────────────────────────────────
function bhQueryPrompt(orderId,pi,productName){
  openModal('Raise Query — '+productName,`
    <p style="color:var(--t2);font-size:12px;margin-bottom:10px">Describe the issue or missing information for this product:</p>
    <textarea class="fta" id="q-text" placeholder="e.g. Please provide more details on the color specification..." rows="4"></textarea>`,
    `<button class="btn btn-ghost btn-sm" onclick="openOrderDetail('${orderId}')">Cancel</button>
     <button class="btn btn-r btn-sm" onclick="bhAction('${orderId}',${pi},'query',document.getElementById('q-text').value)">💬 Send Query</button>`
  );
}
async function bhAction(orderId,pi,action,query){
  closeModal();
  const btn=document.querySelector('.btn:disabled');
  try{
    const o=await DB.getOrderById(orderId);
    const prods=[...o.products];
    const p=prods[pi];
    let ns=p.product_status, nq=p.product_query||'';
    if(action==='approve'){
      ns=p.product_type==='manufacture'?'Sent to Factory':p.product_type==='vendor'?'Order Placed':'Out for Delivery';
      nq='';
    } else if(action==='query'){
      if(!query){toast('Please enter a query message','err');openOrderDetail(orderId);return;}
      ns='Query Raised'; nq=query;
    } else if(action==='vendor_received'){
      ns='Out for Delivery';
    }
    prods[pi]={...p,product_status:ns,product_query:nq};
    const newStatus=computeStatus(prods,o.status);
    await DB.updateOrder(orderId,{products:prods,status:newStatus,branch_approved:action==='approve'?'yes':o.branch_approved});
    State.orders=await DB.getOrders();
    const msgs={approve:'✅ Product approved',query:'💬 Query sent to sales',vendor_received:'📦 Marked received — Out for Delivery'};
    toast(msgs[action]||'✅ Done','ok');
    // Reopen order detail
    openOrderDetail(orderId);
  }catch(e){toast('Error: '+e.message,'err');}
}

async function resubmitProduct(orderId,pi){
  try{
    const o=await DB.getOrderById(orderId);
    const prods=[...o.products];

// DELIVERY
// ═══════════════════════════════════════════════════════════════════════════
let _delivTab=0;
function renderDelivery(c){
  const u=Auth.u;
  const allItems=[];
  State.orders.forEach(o=>{
    if(o.branch_name!==u.branch)return;
    (o.products||[]).forEach((p,pi)=>{
      if(['Ready for Dispatch','Out for Delivery','Delivered'].includes(p.product_status)){
        allItems.push({order:o,product:p,pi});
      }
    });
  });
  allItems.sort((a,b)=>{
    try{return new Date(a.order.delivery_date)-new Date(b.order.delivery_date);}catch(e){return 0;}
  });
  const ready=allItems.filter(x=>x.product.product_status==='Ready for Dispatch');
  const out=allItems.filter(x=>x.product.product_status==='Out for Delivery');
  const done=allItems.filter(x=>x.product.product_status==='Delivered');

  function tabItems(items,mode){
    if(!items.length)return emptyHTML('📭',mode==='done'?'No deliveries completed yet':mode==='out'?'No products currently out for delivery':'No products ready for dispatch yet');
    return items.map(x=>delivCardHTML(x,mode)).join('');
  }

  c.innerHTML=`
  <div class="ph"><div><div class="ptitle">🚚 Delivery Planning</div><div class="psub">${ready.length} ready, ${out.length} out, ${done.length} delivered</div></div></div>
  <div class="pb">
    <div class="tabs">
      <button class="tab${_delivTab===0?' on':''}" onclick="_delivTab=0;App.renderPage()">📦 Ready ${ready.length?`<span class="nav-badge" style="margin-left:4px;background:var(--a)">${ready.length}</span>`:''}</button>
      <button class="tab${_delivTab===1?' on':''}" onclick="_delivTab=1;App.renderPage()">🚚 Out ${out.length?`<span class="nav-badge" style="margin-left:4px;background:var(--cyan)">${out.length}</span>`:''}</button>
      <button class="tab${_delivTab===2?' on':''}" onclick="_delivTab=2;App.renderPage()">✅ Done ${done.length?`<span class="nav-badge" style="margin-left:4px;background:var(--green)">${done.length}</span>`:''}</button>
    </div>
    <div id="deliv-list">
      ${_delivTab===0?tabItems(ready,'ready'):_delivTab===1?tabItems(out,'out'):tabItems(done,'done')}
    </div>
  </div>`;
}
function delivCardHTML({order:o,product:p,pi},mode){
  const tc=typeColor(p.product_type),ti=typeIcon(p.product_type);
  const dc=daysColor(o.delivery_date),dl=daysLabel(o.delivery_date);
  return`<div class="dc">
    <div class="dc-urg" style="color:${dc};background:${dc}0f">
      <span>${dl}</span><span>${o.delivery_date}</span>
    </div>
    <div class="dc-body">
      <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px">
        <div style="width:3px;height:42px;background:${tc};border-radius:2px;flex-shrink:0;margin-top:2px"></div>
        <div style="flex:1">
          <div style="font-weight:800;font-size:14px">${ti} ${p.product_name}</div>
          <div style="font-size:11px;color:var(--t3)">Order #${o.tracking_code} · ×${p.quantity||1}</div>
        </div>
        ${priorityBadge(o.priority)}
      </div>
      <div style="border-top:1px solid var(--b);padding-top:9px;margin-bottom:9px">
        <div style="display:flex;gap:5px;align-items:center;margin-bottom:3px"><span>👤</span><strong style="font-size:13px">${o.customer_name}</strong></div>
        ${o.customer_number1?`<div style="font-size:12px;color:var(--t2)">📞 ${o.customer_number1}</div>`:''}
        ${o.customer_number2?`<div style="font-size:12px;color:var(--t2)">📞 ${o.customer_number2}</div>`:''}
        ${o.address?`<div style="font-size:12px;color:var(--t2)">📍 ${o.address}${o.floor_number?', Floor '+o.floor_number:''}</div>`:''}
        ${o.assembling_required==='yes'?`<div style="margin-top:5px"><span class="badge bp">🔧 Assembling Required</span></div>`:''}
      </div>
      ${mode==='ready'?`<button class="btn btn-b btn-fw" onclick="dispatchDelivery('${o.order_id}',${pi})">🚚 Dispatch Now</button>`:''}
      ${mode==='out'?`<button class="btn btn-g btn-fw" onclick="markDeliveredPrompt('${o.order_id}',${pi},'${(p.product_name||'').replace(/'/g,"\\'")}')">✅ Mark as Delivered</button>`:''}
      ${mode==='done'?`<div style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:var(--r);padding:9px;text-align:center;color:var(--green);font-weight:700">✅ Delivered</div>`:''}
    </div>
  </div>`;
}
async function dispatchDelivery(orderId,pi){
  try{
    const o=await DB.getOrderById(orderId);
    const prods=[...o.products];
    prods[pi]={...prods[pi],product_status:'Out for Delivery'};
    const allOut=prods.every(p=>['Out for Delivery','Delivered'].includes(p.product_status));
    await DB.updateOrder(orderId,{products:prods,status:allOut?'Out for Delivery':o.status});
    State.orders=await DB.getOrders();
    _delivTab=1;
    toast('🚚 Dispatched!','ok');
    App.renderPage();
  }catch(e){toast('Error: '+e.message,'err');}
}
function markDeliveredPrompt(orderId,pi,productName){
  openModal('Mark as Delivered — '+productName,`
    <div style="text-align:center;padding:10px 0 16px">
      <div style="font-size:36px">📸</div>
      <div style="font-size:13px;color:var(--t2);margin-top:8px">Upload a delivery photo (optional)</div>
    </div>
    <div class="fg">
      <label class="fl">Delivery Photo</label>
      <input type="file" class="fi" id="del-img" accept="image/*" style="padding:6px" />
    </div>
    <div id="del-preview" style="margin-top:6px"></div>`,
    `<button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
     <button class="btn btn-ghost btn-sm" onclick="confirmDelivered('${orderId}',${pi},false)">Skip Photo</button>
     <button class="btn btn-g btn-sm" onclick="confirmDelivered('${orderId}',${pi},true)">✅ Confirm Delivered</button>`
  );
  setTimeout(()=>{
    const fi=document.getElementById('del-img');
    if(fi) fi.onchange=()=>{
      const prev=document.getElementById('del-preview');
      if(fi.files[0]&&prev){
        const r=new FileReader();
        r.onload=e2=>prev.innerHTML=`<img src="${e2.target.result}" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px">`;
        r.readAsDataURL(fi.files[0]);
      }
    };
  },100);
}
async function confirmDelivered(orderId,pi,withPhoto){
  try{
    const file=withPhoto?document.getElementById('del-img')?.files[0]:null;
    let photoUrl='';
    if(file) photoUrl=await DB.uploadImage(file,'delivered');
    const o=await DB.getOrderById(orderId);
    const prods=[...o.products];
    prods[pi]={...prods[pi],product_status:'Delivered'};
    const allDone=prods.every(p=>p.product_status==='Delivered');
    const update={products:prods,status:allDone?'Delivered':o.status};
    if(photoUrl) update.delivered_image_url=photoUrl;
    await DB.updateOrder(orderId,update);
    State.orders=await DB.getOrders();
    _delivTab=2;
    closeModal();
    toast('✅ Marked as Delivered!','ok');
    App.renderPage();
  }catch(e){toast('Error: '+e.message,'err');}
}

async function doInternalTrack(){
  const code=document.getElementById('int-tr')?.value?.trim();
  if(!code)return;
  const el=document.getElementById('int-tr-result');
  el.innerHTML=loadingHTML();
  try{
    const o=await DB.trackOrder(code);
    if(!o){el.innerHTML=emptyHTML('🔍','Order not found');return;}
    const prods=o.products||[];
    const done=prods.filter(p=>p.product_status==='Delivered').length;
    const total=prods.length;
    el.innerHTML=`<div class="tr-res">
      <div class="tr-h">
        <span style="font-size:22px">📦</span>
        <div style="flex:1">
          <div style="font-weight:800;font-size:15px;color:var(--a)">${o.tracking_code}</div>
          <div style="font-weight:600">${o.customer_name}</div>
        </div>
        <span class="badge ${done===total?'bg2':'bf'}">${done===total?'✅ All Delivered':done+'/'+total+' Done'}</span>
      </div>
      <div style="padding:8px 14px;border-bottom:1px solid var(--b);font-size:11px;color:var(--t3)">📅 Expected: ${fmtDate(o.delivery_date)}</div>
      ${prods.map((p,i)=>{
        const sc=statusColor(p.product_status);
        return`<div class="tr-pr">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:3px;height:34px;background:${typeColor(p.product_type)};border-radius:2px;flex-shrink:0"></div>
            <div style="flex:1">
              <div style="font-size:10px;color:var(--t3)">${typeIcon(p.product_type)} Product ${i+1} · ${typeLabel(p.product_type)}</div>
              <div style="font-weight:700;font-size:13px">${p.product_name} <span style="font-size:11px;color:var(--t3)">×${p.quantity||1}</span></div>
            </div>
          </div>
          <div class="tr-sb" style="background:${sc}10;border:1px solid ${sc}25">
            <span style="width:8px;height:8px;border-radius:50%;background:${sc};flex-shrink:0;display:block"></span>
            <div style="flex:1">
              <div style="font-weight:800;font-size:12px;color:${sc}">${productLabel(p)}</div>
              <div style="font-size:11px;color:var(--t2)">${statusHint(p)}</div>
            </div>
            ${p.product_status==='Delivered'?'<span style="font-size:16px">✅</span>':p.product_status==='Out for Delivery'?'<span style="font-size:14px">🚚</span>':''}
          </div>
        </div>`;
      }).join('')}
    </div>`;
  }catch(e){el.innerHTML=emptyHTML('❌','Error',e.message);}
}

// ═══════════════════════════════════════════════════════════════════════════
// USERS (Owner only)
// ═══════════════════════════════════════════════════════════════════════════
let _usersTab=0;
function renderUsers(c){
  const users=State.users;
  const pending=users.filter(u=>u.status==='pending');
  const active=users.filter(u=>u.status==='active'&&u.approved);
  c.innerHTML=`
  <div class="ph"><div class="ptitle">👥 Users</div><div class="pact"><button class="btn btn-p btn-sm" onclick="renderAddUser()">+ Add User</button></div></div>
  <div class="pb">
    <div class="tabs">
      <button class="tab${_usersTab===0?' on':''}" onclick="_usersTab=0;App.renderPage()">Active (${active.length})</button>
      <button class="tab${_usersTab===1?' on':''}" onclick="_usersTab=1;App.renderPage()">Pending ${pending.length?`<span class="nav-badge" style="margin-left:4px;background:var(--yellow);color:#000">${pending.length}</span>`:''}</button>
    </div>
    <div class="card">
      <div class="tw"><table>
        <thead><tr><th>Name</th><th>Role</th><th>Branch</th><th>User ID</th><th>Actions</th></tr></thead>
        <tbody>
          ${(_usersTab===0?active:pending).map(u=>`<tr>
            <td><div style="font-weight:600">${u.name}</div></td>
            <td>${CFG.ROLE_LABELS[u.role]||u.role}</td>
            <td style="font-size:12px;color:var(--t2)">${u.branch}</td>
            <td><code style="font-size:11px;background:var(--bg3);padding:2px 6px;border-radius:4px">${u.id}</code></td>
            <td style="display:flex;gap:6px;flex-wrap:wrap">
              ${!u.approved?`<button class="btn btn-g btn-sm" onclick="approveUser('${u.id}')">✅ Approve</button>`:''}
              <button class="btn btn-ghost btn-sm" onclick="toggleUserStatus('${u.id}','${u.status}')">
                ${u.status==='active'?'🚫 Deactivate':'✅ Activate'}
              </button>
              <button class="btn btn-r btn-sm" onclick="deleteUser('${u.id}')">🗑️</button>
            </td>
          </tr>`).join('')||`<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--t3)">No users</td></tr>`}
        </tbody>
      </table></div>
    </div>
  </div>`;
}
function renderAddUser(){
  openModal('Add New User',`
    <div class="frow">
      <div class="fg"><label class="fl">Full Name *</label><input class="fi" id="au-name" required /></div>
      <div class="fg"><label class="fl">Phone</label><input class="fi" id="au-phone" /></div>
    </div>
    <div class="frow">
      <div class="fg"><label class="fl">Role *</label>
        <select class="fs" id="au-role">
          ${CFG.ROLES.map(r=>`<option value="${r}">${CFG.ROLE_LABELS[r]}</option>`).join('')}
        </select>
      </div>
      <div class="fg"><label class="fl">Branch *</label>
        <select class="fs" id="au-branch">
          ${CFG.BRANCHES.map(b=>`<option>${b}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="frow">
      <div class="fg"><label class="fl">User ID *</label><input class="fi" id="au-id" placeholder="Unique login ID" required /></div>
      <div class="fg"><label class="fl">Password *</label><input class="fi" id="au-pw" type="password" required /></div>
    </div>`,
    `<button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
     <button class="btn btn-p btn-sm" onclick="submitAddUser()">Add User</button>`
  );
}
async function submitAddUser(){
  try{
    const id=document.getElementById('au-id').value.trim();
    if(!id)throw new Error('User ID required');
    await DB.updateUser(id,{
      id,name:document.getElementById('au-name').value.trim(),
      role:document.getElementById('au-role').value,
      branch:document.getElementById('au-branch').value,
      password:document.getElementById('au-pw').value,
      email:'',phone:document.getElementById('au-phone').value.trim(),
      approved:true,status:'active'
    });
    // use insert via registerUser + approve
    await DB.registerUser({
      id,name:document.getElementById('au-name').value.trim(),
      role:document.getElementById('au-role').value,
      branch:document.getElementById('au-branch').value,
      password:document.getElementById('au-pw').value,
      email:'',phone:document.getElementById('au-phone').value.trim(),
    });
    await DB.updateUser(id,{approved:true,status:'active'});
    State.users=await DB.getUsers();
    closeModal();
    toast('✅ User added!','ok');
    App.renderPage();
  }catch(e){toast('Error: '+e.message,'err');}
}
async function approveUser(id){
  try{
    await DB.updateUser(id,{approved:true,status:'active'});
    State.users=await DB.getUsers();
    toast('✅ User approved!','ok');
    App.renderPage();
  }catch(e){toast('Error: '+e.message,'err');}
}
async function toggleUserStatus(id,status){
  try{
    await DB.updateUser(id,{status:status==='active'?'inactive':'active'});
    State.users=await DB.getUsers();
    App.renderPage();
  }catch(e){toast('Error: '+e.message,'err');}
}
async function deleteUser(id){
  if(!confirm('Delete user '+id+'?'))return;
  try{
    await DB.deleteUser(id);
    State.users=await DB.getUsers();
    App.renderPage();
    toast('🗑️ User deleted','inf');
  }catch(e){toast('Error: '+e.message,'err');}
}

// ═══════════════════════════════════════════════════════════════════════════
// PROFILE
// ═══════════════════════════════════════════════════════════════════════════
function renderProfile(c){
  const u=Auth.u;
  c.innerHTML=`
  <div class="ph"><div class="ptitle">👤 My Profile</div></div>
  <div class="pb" style="max-width:480px">
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">
        <div style="width:60px;height:60px;border-radius:50%;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800">${u.name[0].toUpperCase()}</div>
        <div>
          <div style="font-size:18px;font-weight:800">${u.name}</div>
          <div style="color:var(--t3);font-size:12px">${CFG.ROLE_LABELS[u.role]||u.role} · ${u.branch}</div>
        </div>
      </div>
      <div style="background:var(--bg3);border-radius:var(--r);padding:12px">
        ${infoRow('User ID',u.id)}
        ${infoRow('Branch',u.branch)}
        ${infoRow('Role',CFG.ROLE_LABELS[u.role]||u.role)}
        ${u.phone?infoRow('Phone',u.phone):''}
        ${u.email?infoRow('Email',u.email):''}
      </div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="card-title" style="margin-bottom:12px">🔒 Change Password</div>
      <div class="fg"><label class="fl">Current Password</label><input class="fi" id="cp-old" type="password" /></div>
      <div class="fg"><label class="fl">New Password</label><input class="fi" id="cp-new" type="password" /></div>
      <div class="fg"><label class="fl">Confirm New Password</label><input class="fi" id="cp-conf" type="password" /></div>
      <button class="btn btn-p btn-fw" onclick="changePassword()">Change Password</button>
    </div>
    <button class="btn btn-r btn-fw" onclick="App.logout()">⏻ Logout</button>
    <div style="margin-top:12px;text-align:center">
      <button class="theme-btn" onclick="toggleTheme()">🌗 Toggle Theme</button>
    </div>
  </div>`;
}
async function changePassword(){
  const old_=document.getElementById('cp-old').value;
  const nw=document.getElementById('cp-new').value;
  const conf=document.getElementById('cp-conf').value;
  if(nw!==conf){toast('Passwords do not match','err');return;}
  if(Auth.u.password!==old_){toast('Current password is incorrect','err');return;}
  if(!nw){toast('New password cannot be empty','err');return;}
  try{
    await DB.updateUser(Auth.u.id,{password:nw});
    Auth.u.password=nw;
    sessionStorage.setItem('oms_u',JSON.stringify(Auth.u));
    toast('✅ Password changed!','ok');
  }catch(e){toast('Error: '+e.message,'err');}
}

// ═══════════════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════════════
Auth.init();
(async()=>{
  if(Auth.ok){
    try{
      await State.load();
      State.subscribe();
      App.render();
    }catch(e){
      Auth.logout();
      renderLogin();
    }
  } else {
    renderLogin();
  }
})();
</script>
