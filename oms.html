<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indira OMS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --acc:#E8900A;--acc2:#D4720A;--blue:#2D7DD2;--green:#27AE60;
  --red:#E03C31;--yel:#E67E22;--pur:#8E44AD;
  --bg:#0A0C10;--bg2:#111318;--bg3:#1A1D24;--bdr:#2A2D35;
  --card:#14171F;--txt:#E8EAF0;--muted:#8B8FA8;--inp:#1A1D24;
  --r:10px;--r2:6px;--shadow:0 4px 20px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px}
a{color:var(--acc);text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:10px}
.dn{display:none!important}

/* ─── Auth Screens ─── */
#screen-login{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 20% 50%,rgba(232,144,10,.08) 0%,transparent 60%),var(--bg);
  padding:20px
}
.a-card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:32px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.logo-i{width:40px;height:40px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px}
.logo-t{font-size:19px;font-weight:800}
.logo-s{font-size:11px;color:var(--muted)}
.ftitle{font-size:17px;font-weight:800;margin-bottom:4px}
.fsub{color:var(--muted);font-size:12px;margin-bottom:20px}

/* ─── Form ─── */
.fg{margin-bottom:12px}
.fl{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fi{width:100%;padding:9px 12px;background:var(--inp);border:1px solid var(--bdr);border-radius:var(--r2);color:var(--txt);transition:border-color .15s}
.fi:focus{outline:none;border-color:var(--acc)}
.fi::placeholder{color:var(--muted);opacity:.6}
select.fi option{background:var(--bg3)}
.fi-wrap{position:relative}
.fi-eye{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;font-size:15px;background:none;border:none;color:var(--muted)}
textarea.fi{resize:vertical;min-height:72px}
.err{background:rgba(224,60,49,.1);border:1px solid rgba(224,60,49,.3);color:var(--red);padding:9px 12px;border-radius:var(--r2);font-size:13px;margin-bottom:12px}
.ok{background:rgba(39,174,96,.1);border:1px solid rgba(39,174,96,.3);color:var(--green);padding:9px 12px;border-radius:var(--r2);font-size:13px;margin-bottom:12px}

/* ─── Buttons ─── */
.btn{padding:9px 16px;border-radius:var(--r2);font-weight:700;font-size:13px;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bp{background:var(--acc);color:#fff}.bp:hover{background:var(--acc2)}
.bs{background:var(--bg3);color:var(--txt);border:1px solid var(--bdr)}.bs:hover{border-color:var(--acc);color:var(--acc)}
.bd{background:rgba(224,60,49,.12);color:var(--red);border:1px solid rgba(224,60,49,.25)}.bd:hover{background:rgba(224,60,49,.2)}
.bg2{background:rgba(39,174,96,.12);color:var(--green);border:1px solid rgba(39,174,96,.25)}.bg2:hover{background:rgba(39,174,96,.22)}
.bsm{padding:5px 11px;font-size:12px}
.bxs{padding:3px 8px;font-size:11px;border-radius:4px}
.bfull{width:100%;justify-content:center;padding:11px}
.bload{opacity:.6;pointer-events:none}

/* ─── Main Layout ─── */
#screen-app{display:flex;min-height:100vh}
.sb{width:220px;min-width:220px;background:var(--card);border-right:1px solid var(--bdr);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s}
.sb-logo{padding:18px 14px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:9px}
.sb-li{width:32px;height:32px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:13px}
.sb-lt{font-size:14px;font-weight:800}
.sb-lv{font-size:10px;color:var(--muted)}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.sb-sec{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 8px 3px}
.ni{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;transition:all .15s;margin-bottom:1px;border:1px solid transparent}
.ni:hover{background:var(--bg3);color:var(--txt)}
.ni.on{background:rgba(232,144,10,.12);color:var(--acc);border-color:rgba(232,144,10,.2)}
.ni-ic{font-size:16px;width:20px;text-align:center}
.nbadge{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;min-width:18px;text-align:center}
.sb-foot{padding:10px 8px;border-top:1px solid var(--bdr)}
.u-row{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px}
.u-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--pur));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.u-nm{font-weight:700;font-size:13px}
.u-rl{font-size:11px;color:var(--muted)}
.sb-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99}
.sb-ov.on{display:block}
.mc{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.tb{background:var(--card);border-bottom:1px solid var(--bdr);padding:11px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.tb-t{font-size:16px;font-weight:800;flex:1}
.tb-a{display:flex;gap:7px;align-items:center}
.pc{padding:18px;flex:1}
.hmbg{display:none;background:none;border:1px solid var(--bdr);border-radius:6px;padding:5px 7px;color:var(--txt);font-size:17px}

/* ─── Cards ─── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat-c{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;cursor:pointer;transition:border-color .15s}
.stat-c:hover{border-color:var(--acc)}
.stat-n{font-size:26px;font-weight:800;line-height:1}
.stat-l{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}

.ord-c{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.ord-c:hover{border-color:var(--acc);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.ord-trk{font-size:12px;font-weight:700;color:var(--acc);font-family:'DM Mono',monospace}
.ord-nm{font-size:14px;font-weight:700}
.ord-br{font-size:11px;color:var(--muted);font-weight:600}
.ord-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px;font-size:12px;color:var(--muted);align-items:center}

/* ─── Badges ─── */
.badge{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.bpend{background:rgba(232,144,10,.15);color:var(--acc)}
.bappr{background:rgba(39,174,96,.2);color:#2ecc71}
.bprod{background:rgba(45,125,210,.15);color:var(--blue)}
.bqry{background:rgba(230,126,34,.15);color:var(--yel)}
.bhigh{background:rgba(224,60,49,.15);color:var(--red)}
.bmed{background:rgba(230,126,34,.15);color:var(--yel)}
.bnorm{background:rgba(139,143,168,.12);color:var(--muted)}
.bmfr{background:rgba(142,68,173,.15);color:var(--pur)}
.bven{background:rgba(45,125,210,.15);color:var(--blue)}
.bstk{background:rgba(39,174,96,.15);color:var(--green)}
.rtag{padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;background:rgba(232,144,10,.15);color:var(--acc);text-transform:uppercase;letter-spacing:.4px}

/* ─── Tabs ─── */
.tabs{display:flex;border-bottom:1px solid var(--bdr);margin-bottom:14px}
.tab{padding:8px 14px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}

/* ─── Chips ─── */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid var(--bdr);color:var(--muted);transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:rgba(232,144,10,.15);border-color:rgba(232,144,10,.3);color:var(--acc)}

/* ─── Toolbar ─── */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.s-wrap{position:relative;flex:1;min-width:180px}
.s-ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
.s-in{width:100%;padding:8px 10px 8px 32px;background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);color:var(--txt)}
.s-in:focus{outline:none;border-color:var(--acc)}
.fsel{padding:8px 10px;background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);color:var(--txt);font-size:13px}
.fsel:focus{outline:none;border-color:var(--acc)}

/* ─── Modal ─── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.modal{background:var(--card);border:1px solid var(--bdr);border-radius:14px;width:100%;max-width:660px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-lg{max-width:840px}
.mh{padding:18px 22px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1}
.mh-t{font-size:16px;font-weight:800}
.mh-s{font-size:11px;color:var(--muted);margin-top:2px}
.mc-x{background:var(--bg3);border:1px solid var(--bdr);color:var(--muted);width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;flex-shrink:0}
.mc-x:hover{color:var(--txt)}
.mb{padding:18px 22px}
.mf{padding:14px 22px;border-top:1px solid var(--bdr);display:flex;gap:8px;justify-content:flex-end}

/* ─── Product card ─── */
.p-card{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:13px;margin-bottom:9px}
.p-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.p-nm{font-size:13px;font-weight:700}
.p-mt{font-size:11px;color:var(--muted);margin-top:2px}
.p-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.prog-w{background:var(--bg2);border-radius:4px;height:5px;overflow:hidden;margin-top:5px}
.prog-b{height:100%;border-radius:4px;background:var(--acc);transition:width .4s}

/* ─── Detail grid ─── */
.dg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.di{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);padding:9px 11px}
.di-l{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:2px}
.di-v{font-size:13px;font-weight:600}
.sec-t{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 9px;display:flex;align-items:center;gap:6px}
.sec-t:first-child{margin-top:0}

/* ─── Task card ─── */
.tk-c{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:13px 15px;margin-bottom:8px}
.tk-d{font-size:13px;font-weight:600;margin-bottom:7px;line-height:1.4}
.tk-m{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.tk-note{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r2);padding:7px 11px;font-size:12px;color:var(--muted);margin-top:7px}

/* ─── User card ─── */
.uc{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.uc-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--pur));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.uc-i{flex:1}
.uc-nm{font-size:13px;font-weight:700}
.uc-mt{font-size:11px;color:var(--muted);margin-top:1px}
.uc-acts{display:flex;gap:5px;flex-wrap:wrap}

/* ─── Product form ─── */
.pf-item{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:13px;margin-bottom:9px}
.pf-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ─── Image thumbs ─── */
.img-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.imt{width:58px;height:58px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.imt:hover{border-color:var(--acc)}

/* ─── Image viewer ─── */
#iv-ov{position:fixed;inset:0;background:#000;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center}
#iv-img{max-width:100%;max-height:calc(100vh - 80px);object-fit:contain}
.iv-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(#000b,transparent)}
.iv-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:none;color:#fff;width:42px;height:42px;border-radius:50%;font-size:22px;cursor:pointer}
.iv-nav:hover{background:rgba(255,255,255,.2)}

/* ─── Empty/Loading ─── */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty-ic{font-size:44px;opacity:.35;margin-bottom:10px}
.empty-t{font-size:14px;font-weight:600}
.empty-s{font-size:12px;margin-top:3px}
.ld{display:flex;align-items:center;justify-content:center;height:180px;gap:9px;color:var(--muted)}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── Toast ─── */
#toasts{position:fixed;bottom:22px;right:18px;z-index:900;display:flex;flex-direction:column;gap:7px}
.toast{background:var(--card);border:1px solid var(--bdr);border-radius:9px;padding:10px 14px;min-width:220px;max-width:340px;box-shadow:var(--shadow);display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;animation:tin .25s ease}
.toks{border-left:3px solid var(--green)}.toke{border-left:3px solid var(--red)}.toki{border-left:3px solid var(--acc)}
@keyframes tin{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ─── Misc ─── */
.qbox{background:rgba(230,126,34,.08);border:1px solid rgba(230,126,34,.25);border-radius:7px;padding:10px;font-size:12px;color:var(--yel);margin-top:8px}
.info-box{background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}

/* ─── Responsive ─── */
@media(max-width:768px){
  .sb{transform:translateX(-100%)}.sb.on{transform:translateX(0)}
  .mc{margin-left:0}.hmbg{display:flex}
  .dg,.g2{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
  .ov{align-items:flex-end;padding:0}
  .modal{border-radius:14px 14px 0 0;max-height:95vh}
}
</style>
</head>
<body>

<!-- ══ CONFIG ══ -->

<!-- ══ LOGIN ══ -->
<div id="screen-login" class="dn">
  <div class="a-card" style="max-width:440px">
    <div class="logo">
      <div class="logo-i">I</div>
      <div><div class="logo-t">Indira OMS</div><div class="logo-s">v2.3</div></div>
    </div>
    <div class="tabs" style="margin-bottom:18px">
      <div class="tab on" id="lt-staff" onclick="switchLTab('staff')">👤 Staff</div>
      <div class="tab" id="lt-owner" onclick="switchLTab('owner')">👑 Owner</div>
      <div class="tab" id="lt-track" onclick="switchLTab('track')">🔍 Track</div>
    </div>

    <!-- Staff -->
    <div id="lp-staff">
      <div id="l-err"></div>
      <div class="fg"><label class="fl">Role</label>
        <select class="fi" id="l-role" onchange="onRolePick(this.value)">
          <option value="">— Select Role —</option>
          <option value="sales">🛍️ Sales</option>
          <option value="branch_head">🏬 Branch Head</option>
          <option value="factory_head">🏭 Factory Head</option>
          <option value="carpenter">🔨 Carpenter</option>
          <option value="quality_check">🔍 Quality Check</option>
          <option value="driver">🚚 Delivery</option>
        </select>
      </div>
      <div class="fg dn" id="l-user-wrap"><label class="fl">Your Name</label>
        <select class="fi" id="l-user"><option value="">Loading…</option></select>
      </div>
      <div class="fg"><label class="fl">Password</label>
        <div class="fi-wrap"><input class="fi" id="l-pass" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
          <button class="fi-eye" onclick="toggleEye('l-pass',this)">👁</button></div>
      </div>
      <button class="btn bp bfull" id="l-btn" onclick="doLogin()">Sign In</button>
      <p style="margin-top:10px;font-size:12px;text-align:center;color:var(--muted)">New? <a href="#" onclick="openRegModal();return false">Register account</a></p>
    </div>

    <!-- Owner -->
    <div id="lp-owner" class="dn">
      <div id="lo-err"></div>
      <div class="fg"><label class="fl">Owner Password</label>
        <div class="fi-wrap"><input class="fi" id="lo-pass" type="password" placeholder="Enter owner password" onkeydown="if(event.key==='Enter')doOwnerLogin()">
          <button class="fi-eye" onclick="toggleEye('lo-pass',this)">👁</button></div>
      </div>
      <button class="btn bp bfull" onclick="doOwnerLogin()">Sign In as Owner</button>
    </div>

    <!-- Track -->
    <div id="lp-track" class="dn">
      <div class="fg"><label class="fl">Tracking Code</label>
        <input class="fi" id="track-inp" placeholder="e.g. TRK-ABC123" onkeydown="if(event.key==='Enter')doTrack()">
      </div>
      <button class="btn bp bfull" onclick="doTrack()">Track</button>
      <div id="track-out" style="margin-top:14px"></div>
    </div>

    
  </div>
</div>

<!-- ══ REGISTER MODAL ══ -->
<div id="reg-ov" class="ov dn" onclick="if(event.target===this)closeReg()">
  <div class="modal">
    <div class="mh"><div><div class="mh-t">📝 Register Account</div></div><div class="mc-x" onclick="closeReg()">×</div></div>
    <div class="mb">
      <div id="reg-err"></div><div id="reg-ok"></div>
      <div class="fg"><label class="fl">Full Name *</label><input class="fi" id="reg-name" placeholder="Your full name"></div>
      <div class="g2">
        <div class="fg"><label class="fl">Role</label>
          <select class="fi" id="reg-role"><option value="sales">Sales</option><option value="branch_head">Branch Head</option><option value="factory_head">Factory Head</option><option value="carpenter">Carpenter</option><option value="quality_check">Quality Check</option><option value="driver">Delivery</option></select>
        </div>
        <div class="fg"><label class="fl">Branch</label>
          <select class="fi" id="reg-branch"><option>Steel Main Branch</option><option>Vengamedu Branch</option><option>Chennimalai Branch</option><option>Factory</option></select>
        </div>
      </div>
      <div class="g2">
        <div class="fg"><label class="fl">Email</label><input class="fi" id="reg-email" type="email" placeholder="you@email.com"></div>
        <div class="fg"><label class="fl">Phone</label><input class="fi" id="reg-phone" type="tel" placeholder="Phone number"></div>
      </div>

<script>
'use strict';
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

let DB = null;
let ME = null;
let ORDERS = [];
let USERS = [];
let TASKS = [];
let PAGE = 'dashboard';
let _bhTab = 'pending';
let _ordSearch = '', _ordStatus = '', _ordPri = '', _ordSort = 'newest';
let _usrSearch = '', _usrFilter = 'pending';
let _tskFilter = 'pending';
let _newProds = [];
let _ivUrls = [], _ivIdx = 0;

const ROLES = {sales:'Sales',branch_head:'Branch Head',factory_head:'Factory Head',carpenter:'Carpenter',quality_check:'Quality Check',driver:'Delivery',owner:'Owner'};
const BRANCHES = ['Steel Main Branch','Vengamedu Branch','Chennimalai Branch','Factory'];
const PRIS = ['High','Medium','Normal'];
const MFR = ['Pending Approval','Query Raised','Approved','Sent to Factory','Assigned to Carpenter','In Production','Quality Check','Ready for Dispatch','Out for Delivery','Delivered'];
const VEN = ['Pending Approval','Query Raised','Approved','Order Placed','Product Received','Out for Delivery','Delivered'];
const STK = ['Pending Approval','Query Raised','Approved','Out for Delivery','Delivered'];

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INIT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function mkDB(url, key){

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SCREEN HELPERS

function hide(id){g(id).classList.add('dn')}
function show(id){g(id).classList.remove('dn')}
function g(id){return document.getElementById(id)}
function ls(k,v){try{localStorage.setItem(k,v)}catch(_){}}
function gl(k){try{return localStorage.getItem(k)||''}catch(_){return''}}
function err(m){return`<div class="err">${m}</div>`}
function ok(m){return`<div class="ok">${m}</div>`}

function showLogin(){

}
function showApp(user){
  ME = user;
  hide('screen-login'); show('screen-app');
  g('u-av').textContent=(user.name||'?')[0].toUpperCase();
  g('u-nm').textContent=user.name;

    g('lt-'+x).classList.toggle('on',x===t);
    g('lp-'+x).classList.toggle('dn',x!==t);

}

async function onRolePick(role){
  const wrap=g('l-user-wrap'), sel=g('l-user');
  if(!role){hide('l-user-wrap');return}
  show('l-user-wrap');
  sel.innerHTML='<option>Loading…</option>';
  try{
    const {data,error}=await DB.from('users').select('id,name').eq('role',role).eq('approved',true).eq('status','active').order('name');
    if(error) throw error;
    if(!data||!data.length){sel.innerHTML='<option value="">No active users</option>';return}
    sel.innerHTML='<option value="">— Select Name —</option>'+(data.map(u=>`<option value="${u.id}">${u.name}</option>`).join(''));
  }catch(e){sel.innerHTML='<option>Error loading</option>'}
}

async function doLogin(){
  const role=g('l-role').value, uid=g('l-user').value, pass=g('l-pass').value;
  const el=g('l-err');
  if(!role){el.innerHTML=err('Select role');return}
  if(!uid){el.innerHTML=err('Select your name');return}
  if(!pass){el.innerHTML=err('Enter password');return}
  const btn=g('l-btn'); btn.classList.add('bload'); btn.textContent='Signing in…';
  el.innerHTML='';
  try{
    const {data,error}=await DB.from('users').select('*').eq('id',uid).eq('role',role).eq('password',pass).maybeSingle();
    if(error) throw error;
    if(!data){el.innerHTML=err('Incorrect password');return}
    if(!data.approved||data.status==='pending'){el.innerHTML=err('Account pending owner approval');return}
    if(data.status==='suspended'){el.innerHTML=err('Account suspended. Contact owner.');return}
    sessionStorage.setItem('me',JSON.stringify(data));
    showApp(data);
  }catch(e){el.innerHTML=err(e.message)}
  finally{btn.classList.remove('bload');btn.textContent='Sign In'}
}

  el.innerHTML='';
  try{
    let {data}=await DB.from('users').select('*').eq('id','owner-1').eq('password',pass).maybeSingle();

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// DATA
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function bootData(){
  await loadAll();
  // Realtime
  DB.channel('ch-ord').on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>loadOrders().then(()=>{refresh();badges()})).subscribe();
  DB.channel('ch-usr').on('postgres_changes',{event:'*',schema:'public',table:'users'},()=>loadUsers().then(()=>{refresh();badges()})).subscribe();
  DB.channel('ch-tsk').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>loadTasks().then(()=>{refresh();badges()})).subscribe();
  go('dashboard');
}
async function loadAll(){ await Promise.all([loadOrders(),loadUsers(),loadTasks()]); badges(); }
async function loadOrders(){
  try{const{data}=await DB.from('orders').select('*').order('created_at',{ascending:false}); ORDERS=data||[]}catch(_){ORDERS=[]}
}
async function loadUsers(){
  try{const{data}=await DB.from('users').select('*').order('name'); USERS=data||[]}catch(_){USERS=[]}
}
async function loadTasks(){
  try{
    let q=DB.from('tasks').select('*').order('created_at',{ascending:false});
    if(ME.role!=='owner') q=q.eq('assigned_to_id',ME.id);
    const{data}=await q; TASKS=data||[];
  }catch(_){TASKS=[]}
}

function badges(){
  const vis=visOrders();
  const pendOrd=vis.filter(o=>(o.products||[]).some(p=>['Pending Approval','Query Raised'].includes(p.product_status))).length;
  const pendTsk=TASKS.filter(t=>t.status==='pending'||t.status==='doubt').length;
  const pendUsr=USERS.filter(u=>!u.approved||u.status==='pending').length;
  setBadge('badge-ord',pendOrd);
  setBadge('badge-tsk',pendTsk);
  setBadge('badge-usr',pendUsr);
}
function setBadge(id,n){const el=g(id);if(!el)return;el.textContent=n;el.classList.toggle('dn',n===0)}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// NAVIGATION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const PAGE_TITLES={dashboard:'Dashboard',orders:'Orders',tasks:'Tasks',users:'Users',password:'Change Password'};
function go(p){
  PAGE=p;
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('on'));
  const ni=g('ni-'+p); if(ni) ni.classList.add('on');
  g('tb-t').textContent=PAGE_TITLES[p]||p;
  g('tb-a').innerHTML='';
  closeSb();
  render();
}
function refresh(){if(g('pg'))render()}
function toggleSb(){g('sb').classList.toggle('on');g('sb-ov').classList.toggle('on')}
function closeSb(){g('sb').classList.remove('on');g('sb-ov').classList.remove('on')}
function render(){
  switch(PAGE){
    case'dashboard':renderDash();break;
    case'orders':renderOrders();break;
    case'tasks':renderTasks();break;
    case'users':renderUsers();break;
    case'password':renderPass();break;
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// DASHBOARD
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderDash(){
  const vis=visOrders();
  const active=vis.filter(o=>!['Delivered','Closed'].includes(o.status));
  const deliv=vis.filter(o=>o.status==='Delivered');
  const high=vis.filter(o=>o.priority==='High'&&!['Delivered','Closed'].includes(o.status));
  const pend=vis.filter(o=>(o.products||[]).some(p=>['Pending Approval','Query Raised'].includes(p.product_status)));
  const pendUsr=USERS.filter(u=>!u.approved||u.status==='pending');
  // Status breakdown
  const sc={};vis.forEach(o=>{sc[o.status]=(sc[o.status]||0)+1});
  const stRows=Object.entries(sc).sort((a,b)=>b[1]-a[1]).map(([s,c])=>`
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">
      <div style="width:7px;height:7px;border-radius:50%;background:${stColor(s)};flex-shrink:0"></div>
      <span style="flex:1;font-size:12px;color:var(--muted)">${s}</span>
      <span style="font-weight:700;font-size:12px">${c}</span>
    </div>`).join('');

  g('pg').innerHTML=`
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px">
      <div>
        <div style="font-size:19px;font-weight:800">${greeting()}, ${(ME.name||'').split(' ')[0]} 👋</div>
        <div style="display:flex;align-items:center;gap:7px;margin-top:4px">
          <span class="rtag">${ROLES[ME.role]||ME.role}</span>
          ${ME.branch?`<span style="font-size:11px;color:var(--muted)">${ME.branch}</span>`:''}
        </div>
      </div>
      ${high.length?`<div style="background:rgba(224,60,49,.1);border:1px solid rgba(224,60,49,.3);border-radius:8px;padding:7px 13px;font-size:12px;color:var(--red);font-weight:700">⚠️ ${high.length} High Priority</div>`:''}
    </div>
    <div class="stat-grid">
      ${sc2('#acc',active.length,'📦 Active Orders')}
      ${sc2('#green',deliv.length,'✅ Delivered')}
      ${sc2('#red',high.length,'🔴 High Priority')}
      ${['owner','branch_head'].includes(ME.role)?sc2('#yel',pend.length,'⏳ Pending Approval'):''}
      ${ME.role==='owner'?sc2('#blue',pendUsr.length,'👤 Pending Users'):''}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="info-box">
        <div class="sec-t">📈 Status Breakdown</div>
        ${stRows||'<div class="empty"><div class="empty-t">No orders yet</div></div>'}
      </div>
      <div class="info-box">
        <div class="sec-t">🚀 Recent Orders</div>
        ${vis.slice(0,6).map(o=>`
          <div onclick="openOrd('${o.order_id}')" style="padding:7px 0;border-bottom:1px solid var(--bdr);cursor:pointer;display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-size:11px;color:var(--acc);font-weight:700;font-family:'DM Mono',monospace">${o.tracking_code}</div>
              <div style="font-size:12px;font-weight:600">${o.customer_name}</div>
            </div>
            <span class="badge ${badgeSt(o.status)}" style="font-size:9px">${o.status}</span>
          </div>`).join('')||'<div class="empty"><div class="empty-t">No orders</div></div>'}
      </div>
    </div>`;
}
function sc2(col,n,lbl){return`<div class="stat-c" style="border-left:3px solid var(${col})"><div class="stat-n" style="color:var(${col})">${n}</div><div class="stat-l">${lbl}</div></div>`}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ORDERS LIST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Exact port of Flutter filter logic from orders_screen.dart
function visOrders(){
  let o=[...ORDERS];
  switch(ME.role){
    // Sales: only their own orders
    case'sales':
      o=o.filter(x=>x.sales_person===ME.name);
      break;
    // Branch head: branch orders (tab logic applied in renderOrders)
    case'branch_head':
      o=o.filter(x=>x.branch_name===ME.branch);
      break;
    // Factory head: manufacture products in factory pipeline
    case'factory_head':
      o=o.filter(x=>(x.products||[]).some(p=>
        p.product_type==='manufacture'&&
        ['Sent to Factory','Assigned to Carpenter','In Production','Quality Check','Ready for Dispatch'].includes(p.product_status)
      ));
      break;
    // Carpenter: only their assigned products still in active work (not yet at QC or beyond)
    case'carpenter':
      o=o.filter(x=>(x.products||[]).some(p=>
        p.assigned_to===ME.name&&
        p.product_type==='manufacture'&&
        !['Quality Check','Ready for Dispatch','Out for Delivery','Delivered'].includes(p.product_status)
      ));
      o.sort((a,b)=>({High:0,Medium:1,Normal:2}[a.priority]||2)-({High:0,Medium:1,Normal:2}[b.priority]||2));
      break;
    // QC: only orders with a product in Quality Check
    case'quality_check':
      o=o.filter(x=>(x.products||[]).some(p=>p.product_status==='Quality Check'));
      break;
    // Driver: only orders with products Out for Delivery (NOT Ready for Dispatch)
    case'driver':
      o=o.filter(x=>(x.products||[]).some(p=>p.product_status==='Out for Delivery'));
      break;
  }
  return o;
}

function renderOrders(){
  if(['sales','owner'].includes(ME.role))
    g('tb-a').innerHTML=`<button class="btn bp bsm" onclick="openCreateOrd()">+ New Order</button>`;
  else
    g('tb-a').innerHTML='';

  // Branch Head: exact 3-tab layout matching Flutter app
  if(ME.role==='branch_head'){
    const branchOrders=ORDERS.filter(o=>o.branch_name===ME.branch);

    // Tab 1 – Pending: order-level status is waiting/query
    const pendingVis=branchOrders.filter(o=>
      o.status==='Waiting for Branch Approval'||o.status==='Query Raised'
    );

    // Tab 2 – Orders: active, not pending, no product is Ready for Dispatch
    const listVis=branchOrders.filter(o=>
      !['Delivered','Closed','Waiting for Branch Approval','Query Raised'].includes(o.status)&&
      !(o.products||[]).some(p=>p.product_status==='Ready for Dispatch')
    );

    // Tab 3 – Ready: any product is Ready for Dispatch (QC passed)
    const readyVis=branchOrders.filter(o=>
      (o.products||[]).some(p=>p.product_status==='Ready for Dispatch')
    );

    function tabBadge(lbl,cnt,col){
      return `<div class="tab ${_bhTab===lbl?'on':''}" onclick="_bhTab='${lbl}';renderOrders()" style="display:flex;align-items:center;gap:5px">
        ${lbl}
        ${cnt>0?`<span style="background:${col};color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center">${cnt}</span>`:''}
      </div>`;
    }

    let listHtml='';
    if(_bhTab==='Pending'){
      listHtml=pendingVis.length
        ? pendingVis.map(ordCard).join('')
        : emptyState('📋','No pending orders','All orders are approved or in progress');
    } else if(_bhTab==='Orders'){
      listHtml=listVis.length
        ? listVis.map(ordCard).join('')
        : emptyState('📦','No active orders','');
    } else {
      // Ready tab — special QC-passed dispatch cards
      listHtml=readyVis.length
        ? readyVis.map(readyCard).join('')
        : emptyState('🚚','No orders ready for dispatch','Waiting for quality check');
    }

    g('pg').innerHTML=`
      <div class="tabs">
        ${tabBadge('Pending',pendingVis.length,'var(--red)')}
        ${tabBadge('Orders',listVis.length,'var(--blue)')}
        ${tabBadge('Ready',readyVis.length,'var(--green)')}
      </div>
      <div id="ord-list">${listHtml}</div>`;
    return;
  }

  // Driver: special delivery-focused list
  if(ME.role==='driver'){
    const vis=visOrders();
    g('pg').innerHTML=`
      ${vis.length?`<div style="background:rgba(45,125,210,.1);border:1px solid rgba(45,125,210,.25);border-radius:8px;padding:9px 13px;margin-bottom:12px;display:flex;align-items:center;gap:8px">
        <span style="font-size:16px">🚚</span>
        <span style="color:var(--blue);font-weight:700;font-size:13px">${vis.length} delivery order${vis.length===1?'':'s'} pending</span>
      </div>`:''}
      <div id="ord-list">${vis.map(driverCard).join('')||emptyState('🚚','No deliveries pending','All caught up!')}</div>`;
    return;
  }

  // All other roles: standard filtered list
  let vis=visOrders();
  const allSt=[...new Set(ORDERS.map(o=>o.status))].sort();

  if(_ordSearch){const s=_ordSearch.toLowerCase();vis=vis.filter(o=>
    o.tracking_code?.toLowerCase().includes(s)||
    o.customer_name?.toLowerCase().includes(s)||
    o.sales_person?.toLowerCase().includes(s)||
    (o.customer_number1||'').includes(s)||
    (o.address||'').toLowerCase().includes(s)
  )}
  // Default: hide Closed & Delivered unless explicitly filtered
  if(_ordStatus) vis=vis.filter(o=>o.status===_ordStatus);
  else vis=vis.filter(o=>!['Closed','Delivered'].includes(o.status));
  if(_ordPri) vis=vis.filter(o=>o.priority===_ordPri);
  if(ME.role!=='carpenter'){
    if(_ordSort==='newest') vis.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    else if(_ordSort==='delivery') vis.sort((a,b)=>new Date(a.delivery_date)-new Date(b.delivery_date));
    else if(_ordSort==='value') vis.sort((a,b)=>(b.total_order_value||0)-(a.total_order_value||0));
  }

  g('pg').innerHTML=`
    <div class="toolbar">
      <div class="s-wrap"><span class="s-ic">🔍</span><input class="s-in" type="text" placeholder="Search tracking, customer, phone…" value="${_ordSearch}" oninput="_ordSearch=this.value;renderOrders()"></div>
      <select class="fsel" onchange="_ordStatus=this.value;renderOrders()">
        <option value="">All Statuses</option>
        ${allSt.map(s=>`<option value="${s}"${_ordStatus===s?' selected':''}>${s}</option>`).join('')}
      </select>
      <select class="fsel" onchange="_ordPri=this.value;renderOrders()">
        <option value="">All Priorities</option>
        ${PRIS.map(p=>`<option value="${p}"${_ordPri===p?' selected':''}>${p}</option>`).join('')}
      </select>
      ${ME.role!=='carpenter'?`<select class="fsel" onchange="_ordSort=this.value;renderOrders()">
        <option value="newest"${_ordSort==='newest'?' selected':''}>Newest First</option>
        <option value="delivery"${_ordSort==='delivery'?' selected':''}>Nearest Delivery</option>
        <option value="value"${_ordSort==='value'?' selected':''}>Highest Value</option>
      </select>`:''}
    </div>
    <div id="ord-list">
      ${vis.map(ordCard).join('')||emptyState('📭','No orders found','Try adjusting filters')}
    </div>`;
}

async function dispatchOrder(oid){
  if(!confirm('Mark order as Out for Delivery? Driver will be notified.'))return;
  const o=ORDERS.find(x=>x.order_id===oid); if(!o)return;
  const prods=JSON.parse(JSON.stringify(o.products||[]));
  prods.forEach(p=>{if(p.product_status==='Ready for Dispatch')p.product_status='Out for Delivery'});
  try{
    const{error}=await DB.from('orders').update({products:prods,status:'Out for Delivery'}).eq('order_id',oid);
    if(error)throw error;
    toast('ok','🚚 Dispatched — Out for Delivery');
    closeDyn();
    await loadOrders();
    renderOrders();
  }catch(e){toast('err',e.message)}
}

function prodCard(p,idx,order,canBH,canFH,isCarp,isQC,isDrv,isOwn){
  const stages=p.product_type==='vendor'?VEN:p.product_type==='stock'?STK:MFR;
  const si=stages.indexOf(p.product_status);
  const pct=Math.max(0,Math.min(100,(Math.max(0,si)/(stages.length-1))*100));

    acts+=`<button class="btn bp bxs" onclick="setProdSt('${oid}',${idx},'In Production')">⚙️ Start Production</button>`;
  if(isQC&&p.product_status==='Quality Check')
    acts+=`<button class="btn bg2 bxs" onclick="setProdSt('${oid}',${idx},'Ready for Dispatch')">✅ Passed QC</button>`;

  return`<div class="p-card">
    <div class="p-hd">
      <div>
        <div class="p-nm">${p.product_name||'Unnamed'}</div>
        <div class="p-mt">${[p.material_type,p.size,p.color].filter(Boolean).join(' · ')}</div>
        <div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">

          <span class="badge bpend">${p.product_status||'Pending'}</span>
          ${(p.quantity||1)>1?`<span class="badge bnorm">Qty:${p.quantity}</span>`:''}
        </div>
      </div>
      <div style="text-align:right">
        ${p.unit_value?`<div style="font-size:12px;font-weight:700;color:var(--green)">₹${Number(p.unit_value).toLocaleString('en-IN')}</div>`:''}
        ${p.assigned_to?`<div style="font-size:10px;color:var(--muted)">👷 ${p.assigned_to}</div>`:''}
      </div>
    </div>
    <div class="prog-w"><div class="prog-b" style="width:${pct}%"></div></div>
    <div style="font-size:10px;color:var(--muted);margin-top:2px">${Math.max(0,si)+1}/${stages.length} · ${Math.round(pct)}%</div>
    ${p.product_query?`<div class="qbox">💬 Query: ${p.product_query}</div>`:''}
    ${allImgs.length?`<div class="img-row">${allImgs.map((u,i)=>`<img class="imt" src="${u}" onclick="openIV(${JSON.stringify(allImgs)},${i},'${p.product_name||'Product'} Images')">`).join('')}</div>`:''}
    ${acts?`<div class="p-acts">${acts}</div>`:''}
  </div>`;
}

// ─── Product Status Actions ───
async function setProdSt(oid,idx,newSt){
  const o=ORDERS.find(x=>x.order_id===oid); if(!o)return;
  const prods=JSON.parse(JSON.stringify(o.products||[]));
  prods[idx].product_status=newSt;
  const ovSt=calcOrdSt(prods);
  try{
    const{error}=await DB.from('orders').update({products:prods,status:ovSt}).eq('order_id',oid);
    if(error)throw error;
    toast('ok','Updated to '+newSt);
    await loadOrders();
    openOrd(oid);
  }catch(e){toast('err',e.message)}
}

async function approveProd(oid,idx){
  const o=ORDERS.find(x=>x.order_id===oid); if(!o)return;
  const prods=JSON.parse(JSON.stringify(o.products||[]));
  prods[idx].product_status='Approved';
  prods[idx].product_query='';
  const ovSt=calcOrdSt(prods);
  try{
    const{error}=await DB.from('orders').update({products:prods,status:ovSt,branch_approved:'yes'}).eq('order_id',oid);
    if(error)throw error;
    toast('ok','Product approved!');
    await loadOrders(); openOrd(oid);
  }catch(e){toast('err',e.message)}
}

async function queryProd(oid,idx){
  const q=prompt('Enter your query for this product:');
  if(!q)return;
  const o=ORDERS.find(x=>x.order_id===oid); if(!o)return;
  const prods=JSON.parse(JSON.stringify(o.products||[]));
  prods[idx].product_status='Query Raised';
  prods[idx].product_query=q;
  const ovSt=calcOrdSt(prods);
  try{
    const{error}=await DB.from('orders').update({products:prods,status:ovSt,branch_query:q}).eq('order_id',oid);
    if(error)throw error;
    toast('info','Query raised');
    await loadOrders(); openOrd(oid);
  }catch(e){toast('err',e.message)}
}

async function assignCarp(oid,idx){
  const carps=USERS.filter(u=>u.role==='carpenter'&&u.approved&&u.status==='active');
  if(!carps.length){toast('err','No active carpenters');return}
  const sel=prompt('Select carpenter:\n'+carps.map((c,i)=>`${i+1}. ${c.name}`).join('\n')+'\nEnter number:');
  if(!sel)return;
  const ci=parseInt(sel)-1;
  if(ci<0||ci>=carps.length){toast('err','Invalid');return}
  const c=carps[ci];
  const o=ORDERS.find(x=>x.order_id===oid); if(!o)return;
  const prods=JSON.parse(JSON.stringify(o.products||[]));
  prods[idx].product_status='Assigned to Carpenter';
  prods[idx].assigned_to=c.name;
  const ovSt=calcOrdSt(prods);
  try{
    const{error}=await DB.from('orders').update({products:prods,status:ovSt,factory_assigned_to:c.name}).eq('order_id',oid);
    if(error)throw error;
    toast('ok','Assigned to '+c.name);
    await loadOrders(); openOrd(oid);
  }catch(e){toast('err',e.message)}
}

async function markDelivered(oid){
  if(!confirm('Mark order as Delivered?'))return;
  const o=ORDERS.find(x=>x.order_id===oid); if(!o)return;
  const prods=JSON.parse(JSON.stringify(o.products||[]));
  prods.forEach(p=>{if(['Out for Delivery','Ready for Dispatch'].includes(p.product_status))p.product_status='Delivered'});
  try{
    const{error}=await DB.from('orders').update({products:prods,status:'Delivered'}).eq('order_id',oid);
    if(error)throw error;
    toast('ok','Delivered!');
    await loadOrders(); closeDyn();
  }catch(e){toast('err',e.message)}
}

async function closeOrd(oid){
  if(!confirm('Close this order?'))return;
  try{
    await DB.from('orders').update({status:'Closed'}).eq('order_id',oid);
    toast('info','Order closed'); await loadOrders(); closeDyn(); if(PAGE==='orders')renderOrders();
  }catch(e){toast('err',e.message)}
}

async function editPri(oid,cur){
  const opts=PRIS.map((p,i)=>`${i+1}. ${p}`).join('\n');
  const sel=prompt(`Change priority:\n${opts}\nEnter number (current: ${cur}):`);
  if(!sel)return;
  const pi=parseInt(sel)-1;
  if(pi<0||pi>=PRIS.length)return;
  try{
    await DB.from('orders').update({priority:PRIS[pi]}).eq('order_id',oid);
    toast('ok','Priority: '+PRIS[pi]); await loadOrders(); openOrd(oid);
  }catch(e){toast('err',e.message)}
}

async function editDates(oid,cur,curF){
  const nd=prompt('New delivery date (YYYY-MM-DD):',cur); if(!nd)return;
  const nf=prompt('Factory deadline (YYYY-MM-DD, leave blank to keep):',curF);
  const upd={delivery_date:nd};
  if(nf!==null&&nf!=='') upd.factory_delivery_date=nf;
  try{
    await DB.from('orders').update(upd).eq('order_id',oid);
    toast('ok','Dates updated'); await loadOrders(); openOrd(oid);
  }catch(e){toast('err',e.message)}
}

function calcOrdSt(prods){
  if(!prods.length)return'Order Created';
  const sts=prods.map(p=>p.product_status);
  if(sts.every(s=>s==='Delivered'))return'Delivered';
  if(sts.every(s=>['Out for Delivery','Delivered'].includes(s)))return'Out for Delivery';
  if(sts.every(s=>['Ready for Dispatch','Out for Delivery','Delivered'].includes(s)))return'Ready for Dispatch';
  if(sts.some(s=>['Pending Approval','Query Raised'].includes(s)))return'Waiting for Branch Approval';
  if(sts.some(s=>['In Production','Assigned to Carpenter'].includes(s)))return'In Production';
  if(sts.some(s=>s==='Quality Check'))return'Quality Check';
  if(sts.some(s=>s==='Sent to Factory'))return'Sent to Factory';
  if(sts.some(s=>s==='Order Placed'))return'In Progress';
  if(sts.every(s=>s==='Approved'))return'Approved by Branch';
  return'Waiting for Branch Approval';
}

// USERS

function renderUsers(){
  g('tb-a').innerHTML=`<button class="btn bp bsm" onclick="openAddUser()">+ Add User</button>`;
  let vis=USERS.filter(u=>u.id!=='owner-1');
  if(_usrSearch){const s=_usrSearch.toLowerCase();vis=vis.filter(u=>u.name?.toLowerCase().includes(s)||u.email?.toLowerCase().includes(s)||u.phone?.includes(s))}
  const pend=vis.filter(u=>!u.approved||u.status==='pending');
  const act=vis.filter(u=>u.approved&&u.status==='active');
  const susp=vis.filter(u=>u.status==='suspended');
  const show=_usrFilter==='pending'?pend:_usrFilter==='active'?act:susp;
  g('pg').innerHTML=`
    <div class="s-wrap" style="max-width:340px;margin-bottom:12px"><span class="s-ic">🔍</span><input class="s-in" placeholder="Search users…" value="${_usrSearch}" oninput="_usrSearch=this.value;renderUsers()"></div>
    <div class="chips">
      <div class="chip ${_usrFilter==='pending'?'on':''}" onclick="_usrFilter='pending';renderUsers()">⏳ Pending (${pend.length})</div>
      <div class="chip ${_usrFilter==='active'?'on':''}" onclick="_usrFilter='active';renderUsers()">✅ Active (${act.length})</div>
      <div class="chip ${_usrFilter==='suspended'?'on':''}" onclick="_usrFilter='suspended';renderUsers()">🚫 Suspended (${susp.length})</div>
    </div>
    ${show.map(usrCard).join('')||'<div class="empty"><div class="empty-ic">👥</div><div class="empty-t">No users here</div></div>'}`;
}

function usrCard(u){
  const stc=u.status==='active'?'var(--green)':u.status==='suspended'?'var(--red)':'var(--yel)';
  return`<div class="uc">
    <div class="uc-av">${(u.name||'?')[0].toUpperCase()}</div>
    <div class="uc-i">
      <div class="uc-nm">${u.name} <span class="rtag">${ROLES[u.role]||u.role}</span></div>
      <div class="uc-mt">${u.branch||''} · ${u.email||''}</div>
      <div style="font-size:10px;color:${stc};font-weight:700;margin-top:2px">${(u.status||'').toUpperCase()}${!u.approved?' · NOT APPROVED':''}</div>
    </div>
    <div class="uc-acts">
      ${(!u.approved||u.status==='pending')?`<button class="btn bg2 bxs" onclick="approveUsr('${u.id}')">✅</button>`:''}
      ${u.status==='active'?`<button class="btn bs bxs" onclick="resetPass('${u.id}','${u.name}')">🔑</button><button class="btn bd bxs" onclick="suspendUsr('${u.id}')">🚫</button>`:''}
      ${u.status==='suspended'?`<button class="btn bg2 bxs" onclick="unsuspendUsr('${u.id}')">✅</button>`:''}
      <button class="btn bd bxs" onclick="deleteUsr('${u.id}','${u.name}')">🗑</button>
    </div>
  </div>`;
}

async function approveUsr(id){try{const{e}=await DB.from('users').update({approved:true,status:'active'}).eq('id',id);if(e)throw e;toast('ok','Approved!');await loadUsers();renderUsers()}catch(e){toast('err',e.message)}}
async function suspendUsr(id){if(!confirm('Suspend?'))return;try{await DB.from('users').update({status:'suspended'}).eq('id',id);toast('info','Suspended');await loadUsers();renderUsers()}catch(e){toast('err',e.message)}}
async function unsuspendUsr(id){try{await DB.from('users').update({status:'active'}).eq('id',id);toast('ok','Reactivated');await loadUsers();renderUsers()}catch(e){toast('err',e.message)}}
async function deleteUsr(id,name){if(!confirm(`Delete "${name}"?`))return;try{await DB.from('users').delete().eq('id',id);await loadUsers();renderUsers()}catch(e){toast('err',e.message)}}

async function doCP(){

  if(o!==ME.password){el.innerHTML=err('Current password incorrect');return}
  try{
    const{error}=await DB.from('users').update({password:n}).eq('id',ME.id);

function openIV(urls,idx,title){

  show('iv-ov');renderIV();
}
function renderIV(){
  g('iv-img').src=_ivUrls[_ivIdx];
  g('iv-ctr').textContent=_ivUrls.length>1?`${_ivIdx+1}/${_ivUrls.length}`:'';
  g('iv-prev').style.display=_ivIdx>0?'':'none';
  g('iv-next').style.display=_ivIdx<_ivUrls.length-1?'':'none';
}
function navIV(d){_ivIdx=Math.max(0,Math.min(_ivUrls.length-1,_ivIdx+d));renderIV()}

// TOAST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function toast(type,msg){
  const ic={ok:'✅',err:'❌',info:'ℹ️'};
  const tc={ok:'toks',err:'toke',info:'toki'};
  const el=document.createElement('div');
  el.className='toast '+tc[type];
  el.innerHTML=`<span>${ic[type]||'•'}</span><span>${msg}</span>`;
  g('toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},3200);
}

function fmtDate(s){
  if(!s)return'—';
  try{const d=new Date(s);return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',weekday:'short'})}catch(_){return s}
}
function fmtRel(s){
  if(!s)return'';
  try{
    const diff=Math.floor((Date.now()-new Date(s))/1000);
    if(diff<60)return'just now';if(diff<3600)return Math.floor(diff/60)+'m ago';
    if(diff<86400)return Math.floor(diff/3600)+'h ago';if(diff<604800)return Math.floor(diff/86400)+'d ago';
    return new Date(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
  }catch(_){return''}
}
function daysLeft(s){
  if(!s)return null;
  try{const d=new Date(s);d.setHours(0,0,0,0);const n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/86400000)}catch(_){return null}
}
function dlLbl(n){if(n===0)return'Today';if(n===1)return'Tomorrow';if(n===-1)return'Yesterday';return n<0?`${-n}d ago`:`${n}d`}
function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function ptIcon(t){return t==='vendor'?'🏪 ':t==='stock'?'📦 ':'🏭 '}
function stColor(s){
  const m={Delivered:'#27AE60','Out for Delivery':'#2D7DD2','Ready for Dispatch':'#2D7DD2','Quality Check':'#8E44AD','In Production':'#8E44AD','Assigned to Carpenter':'#E67E22','Sent to Factory':'#E67E22','Approved by Branch':'#2D7DD2','Waiting for Branch Approval':'#E8900A','Query Raised':'#E67E22',Closed:'#8B8FA8'};
  return m[s]||'#8B8FA8';
}
function badgeSt(s){
  if(!s)return'bnorm';
  if(['Delivered','Approved by Branch'].includes(s))return'bappr';
  if(['Pending Approval','Waiting for Branch Approval','Order Created'].includes(s))return'bpend';
  if(s==='Query Raised')return'bqry';
  if(['In Production','Assigned to Carpenter','Sent to Factory','Quality Check','Ready for Dispatch','Out for Delivery','In Progress','Order Placed','Product Received'].includes(s))return'bprod';
  return'bnorm';
}
function priB(p){return p==='High'?'bhigh':p==='Medium'?'bmed':'bnorm'}
